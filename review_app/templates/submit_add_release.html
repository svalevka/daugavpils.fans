{% extends "base.html" %}
{% block title %}{{ t.add_release_title }}{% endblock %}
{% block content %}
<h1>{{ t.add_release_heading }}</h1>
<p class="meta">{{ band_name }}</p>
<p>{{ t.add_release_desc }}</p>

<form method="post" action="/submit-release" enctype="multipart/form-data" data-album-form
      data-msg-uploading="{{ t.uploading_status }}"
      data-msg-processing="{{ t.uploading_processing }}"
      data-msg-network-error="{{ t.upload_network_error }}"
      data-msg-rate-limit="{{ t.upload_rate_limit_error }}"
      data-msg-server-error="{{ t.upload_server_error }}"
      data-msg-preview="{{ t.preview_audio }}"
      data-msg-pause="{{ t.pause_audio }}"
      data-msg-draft-restored="{{ t.draft_restored }}"
      data-msg-draft-clear="{{ t.draft_clear }}"
      data-msg-draft-cleared="{{ t.draft_cleared }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="band_slug" value="{{ band_slug }}">

  <div class="draft-banner" data-draft-banner style="display: none;">
    <span class="draft-banner-text" data-draft-text></span>
    <button type="button" class="draft-clear-btn" data-draft-clear>{{ t.draft_clear }}</button>
  </div>

  <div class="field">
    <label for="name">{{ t.album_name }} *</label>
    <input type="text" id="name" name="name" required placeholder="e.g. Карманный Мир">
  </div>

  <div class="field">
    <label for="date_published">{{ t.album_year }} *</label>
    <input type="text" id="date_published" name="date_published" required pattern="[0-9]{4}" placeholder="1993">
  </div>

  <div class="field">
    <label for="genre">{{ t.album_genre }}</label>
    <input type="text" id="genre" name="genre" placeholder="Hard Rock, Heavy Metal">
  </div>

  <div class="field">
    <label for="license">{{ t.album_license }}</label>
    <select id="license" name="license">
      {% for lic_url, lic_label in licenses %}
        <option value="{{ lic_url }}" {% if lic_url == default_license %}selected{% endif %}>{{ lic_label }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="cover">{{ t.album_cover }}</label>
    <input type="file" id="cover" name="cover" accept="image/jpeg,image/png,image/webp" data-album-cover-input>
    <div data-album-cover-preview></div>
  </div>

  <div class="field">
    <label>{{ t.album_tracks }} *</label>
    <noscript>
      <input type="file" id="noscript-tracks" name="tracks" multiple accept="audio/mpeg,audio/flac,audio/wav,audio/ogg,.mp3,.flac,.wav,.ogg">
    </noscript>
    <div class="upload-dropzone" data-album-dropzone>
      <input type="file" multiple accept="audio/mpeg,audio/flac,audio/wav,audio/ogg,.mp3,.flac,.wav,.ogg" data-album-audio-input hidden>
      <button type="button" class="btn" data-album-add-audio>+ {{ t.album_tracks }}</button>
      <span class="dropzone-hint meta">{{ t.drag_drop_hint }}</span>
    </div>
    <div data-album-track-list style="margin-top: 10px;"></div>
    <div class="upload-progress-container" data-album-progress style="display: none; margin-top: 15px;">
      <div class="progress-status meta" data-album-progress-status style="margin-bottom: 6px; font-weight: 500;"></div>
      <progress class="upload-progress-bar" data-album-progress-bar value="0" max="100" style="width: 100%; height: 10px;"></progress>
    </div>
    <div class="upload-error-banner" data-album-upload-error style="display: none; margin-top: 10px;"></div>
  </div>

  <div class="field">
    <label for="description">{{ t.album_description }}</label>
    <textarea id="description" name="description" rows="4" placeholder="История записи, состав, примечания..."></textarea>
  </div>

  <div class="field">
    <label for="description_en">{{ t.album_description_en }}</label>
    <textarea id="description_en" name="description_en" rows="3" placeholder="Recording history, liner notes..."></textarea>
  </div>

  <div class="field">
    <label for="submitter_name">{{ t.submitter_name }}</label>
    <input type="text" id="submitter_name" name="submitter_name">
  </div>

  <div class="field">
    <label for="submitter_contact">{{ t.submitter_contact_media }}</label>
    <input type="text" id="submitter_contact" name="submitter_contact">
  </div>

  <div class="field">
    <label for="challenge_answer">{{ t.challenge_question }}</label>
    <input type="text" id="challenge_answer" name="challenge_answer" required placeholder="{{ t.challenge_placeholder }}" autocomplete="off">
    <p class="meta">{{ t.challenge_hint }}</p>
  </div>

  <!-- honeypot: hidden from real visitors via CSS, never filled by a human -->
  <div class="field honeypot" aria-hidden="true">
    <label for="website">{{ t.honeypot_label }}</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit" data-album-submit data-original-text="{{ t.submit_button }}">{{ t.submit_button }}</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='draft_recovery.js') }}"></script>
<script src="{{ url_for('static', filename='album_upload.js') }}"></script>
{% endblock %}
