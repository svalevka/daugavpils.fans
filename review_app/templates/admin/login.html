{% extends "base.html" %}
{% block title %}Maintainer login — daugavpils.fans{% endblock %}
{% block content %}
<h1>Maintainer login</h1>
<p class="meta">Site statistics and analytics dashboard</p>
<form method="post" action="/admin/login">
  <div class="field">
    <label for="email">Maintainer email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <button type="submit">Send login link</button>
</form>
{% endblock %}
