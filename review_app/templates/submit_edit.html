<!doctype html>
<title>Propose an edit</title>
<h1>{{ label }}</h1>

<h2>Current text</h2>
<pre>{{ current_text }}</pre>

<form method="post" action="/submit">
  <input type="hidden" name="band_slug" value="{{ band_slug }}">
  {% if release_slug %}<input type="hidden" name="release_slug" value="{{ release_slug }}">{% endif %}
  <input type="hidden" name="target" value="{{ target }}">
  <input type="hidden" name="field" value="{{ field }}">
  {% if list_index is not none %}<input type="hidden" name="list_index" value="{{ list_index }}">{% endif %}

  <p>
    <label for="proposed_value">Your replacement text</label><br>
    <textarea id="proposed_value" name="proposed_value" rows="6" cols="60">{{ current_text }}</textarea>
  </p>

  <p>
    <label for="submitter_name">Your name (optional)</label><br>
    <input type="text" id="submitter_name" name="submitter_name">
  </p>
  <p>
    <label for="submitter_contact">Your email, if you'd like to be reachable (optional)</label><br>
    <input type="text" id="submitter_contact" name="submitter_contact">
  </p>

  <!-- honeypot: hidden from real visitors via CSS, never filled by a human -->
  <p style="position:absolute; left:-9999px;" aria-hidden="true">
    <label for="website">Leave this field blank</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </p>

  <button type="submit">Submit for review</button>
</form>
