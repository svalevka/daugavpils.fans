<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t.site_title }}{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="https://daugavpils.fans/{% if lang == 'en' %}en/{% endif %}">daugavpils.fans</a>
  <div class="header-right">
    <a class="support-link" href="https://daugavpils.fans/{% if lang == 'en' %}en/{% endif %}support/">{{ t.support_link }}</a>
    <nav class="lang-switch" aria-label="Language">
      <a href="{{ lang_switch_url('ru') }}"{% if lang == "ru" %} class="active" aria-current="true"{% endif %}>RU</a>
      <a href="{{ lang_switch_url('en') }}"{% if lang == "en" %} class="active" aria-current="true"{% endif %}>EN</a>
    </nav>
  </div>
</header>
<main class="{% block main_class %}{% endblock %}">
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
