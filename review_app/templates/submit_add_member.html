{% extends "base.html" %}
{% block title %}{{ t.add_member_title }}{% endblock %}
{% block content %}
<h1>{{ t.add_member_heading }}</h1>

<p class="meta">{{ t.add_member_hint }}</p>

<form method="post" action="/submit/{{ band_slug }}/add-member">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="name">{{ t.member_name }}</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="name_en">{{ t.member_name_en }}</label>
    <input type="text" id="name_en" name="name_en">
  </div>
  <div class="field">
    <label for="role">{{ t.member_role }}</label>
    <input type="text" id="role" name="role">
  </div>
  <div class="field">
    <label for="role_en">{{ t.member_role_en }}</label>
    <input type="text" id="role_en" name="role_en">
  </div>
  <div class="field">
    <label for="period">{{ t.member_period }}</label>
    <input type="text" id="period" name="period">
  </div>

  <div class="field">
    <label for="submitter_name">{{ t.submitter_name }}</label>
    <input type="text" id="submitter_name" name="submitter_name">
  </div>
  <div class="field">
    <label for="submitter_contact">{{ t.submitter_contact_edit }}</label>
    <input type="text" id="submitter_contact" name="submitter_contact">
  </div>

  <!-- honeypot: hidden from real visitors via CSS, never filled by a human -->
  <div class="field honeypot" aria-hidden="true">
    <label for="website">{{ t.honeypot_label }}</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit">{{ t.submit_button }}</button>
</form>
{% endblock %}
