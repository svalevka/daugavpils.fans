{% extends "base.html" %}
{% block title %}{{ t.pick_band_title }}{% endblock %}
{% block content %}
<h1>{{ t.pick_band_heading }}</h1>
<p class="meta">{{ t.pick_band_meta }}</p>
<ul class="item-list">
{% for band in bands %}

{% endfor %}
</ul>
{% endblock %}
