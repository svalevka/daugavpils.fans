{% extends "base.html" %}
{% block title %}{{ t.media_title }}{% endblock %}
{% block content %}
<h1>{{ t.media_heading }}</h1>
<p class="meta">{{ scope_label }}</p>
<p>{{ t.media_desc }}</p>

<form method="post" action="/submit-media" enctype="multipart/form-data">
  <input type="hidden" name="band_slug" value="{{ band_slug }}">
  {% if release_slug %}<input type="hidden" name="release_slug" value="{{ release_slug }}">{% endif %}

  <div class="field">
    <label for="files">{{ t.media_field_label }}</label>
    <!-- Hidden: the visible trigger is the button below, so repeated
         picks can be accumulated in JS instead of each one replacing
         the last (a plain <input multiple> only keeps files chosen in
         a single dialog open - see media_upload.js). No `required` -
         validity is enforced by the submit button starting disabled
         below, not by this input's own state. -->
    <input type="file" id="files" name="files" multiple accept="image/*,video/*" data-media-files hidden>
    <button type="button" class="btn" data-media-add>{{ t.media_add_button }}</button>
    <div data-media-file-list
         data-i18n-video="{{ t.media_js_video }}"
         data-i18n-caption="{{ t.media_js_caption }}"
         data-i18n-remove="{{ t.media_js_remove }}"
         class="media-file-list"></div>
  </div>

  <div class="field">
    <label for="submitter_name">{{ t.submitter_name }}</label>
    <input type="text" id="submitter_name" name="submitter_name">
  </div>
  <div class="field">
    <label for="submitter_contact">{{ t.submitter_contact_media }}</label>
    <input type="text" id="submitter_contact" name="submitter_contact">
  </div>

  <!-- honeypot: hidden from real visitors via CSS, never filled by a human -->
  <div class="field honeypot" aria-hidden="true">
    <label for="website">{{ t.honeypot_label }}</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit" data-media-submit disabled>{{ t.submit_button }}</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='media_upload.js') }}"></script>
{% endblock %}
