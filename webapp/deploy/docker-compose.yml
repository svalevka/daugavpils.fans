services:
  nginx:
    image: nginx:alpine
    container_name: daugavpils-fans-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      # ./site is mounted once, as a whole, at container start; inside it
      # nginx's `root /site/current` (see nginx/daugavpils.conf) follows a
      # symlink that sync-and-deploy.sh atomically re-points at each new
      # deploy - Docker only resolves the *mount source* path once, so
      # replacing ./dist itself in place could never be truly atomic, but
      # an internal symlink swap, read fresh by nginx per request, is.
      - ./site:/site:ro
      - ./nginx/daugavpils.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
