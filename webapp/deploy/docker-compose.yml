services:
  nginx:
    image: nginx:alpine
    container_name: daugavpils-fans-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/daugavpils.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
