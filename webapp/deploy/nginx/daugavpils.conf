# Persistent bounded media cache for archive.org streaming (see GitHub issue #59):
# 10GB disk cache, 50MB shared memory zone for keys, inactive 30d.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=archive_media_cache:50m max_size=10g inactive=30d use_temp_path=off;

# Rate limiting zones for review_app protection (see GitHub issue #73):
# - review_general_zone: caps raw request volume across all review_app endpoints
#   (10 req/s with burst=20 nodelay) to protect gunicorn/Flask worker capacity from floods.
#   Uses $binary_remote_addr (4 bytes IPv4, 16 bytes IPv6); 10m zone tracks ~160,000 IPs.
# - review_strict_zone: tighter throttling for abuse-sensitive login and submission
#   endpoints (/login, /submit*) (2 req/s with burst=10 nodelay) to stop automated
#   submission flooding and email-bombing before payloads reach application code or SQLite.
# - limit_req_status 429 ensures rate-limited responses return standard HTTP 429 Too Many Requests
#   matching the application layer (issue #26), rather than nginx's default 503.
limit_req_zone $binary_remote_addr zone=review_general_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=review_strict_zone:10m rate=2r/s;
limit_req_status 429;

# Default catch-all servers for unrecognized hostnames: drop connection immediately with 444 (GitHub issue #77)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/daugavpils.fans/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daugavpils.fans/privkey.pem;

    return 444;
}

# Redirect plain HTTP to HTTPS across all known domains
server {
    listen 80;
    listen [::]:80;
    server_name daugavpils.fans www.daugavpils.fans review.daugavpils.fans;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daugavpils.fans www.daugavpils.fans;

    ssl_certificate     /etc/letsencrypt/live/daugavpils.fans/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daugavpils.fans/privkey.pem;

    # /site/current is a symlink (see docker-compose.yml, sync-and-deploy.sh)
    # atomically re-pointed at each deploy - nginx resolves it fresh per
    # request, so this always serves either the fully-old or fully-new
    # build, never a half-written one.
    root /site/current;
    index index.html;

    # HSTS: this site is TLS-only (there's no port 80 server block to
    # redirect from), so tell browsers to never even try plain HTTP for
    # it or its subdomains again. includeSubDomains covers
    # review.daugavpils.fans below, which shares this cert.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://archive.org https://*.archive.org data:; media-src 'self' https://archive.org https://*.archive.org; connect-src 'self' https://archive.org; frame-ancestors 'self';" always;

    # No content hash in any static filename (style.css, player.js, the
    # HTML itself), and the deploy timer atomically re-points `current`
    # to a new build every ~5 minutes - so without this, a returning
    # visitor's browser can silently keep serving a stale cached
    # style.css/player.js from before a deploy (confirmed in production:
    # GitHub issue tracking the lightbox-navigation feature landing on
    # the server but staying invisible to an already-cached browser).
    # `no-cache` (not `no-store`): the browser still revalidates via
    # ETag/Last-Modified on every request (a cheap 304 when nothing
    # changed) rather than trusting a cached copy blind - always fresh,
    # without giving up the bandwidth savings of an unchanged response.
    add_header Cache-Control "no-cache" always;

    # Site maintainer statistics dashboard (/admin/) and analytics event beacon (/api/event):
    # Proxied to review-app Flask container (see GitHub issue #34).
    location /admin {
        limit_req zone=review_general_zone burst=20 nodelay;
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/event {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Approver proposals dashboard and action endpoints (see GitHub issues #34, #35):
    # Proxied to review-app Flask container.
    location /dashboard {
        limit_req zone=review_general_zone burst=20 nodelay;
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /proposals {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media-proposals {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /login {
        limit_req zone=review_strict_zone burst=5 nodelay;
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /verify {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # DNS resolver for upstream archive.org domain resolution when proxying or following redirects
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Stale media proxy cache for audio/video streaming (see GitHub issue #59):
    # Proxies archive.org media requests and caches them on disk (bounded to 10g).
    # Uses slice module (1m slices) to support byte-range caching (HTTP 206 Partial Content)
    # and proxy_cache_use_stale to serve cached audio/video during archive.org outages (500/502/503/504).
    location /media-stream/ {
        proxy_pass https://archive.org/download/;
        proxy_cache archive_media_cache;
        slice 1m;
        proxy_cache_key $uri$is_args$args$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_force_ranges on;
        proxy_ssl_server_name on;
        proxy_set_header Host archive.org;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        # Archive.org /download/ responds with 302 redirect to storage node (e.g. iaXXXX.us.archive.org).
        # Intercept 302 redirects and follow them internally so the media bytes are cached locally.
        proxy_intercept_errors on;
        error_page 301 302 307 = @media_redirect;
    }

    location @media_redirect {
        set $saved_redirect_location '$upstream_http_location';
        proxy_pass $saved_redirect_location;
        proxy_cache archive_media_cache;
        slice 1m;
        proxy_cache_key $uri$is_args$args$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_force_ranges on;
        proxy_ssl_server_name on;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name review.daugavpils.fans;

    # Same cert as above - review.daugavpils.fans must be added to its SAN
    # list (see webapp/deploy/README.md's certbot command) before this
    # block can serve real TLS for it.
    ssl_certificate     /etc/letsencrypt/live/daugavpils.fans/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daugavpils.fans/privkey.pem;

    # nginx's own default (1m) would 413 any real photo/video upload
    # before it ever reaches Flask - see GitHub issue #21. Matches
    # app.py's own MAX_CONTENT_LENGTH backstop (4x the video cap, so a
    # batch of several max-size videos in one submission still fits);
    # review_app's per-file caps (MAX_PHOTO_UPLOAD_BYTES/
    # MAX_VIDEO_UPLOAD_BYTES) are the real, precise limit - this is only
    # the outer bound nginx itself needs to not get in the way first.
    client_max_body_size 2g;
    # A slow upload of a large video over a home connection can take a
    # while - nginx's 60s default would cut it off mid-transfer.
    client_body_timeout 600s;
    proxy_read_timeout 600s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self';" always;

    # Default rate limiting for review.daugavpils.fans: caps flood volume while
    # allowing normal browsing and asset loading without delay
    limit_req zone=review_general_zone burst=20 nodelay;

    location / {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Stricter rate limiting on submit endpoints (/submit, /submit-band, /submit-release, etc.)
    # to stop automated submission flooding before multipart payloads touch disk or workers.
    location /submit {
        limit_req zone=review_strict_zone burst=10 nodelay;
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Stricter rate limiting on login endpoint to prevent email-bombing and brute-force probing.
    location /login {
        limit_req zone=review_strict_zone burst=5 nodelay;
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
