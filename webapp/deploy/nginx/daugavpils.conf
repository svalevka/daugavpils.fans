server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daugavpils.fans www.daugavpils.fans;

    ssl_certificate     /etc/letsencrypt/live/daugavpils.fans/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daugavpils.fans/privkey.pem;

    # /site/current is a symlink (see docker-compose.yml, sync-and-deploy.sh)
    # atomically re-pointed at each deploy - nginx resolves it fresh per
    # request, so this always serves either the fully-old or fully-new
    # build, never a half-written one.
    root /site/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name review.daugavpils.fans;

    # Same cert as above - review.daugavpils.fans must be added to its SAN
    # list (see webapp/deploy/README.md's certbot command) before this
    # block can serve real TLS for it.
    ssl_certificate     /etc/letsencrypt/live/daugavpils.fans/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daugavpils.fans/privkey.pem;

    # nginx's own default (1m) would 413 any real photo/video upload
    # before it ever reaches Flask - see GitHub issue #21. Matches
    # app.py's own MAX_CONTENT_LENGTH backstop (4x the video cap, so a
    # batch of several max-size videos in one submission still fits);
    # review_app's per-file caps (MAX_PHOTO_UPLOAD_BYTES/
    # MAX_VIDEO_UPLOAD_BYTES) are the real, precise limit - this is only
    # the outer bound nginx itself needs to not get in the way first.
    client_max_body_size 2g;
    # A slow upload of a large video over a home connection can take a
    # while - nginx's 60s default would cut it off mid-transfer.
    client_body_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://review-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
