name: Apply approved proposal

# Triggered by review_app (github_dispatch.py) when an approver approves
# a proposal - see GitHub issue #13. Only the proposal id ever crosses
# into this workflow; the actual content is fetched here, from
# review_app's authenticated callback API, using a bearer key known only
# to review_app and this workflow (secrets.REVIEW_APP_CALLBACK_KEY).
#
# This workflow's own auto-issued GITHUB_TOKEN (permissions: contents:
# write, below) is the only credential anywhere in this pipeline that can
# push to git - review_app itself never holds one.

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: >-
          A specific approved proposal's id to apply. Leave blank to sweep
          every currently-approved proposal instead - the same thing the
          schedule trigger below does on its own; useful for manually
          recovering one that was dropped by the concurrency queue (see
          GitHub issue #28).
        required: false
        type: string
  schedule:
    # Self-healing sweep for a GitHub concurrency-group limitation: only
    # one *running* + one *queued* run are kept per group, so a burst of
    # near-simultaneous approvals can silently evict an older *queued*
    # dispatch before it ever runs - not a failure, a run that never
    # started at all (confirmed in production: proposal #13 on
    # 2026-09-09, see GitHub issue #28). A run triggered by one approval
    # only ever handles its own one proposal_id, so a dropped dispatch has
    # no other trigger to recover it. This sweep is that recovery: every
    # 15 minutes, apply *every* currently-approved proposal (GET
    # /api/proposals/approved), not just whatever single id (if any) this
    # particular run was dispatched with - so anything dropped gets
    # applied here within 15 minutes instead of sitting stuck forever.
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  # Approvals can land within seconds of each other; without this, two
  # runs checkout main at the same commit and one's `git push` gets
  # rejected as non-fast-forward (see the incident this fixed: proposals
  # #8 and #9 both failed to apply on 2026-09-08 because they raced #7).
  # `queued` (not `cancel-in-progress`) so a run already in flight is
  # never killed mid-push - but see GitHub issue #28 for what this does
  # *not* protect against (a third dispatch evicting an older *queued*
  # one outright), which the schedule trigger above exists to recover
  # from, and the retry loop below exists to reduce in the first place.
  group: apply-proposal
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Determine which proposal(s) to apply
        id: targets
        run: |
          single_id="${{ github.event.inputs.proposal_id }}"
          if [ -n "$single_id" ]; then
            echo "ids=$single_id" >> "$GITHUB_OUTPUT"
          else
            ids=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.REVIEW_APP_CALLBACK_KEY }}" \
              "${{ vars.REVIEW_APP_BASE_URL }}/api/proposals/approved" \
              | python3 -c "import json,sys; print(' '.join(str(i) for i in json.load(sys.stdin)['ids']))")
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
          fi

      # No tools/validate.py step here: this runner has no local media
      # tree (same limitation as the Pages mirror and the sync timer -
      # see ADR-0002 and sync-and-deploy.sh's comment on
      # SITE_SKIP_LOCAL_VALIDATION), so its missing-file checks would
      # fail on every proposal regardless of content. apply_proposal.py
      # already re-validates the edited band/release against the
      # Pydantic schema on write (see its module docstring).
      #
      # Deliberately not `set -e`: one proposal's failure (bad content, a
      # push race that outlasts its retries) must not abort the loop and
      # skip reporting on, or applying, every other id in the batch - each
      # iteration's own success/failure is tracked and reported
      # individually via apply-result below instead.
      - name: Apply each proposal
        if: steps.targets.outputs.ids != ''
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          git config user.name "daugavpils-fans-bot"
          git config user.email "daugavpils@gmail.com"
          overall_failed=0
          for id in ${{ steps.targets.outputs.ids }}; do
            echo "::group::Proposal #$id"
            success=0
            error=""

            if curl -fsSL \
                 -H "Authorization: Bearer ${{ secrets.REVIEW_APP_CALLBACK_KEY }}" \
                 "${{ vars.REVIEW_APP_BASE_URL }}/api/proposals/$id" \
                 -o proposal.json \
               && python tools/apply_proposal.py --proposal-file proposal.json; then
              git add -A -- bands
              if git diff --cached --quiet; then
                # Nothing actually changed - e.g. an earlier id in this
                # same sweep already achieved what this one wanted. Not a
                # failure, just nothing to push.
                success=1
              else
                git commit -m "Apply approved proposal #$id"
                pushed=0
                for attempt in 1 2 3 4 5; do
                  if git push origin main; then
                    pushed=1
                    break
                  fi
                  echo "push rejected (attempt $attempt/5) - fetching and rebasing before retrying"
                  git fetch origin main
                  git rebase origin/main
                  sleep $((RANDOM % 4 + 1))
                done
                if [ "$pushed" = "1" ]; then
                  success=1
                else
                  error="git push kept getting rejected after 5 attempts"
                fi
              fi
            else
              error="see the Action run logs"
            fi

            if [ "$success" = "1" ]; then
              payload="{\"success\": true, \"run_id\": \"${{ github.run_id }}\"}"
            else
              echo "::error::proposal #$id failed: $error"
              payload="{\"success\": false, \"run_id\": \"${{ github.run_id }}\", \"error\": \"$error\"}"
              overall_failed=1
            fi
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${{ secrets.REVIEW_APP_CALLBACK_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${{ vars.REVIEW_APP_BASE_URL }}/api/proposals/$id/apply-result"
            echo "::endgroup::"
          done
          exit $overall_failed

      # GitHub doesn't let a push made with this workflow's own
      # auto-issued GITHUB_TOKEN trigger another workflow's `on: push`
      # (anti-recursion protection) - pages.yml would otherwise never
      # run for a commit landed this way. Its own `workflow_dispatch`
      # trigger sidesteps that; `actions: write` above is what lets this
      # token call it. Only worth doing if there was actually something
      # to apply - an empty sweep changes nothing.
      - name: Trigger Pages mirror rebuild
        if: steps.targets.outputs.ids != ''
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
