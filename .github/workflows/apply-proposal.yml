name: Apply approved proposal

# Triggered by review_app (github_dispatch.py) when an approver approves
# a proposal - see GitHub issue #13. Only the proposal id ever crosses
# into this workflow; the actual content is fetched here, from
# review_app's authenticated callback API, using a bearer key known only
# to review_app and this workflow (secrets.REVIEW_APP_CALLBACK_KEY).
#
# This workflow's own auto-issued GITHUB_TOKEN (permissions: contents:
# write, below) is the only credential anywhere in this pipeline that can
# push to git - review_app itself never holds one.

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: "The approved proposal's id in review_app's database"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # Approvals can land within seconds of each other; without this, two
  # runs checkout main at the same commit and one's `git push` gets
  # rejected as non-fast-forward (see the incident this fixed: proposals
  # #8 and #9 both failed to apply on 2026-09-08 because they raced #7).
  # `queued` (not `cancel-in-progress`) so every approved proposal still
  # gets applied, just one at a time.
  group: apply-proposal
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Fetch approved proposal content
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.REVIEW_APP_CALLBACK_KEY }}" \
            "${{ vars.REVIEW_APP_BASE_URL }}/api/proposals/${{ inputs.proposal_id }}" \
            -o proposal.json

      - name: Apply the proposal
        run: python tools/apply_proposal.py --proposal-file proposal.json

      # No tools/validate.py step here: this runner has no local media
      # tree (same limitation as the Pages mirror and the sync timer -
      # see ADR-0002 and sync-and-deploy.sh's comment on
      # SITE_SKIP_LOCAL_VALIDATION), so its missing-file checks would
      # fail on every proposal regardless of content. apply_proposal.py
      # already re-validates the edited band/release against the
      # Pydantic schema on write (see its module docstring).

      - name: Commit and push
        # The `concurrency:` group above only serializes runs of *this*
        # workflow against each other - it does nothing for a race against
        # a manual push landing in the same window (see the incident this
        # fixed: proposal #19 failed to apply on 2026-09-09, rejected as
        # non-fast-forward, racing a manual `git push` made outside any
        # workflow run). Retry with a rebase instead of failing outright -
        # `bands/` edits from different proposals essentially never touch
        # the same lines, so the rebase itself should never conflict; if
        # it somehow does, the retry loop exits non-zero and this proposal
        # is reported as failed exactly as before.
        run: |
          git config user.name "daugavpils-fans-bot"
          git config user.email "daugavpils@gmail.com"
          git add -A -- bands
          git commit -m "Apply approved proposal #${{ inputs.proposal_id }}"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) - fetching and rebasing before retrying"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::git push kept getting rejected after 5 attempts - see the commits landed on main around this time"
          exit 1

      # GitHub doesn't let a push made with this workflow's own
      # auto-issued GITHUB_TOKEN trigger another workflow's `on: push`
      # (anti-recursion protection) - pages.yml would otherwise never
      # run for a commit landed this way. Its own `workflow_dispatch`
      # trigger sidesteps that; `actions: write` above is what lets this
      # token call it.
      - name: Trigger Pages mirror rebuild
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            PAYLOAD='{"success": true, "run_id": "${{ github.run_id }}"}'
          else
            PAYLOAD='{"success": false, "run_id": "${{ github.run_id }}", "error": "see the Action run logs"}'
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.REVIEW_APP_CALLBACK_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ vars.REVIEW_APP_BASE_URL }}/api/proposals/${{ inputs.proposal_id }}/apply-result"
