name: Run tests

# Runs the tools/, webapp/deploy/, and review_app/ unittest suites on every
# push/PR. The repo previously had no test-running CI at all (pages.yml
# only builds the Site) - see https://github.com/svalevka/daugavpils.fans/issues/9.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # tools/archive_fixture.py's generate_silent_mp3() (used by
        # tools/test_validate_write.py) shells out to ffmpeg/ffprobe to
        # build a real, decodable audio fixture - not guaranteed
        # preinstalled on the runner image, so install it explicitly
        # rather than assume.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r tools/requirements.txt -r review_app/requirements.txt

      - name: Run tools/ test suite
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Run webapp/deploy/ test suite
        run: python -m unittest discover -s webapp/deploy -p 'test_*.py' -v

      - name: Run review_app/ test suite
        run: python -m unittest discover -s review_app -p 'test_*.py' -v
