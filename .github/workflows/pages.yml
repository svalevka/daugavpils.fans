name: Deploy Site mirror to GitHub Pages

# Publishes a live mirror of the Site (see README.md/ADR-0002) at this
# repo's default GitHub Pages URL, independent of daugavpils.fans/Hetzner.
# SITE_BASE_PATH accounts for GitHub Pages serving a project site from
# /<repo-name>/ rather than the domain root, and SITE_SKIP_LOCAL_VALIDATION
# skips tools/validate.py's local-checksum recheck (this checkout has no
# media - it's gitignored) in favor of the archive.org existence check
# webapp/build.py already does. See webapp/build.py's module docstring.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # `false`, not `true`: matches GitHub's own Pages starter template. A
  # deploy already in flight must be allowed to finish - killing it
  # mid-way is what produced a visibly "cancelled" run whenever two
  # apply-proposal.yml runs landed close together and each dispatched
  # this workflow (see the run at
  # github.com/svalevka/daugavpils.fans/actions/runs/34236237464). With
  # `false`, only a run still queued behind the in-progress one can get
  # superseded by a newer dispatch - the in-progress deploy itself never
  # gets cut off.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r webapp/requirements.txt

      - name: Build Site
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          SITE_SKIP_LOCAL_VALIDATION: "1"
        run: python webapp/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
