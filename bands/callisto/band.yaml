description: «Каллисто» — даугавпилсская мелодичная рок-группа конца 1990-х и начала
  2000-х годов. Регулярные партнеры по сцене и соратники групп «Двойная Вода» и STOP
  на концертных площадках Даугавпилса (ДКХ, клуб железнодорожников, открытые городские
  фестивали).
description_en: Callisto was a Daugavpils melodic rock band active in the late 1990s
  and early 2000s. They were frequent stage companions of Dvojnaja Voda and STOP across
  local concert venues, including DKKh, the Railway Club, and open-air municipal rock
  concerts.
