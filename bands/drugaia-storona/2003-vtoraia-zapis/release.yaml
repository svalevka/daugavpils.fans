description: 'Вторая запись группы, упомянутая в истории коллектива - сделана с обновлённым
  составом после выступления на большом совместном концерте в ДКХ (4 января 2003 года)
  вместе с «Криками Мартина» и «Ko Band». Композиции найдены в веб-архиве (web.archive.org)
  личной страницы группы на сайте zanoza.lv, где они подписаны как «музыка периода
  2002-2003» в составе: Альбина П. (вокал), Дмитрий Д. (бас-гитара, вокал), Роман
  К. (гитара, вокал), Владимир Р. (ударные), Артём П. (перкуссия, вокал), Валерий
  К. (соло-гитара).'
description_en: 'The band''s second recording, mentioned in the group''s own history
  - made with an updated lineup following a major joint concert at the DKKh (January
  4, 2003) alongside "Kriki Martina" and "Ko Band". Tracks recovered via the Wayback
  Machine (web.archive.org) from the band''s page on zanoza.lv, where they are labeled
  "music of the 2002-2003 period" with the lineup: Albina P. (vocals), Dmitry D. (bass
  guitar, vocals), Roman K. (guitar, vocals), Vladimir R. (drums), Artyom P. (percussion,
  vocals), Valery K. (lead guitar).'
