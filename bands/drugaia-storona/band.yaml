description_en: 'The vocal-instrumental ensemble "Drugaia Storona" (The Other Side)
  formed in 2001. It all began a year earlier when two young people full of energy
  wanted to start their own band. They began searching for like-minded musicians,
  finding quite a few, which may be why it took rather a long time for anything concrete
  to materialize. But in 2001 the first results appeared, along with the name "Drugaia
  Storona". The group''s lineup shifted periodically across their active years.


