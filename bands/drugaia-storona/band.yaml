description: 'Вокально-инструментальный ансамбль «Другая сторона» образовался в 2001
  году. Началось все на год раньше, когда два молодых, полных энергии человека захотели
  создать собственную группу. Они начали искать единомышленников. Таковых оказалось
  немало. Может быть, поэтому довольно долго ничего толком не выходило. Но уже в 2001
  году появились первые результаты, тогда же появилось название «Другая сторона».
  Состав группы периодически менялся.


  В 2002 году была сделана первая запись в составе:

  Вячеслав О. (соло-гитара)

  Дмитрий Д. (бас-гитара, вокал)

  Роман К. (гитара, вокал)

  Владимир Р. (ударные)

  Андрей Г. (перкуссия, вокал)


  В 2003 году последовала вторая запись с обновленным составом:

  Альбина П. (вокал)

  Дмитрий Д. (бас-гитара, вокал)

  Роман К. (гитара, вокал)

  Владимир Р. (ударные)

  Артём П. (перкуссия, вокал)

  Валерий К. (соло-гитара)


  4 января 2003 года группа выступила на большом совместном концерте в ДКХ вместе
  с «Криками Мартина» и «Ko Band».


  В 2004 году коллектив записал альбом «Радуга»:

  Альбина П. (вокал)

  Евгений Е. (бас-гитара, вокал)

  Роман К. (гитара, вокал)

  Владимир Р. (ударные)

  Артём П. (перкуссия, вокал)


  В 2006 году вышел альбом «la''COMA tif»:

  Альбина Путкарадзе (вокал)

  Роман Комар (гитары, вокал)

  Стас Шиманский (бас-гитара)

  Евгений "Дерево" Ершов (бас-гитара)

  Константин "Ко" Дзедзель (скрипка)

  Владимир Раковский (барабаны)'
description_en: 'The vocal-instrumental ensemble "Drugaia Storona" (The Other Side)
  formed in 2001. It all began a year earlier when two young people full of energy
  wanted to start their own band. They began searching for like-minded musicians,
  finding quite a few, which may be why it took rather a long time for anything concrete
  to materialize. But in 2001 the first results appeared, along with the name "Drugaia
  Storona". The group''s lineup shifted periodically across their active years.


  In 2002, they made their first recording with the following lineup:

  Vyacheslav O. (lead guitar)

  Dmitry D. (bass guitar, vocals)

  Roman K. (guitar, vocals)

  Vladimir R. (drums)

  Andrei G. (percussion, vocals)


  In 2003, a second recording followed with an updated lineup:

  Albina P. (vocals)

  Dmitry D. (bass guitar, vocals)

  Roman K. (guitar, vocals)

  Vladimir R. (drums)

  Artyom P. (percussion, vocals)

  Valery K. (lead guitar)


  On January 4, 2003, the band performed at a major joint concert at the DKKh alongside
  "Kriki Martina" and "Ko Band".


  In 2004, the group recorded the album "Raduga" (Rainbow):

  Albina P. (vocals)

  Evgeny E. (bass guitar, vocals)

  Roman K. (guitar, vocals)

  Vladimir R. (drums)

  Artyom P. (percussion, vocals)


  In 2006, they released the album "la''COMA tif":

  Albina Putkaradze (vocals)

  Roman Komar (guitars, vocals)

  Stas Shimansky (bass guitar)

  Evgeny "Derevo" Ershov (bass guitar)

  Konstantin "Ko" Dzedzel (violin)

  Vladimir Rakovsky (drums)'
