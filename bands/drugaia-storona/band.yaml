description: 'Вокально-инструментальный ансамбль «Другая сторона» образовался в 2001
  году. Началось все на год раньше, когда два молодых, полных энергии человека захотели
  создать собственную группу. Они начали искать единомышленников. Таковых оказалось
  немало. Может быть, поэтому довольно долго ничего толком не выходило. Но уже в 2001
  году появились первые результаты, тогда же появилось название «Другая сторона».
  Состав группы периодически менялся.


