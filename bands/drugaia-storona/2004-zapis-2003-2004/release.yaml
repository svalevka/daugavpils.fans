description: 'Третья по счёту запись, не упомянутая по имени в собственной истории
  группы (та ограничивается «первой» 2002 года и «второй» 2003 года, а затем сразу
  переходит к альбому «Радуга» 2004 года). Композиции найдены в веб-архиве (web.archive.org)
  личной страницы группы на сайте zanoza.lv, где они подписаны как «музыка периода
  2003-2004» в составе: Альбина П. (вокал), Евгений Е. (бас-гитара, вокал), Роман
  К. (гитара, вокал), Владимир Р. (ударные), Артём П. (перкуссия, вокал). Трек «Instrumental»
  был указан на той же странице, но его mp3-файл так и не был сохранён краулером web.archive.org
  - считается утраченным. Файл «Summertime» сам по себе повреждён/оборван в архиве:
  оба сохранённых архивом слепка (январь и март 2007) содержат идентичный, но обрезанный
  файл - реально декодируется только около 7 секунд звука, хотя ID3-заголовок заявляет
  длительность 2:46.'
description_en: 'A third recording, not named as such in the band''s own history (which
  only calls out the "first" 2002 recording and "second" 2003 recording, then jumps
  straight to the 2004 album "Raduga"). Tracks recovered via the Wayback Machine (web.archive.org)
  from the band''s page on zanoza.lv, where they are labeled "music of the 2003-2004
  period" with the lineup: Albina P. (vocals), Evgeny E. (bass guitar, vocals), Roman
  K. (guitar, vocals), Vladimir R. (drums), Artyom P. (percussion, vocals). The track
  "Instrumental" was listed on the same page, but its mp3 file was never actually
  captured by the web.archive.org crawler - considered lost. The "Summertime" file
  itself is damaged/truncated in the archive: both preserved crawl snapshots (January
  and March 2007) contain the identical but cut-off file - only about 7 seconds of
  audio actually decode, even though the ID3 header claims a 2:46 duration.'
