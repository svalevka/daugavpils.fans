description: 'Первая запись группы, упомянутая в истории коллектива. Композиции найдены
  в веб-архиве (web.archive.org) личной страницы группы на сайте zanoza.lv, где они
  подписаны как «музыка периода 2001-2002» в составе: Вячеслав О. (соло-гитара), Дмитрий
  Д. (бас-гитара, вокал), Роман К. (гитара, вокал), Владимир Р. (ударные), Андрей
  Г. (перкуссия, вокал).'
description_en: 'The band''s first recording, mentioned in the group''s own history.
  Tracks recovered via the Wayback Machine (web.archive.org) from the band''s page
  on zanoza.lv, where they are labeled "music of the 2001-2002 period" with the lineup:
  Vyacheslav O. (lead guitar), Dmitry D. (bass guitar, vocals), Roman K. (guitar,
  vocals), Vladimir R. (drums), Andrei G. (percussion, vocals).'
