description_en: 'Daugavpils underground lo-fi comedy-punk project "Ukurki", founded
  in 2000 by Bo and Keks. The band was characterized by absurd humor, parody narratives,
  and spontaneous garage home recordings.


  "Ukurki" Album (2000):

  Recorded by: Bo and Keks

