description: 'Даугавпилсский андеграундный lo-fi / комеди-панк проект «Укурки», основанный
  в 2000 году Бо и Кексом. Группа отличалась абсурдным юмором, пародийными сюжетами
  и спонтанным гаражным звучанием.


  Хронология записей и составов проекта:

  - 2000 — альбом «Укурки». В записи участвовали: Бо и Кекс.

  - 2000 — альбом «Уже в дерьме, еще не кушал». В записи участвовали: Бо, Кекс, Гагарин
  и Илл.

  - 2001 — запись «Зависимость». В записи участвовали: Бо, Кекс, Петрович и Илл.

  - 2002 — альбом «Нетвердые зубы Джошуа». В записи участвовали: Бо, Кекс, Бульон
  и Romazz.

  - 2002 — альбом «Педаль». В записи участвовали: Бо, Кекс, Бульон, Петрович, Вера,
  а также засветился Месяц.

  - 2003 — альбом «max. power». В записи участвовали: Бо, Кекс, Петрович, Рома Комар,
  Кабан, Михасик.

  - 2004 — альбом «Метроном». В записи участвовали: Бо, Кекс, Бульон.'
description_en: 'Daugavpils underground lo-fi comedy-punk project "Ukurki", founded
  in 2000 by Bo and Keks. The band was characterized by absurd humor, parody narratives,
  and spontaneous garage home recordings.


  Chronology of recordings and lineups:

  - 2000 — "Ukurki" album. Recorded by: Bo and Keks.

  - 2000 — "Uzhe v derme, eshche ne kushal" (Already in the Shit, Haven''t Eaten Yet)
  album. Recorded by: Bo, Keks, Gagarin, and Ill.

  - 2001 — 2001 recording. Recorded by: Bo, Keks, Petrovich, and Ill.

  - 2002 — "Netvyordye zuby Dzhoshua" (Joshua''s Wobbly Teeth) album. Recorded by:
  Bo, Keks, Bulyon, and Romazz.

  - 2002 — "Pedal" (Pedal) album. Recorded by: Bo, Keks, Bulyon, Petrovich, Vera,
  with a guest appearance by Mesyats.

  - 2003 — "max. power" album. Recorded by: Bo, Keks, Petrovich, Roma Komar, Kaban,
  Mikhasik.

  - 2004 — "Metronom" (Metronome) album. Recorded by: Bo, Keks, Bulyon.'
