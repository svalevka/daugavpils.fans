description: Artstorm — даугавпилсский хэви-метал проект, образованный в 2004 году
  гитаристом и основателем группы Legion Ярославом Гавриловым вместе с ритм-секцией
  Legion (басист Дмитрий Денисов, барабанщик Владислав Качановский) и вокалистом Александром
  Голевым. Группа записала ряд студийных композиций в стиле мелодичного хэви/пауэр-метала
  («Содом», «В Элизиум»).
description_en: Artstorm was a Daugavpils heavy metal project formed in 2004 by Legion
  founder and lead guitarist Jaroslavs Gavrilovs, joined by the Legion rhythm section
  (bassist Dmitrijs Denisovs, drummer Vladislavs Kachanovsky) and vocalist Aleksandr
  Golev. The band recorded several melodic heavy and power metal demo tracks including
  'Sodom' and 'V Elizium'.
description_lv: Artstorm bija Daugavpils smaga metala projekts, kuru 2004. gada izveidoja
  grupas Legion dibinatajs un gitarists Jaroslavs Gavrilovs kopa ar Legion ritma sekciju
  (basists Dmitrijs Denisovs, bungieris Vladislavs Kacanovskis) un dziedataju Aleksandru
  Golevu. Grupa ierakstija vairakas melodiskas heavy/power metal kompozicijas ('Sodom',
  'V Elizium').
