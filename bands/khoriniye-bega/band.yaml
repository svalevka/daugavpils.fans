description: 'Акустический дуэт-побочный проект Рыба (Александра Рыбакова, также участника
  "Глазки Стекольщика") и его друга Шуры по прозвищу Некрофил. По словам Рыба: пока
  он несколько месяцев служил на пожарной вышке в Черепово, Некрофил навещал его с
  гитарой, и вдвоём они придумали небольшой альбом "Провал", назвавшись "Хориные Бега"
  - потому что носились тогда вдвоем с акустиками, "что твои хорьки". Аудиозаписи
  альбома "Провал" в этот архив пока не добавлены; сохранены только видеозаписи живых
  выступлений.

  '
description_en: 'An acoustic duo side project of Ryb (Alexander Rybakov, also of "Глазки
  Стекольщика") and his friend Shura, nicknamed Nekrofil. While Ryb was stationed
  for several months at a fire watchtower in Cherepovo, Nekrofil would visit him with
  a guitar, and the two put together a small album, "Провал", naming themselves "Хориные
  Бега" ("Ferret Races") after how the two of them used to run around with their acoustic
  guitars. Audio for the "Провал" album is not yet in this archive; only live video
  footage has been preserved so far.

  '
