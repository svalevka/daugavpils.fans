description: «Элпа» (ELPA) — легендарная арт-рок и прогрессив-рок группа, основанная
  в Даугавпилсе в 1983 году бас-гитаристом Валдисом Рундзансом и клавишником Янисом
  Логинсом (1961–1995). В состав вошли выдающиеся музыканты города, в том числе Айвар
  Брок (ныне директор Даугавпилсской музыкальной средней школы имени Станислава Брока).
  «Элпа» стала символом латвийского прогрессивного рока, лауреатом крупнейшего всесоюзного
  рок-фестиваля «Лиепаяс Дзинтарс» (1986, 1987) и опросов «Микрофон» с песнями «Ezers»
  и «Senā dziesma». Группа создала рок-сюиту «Ticība» (1986) на стихи Леона Бриедиса
  и выпустила монументальный альбом «Karavāna» (2008).
description_en: ELPA is the pioneering art-rock and progressive rock group formed
  in Daugavpils in 1983 by bassist Valdis Rundzāns and keyboardist/composer Jānis
  Logins (1961–1995). Its lineup included top city musicians, among them classical
  pianist Aivars Broks (now director of Staņislavs Broks Daugavpils Music High School).
  ELPA became an enduring landmark of Latvian progressive rock, winning major awards
  at Liepājas Dzintars (1986, 1987) and high placings in the Mikrofons surveys with
  songs like 'Ezers' and 'Senā dziesma'. They composed the celebrated rock suite 'Ticība'
  (1986) and album 'Karavāna' (2008).
description_lv: ELPA ir legendara artroka un progresīvā roka grupa, ko Daugavpili
  1983. gada nodibinaja basists Valdis Rundzāns un taustininstrumentalists Janis Logins
  (1961–1995). Sastava darbojās izcili pilsetas muzikanti, tostarp Aivars Broks (Stanislava
  Broka Daugavpils Muzikas vidusskolas direktors). ELPA kluva par Latvijas progresiva
  roka vizitkarti, triumfejot festivala 'Liepajas Dzintars' (1986, 1987) un Mikrofona
  aptaujas ar dziesmam 'Ezers' un 'Sena dziesma'. Grupa radija monumentalus darbus
  'Ticiba' (1986) un albumu 'Karavana' (2008).
