description: Даугавпилсское пауэр-трио SLURM! было образовано в июне 2008 года музыкантами,
  ранее игравшими в других коллективах города (включая группу Robotplant). Сами участники
  характеризовали свой стиль как «дэнс-рок-н-ролл» (dance rock’n’roll), смешивая энергетику
  гранжа, сырого гаражного рока и прямолинейного инди-драйва. Коллектив регулярно
  выступал на даугавпилсских сценах, в частности в рок-клубе «Banzai».
description_en: Daugavpils power trio SLURM! was formed in June 2008 by musicians
  with backgrounds in other local bands (including Robotplant). The trio characterized
  their style as 'dance rock’n’roll', combining grunge energy, garage rock grit, and
  driving indie rock rhythms. The group performed frequently at local venues, notably
  at the Daugavpils rock club Banzai.
description_lv: Daugavpils pauer-trio SLURM! tika dibināts 2008. gada jūnijā, apvienojoties
  mūziķiem no citām vietējām grupām (tostarp Robotplant). Paši dalībnieki savu mūzikas
  stilu raksturoja kā «dance rock’n’roll», apvienojot grandža enerģiju, garāžroka
  raupjumu un indīroka ritmus. Grupa aktīvi koncertēja Daugavpilī, īpaši rokkubā «Banzai».
