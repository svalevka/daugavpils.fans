description: 'После окончания группы «Квазимодо» музыкальные пути участников разошлись.
  Варик, Андрей Зелч и Кузя собрали группу Carpe Diem, а я попал в атмосферу автостопа,
  резекненских хипарей, даугавпилсских художников, рейва и свободы от работы и неприятных
  обязанностей.


  Я с удовольствием путешествовал автостопом по родной Латвии, знакомился с новыми
  людьми и играл на гитаре.


  Помню, очень многие из творческих людей, тусовавшихся на «Тарелке» в центре города,
  вселились под видом студентов художественной «Саулес» школы  в общежитие Железнодорожного
  Техникума. Там, в порыве самовыражения, двери сразу оказались разрисованы всякими
  рыбами, глазами и кое-где смердячими псами.


  Жили в этом общежитии очень весело. Туда приезжали в гости хиппи, заходили местные
  неформалы, рокеры и художники. Жили одной большой, счастливой, якобы коммуной.


  И в какой-то момент я попросил друзей с «Тарелки» — Гуну, которая умела на аккордеоне,
  и Тосю, которая могла на пианино, — подыграть тому, что я бренчал на гитаре.


  И мы стали время от времени репетировать у меня дома, в Первомайке.


  Девчонки подходили к этому ответственно. Мы что-то сочиняли, играли, ржали. Так
  прошло какое-то время. Я всё мечтал сделать программу и наконец выступить в этом
  составе где-нибудь на рок-концерте.


  Но этого так не случилось. А случилось то, что однажды нарисовался Вайда, и мы с
  ним стали играть электричество.


  А песни, которые игрались с девчонками, пошли записать Айвару Янсону — опять же
  в ту же «Яунибу».


  Но он нам сказал: «У меня аппаратура сломана, работает только один канал». Но разве
  мне это было тогда важно? Мне это уже было не важно.


  Янсон вздохнул, и мы записали всё на один канал. С шипением, треском, помехами —
  какой-то материал.


  Вот так несерьёзно закончилась та самодеятельность, у которой в то время даже ещё
  не было названия.


  Название появилось лишь позже, когда через некоторое время мы с Вайдой выпустили
  на кассете группу «Глазки стекольщика», а на другой стороне поместили то, что мы
  записали с девчонками. И, как бы подыгрывая названию основной группы, написали на
  другой стороне: «Стельки бетонщика».'
description_en: 'After the disbanding of the band "Kvazimodo", the musical paths of
  its members diverged. Varik, Andrei Zelch, and Kuzya formed the band Carpe Diem,
  while I fell into the atmosphere of hitchhiking, Rezekne hippies, Daugavpils artists,
  raves, and freedom from work and unpleasant obligations.


  I gladly hitchhiked across my native Latvia, meeting new people and playing the
  guitar.


  I remember that many of the creative crowd hanging out at the "Saucer" [central
  fountain square in Daugavpils] moved into the Railway Technical College dormitory
  under the guise of Saules Art School students. There, in bursts of self-expression,
  the doors quickly became covered with drawings of various fish, eyes, and occasional
  stinking dogs.


  Life in that dormitory was very cheerful. Hippies came to visit, and local alternative
  youth, rockers, and artists dropped by. We lived like one big, happy pseudo-commune.


  At some point, I asked my friends from the "Saucer" — Guna, who played the accordion,
  and Tosya, who played the piano — to play along with what I was strumming on the
  guitar.


  We began rehearsing from time to time at my place in Pervomayka.


  The girls took it seriously. We composed, jammed, and laughed. Time went on like
  that. I kept dreaming of putting a program together and finally performing in this
  lineup somewhere at a rock concert.


  However, that never happened. Instead, Vaida appeared one day, and he and I started
  playing electric rock.


  As for the songs played with the girls, we went to record them with Aivars Jansons
  — once again at "Jaunība".


  He told us: "My equipment is broken, only one channel works." But did that really
  matter to me then? It no longer mattered to me at all.


  Jansons sighed, and we recorded everything onto a single channel. With hiss, crackle,
  and background noise — whatever material we had.


  That was how that casual amateur project ended, which at the time didn''t even have
  a name.


  The name only came later, when Vaida and I released a cassette of the band "Glazki
  stekolshchika" and put what we had recorded with the girls on the other side. And,
  playing off the main band''s name, we wrote on the flip side: "Stelki betonshchika".'
description_lv: 'Pēc grupas «Kvazimodo» darbības beigām dalībnieku muzikālie ceļi
  šķīrās. Variks, Andrejs Zelčs un Kuzja izveidoja grupu «Carpe Diem», savukārt es
  nokļuvu autostopa, Rēzeknes hipiju, Daugavpils mākslinieku, reivu un brīvības no
  darba un nepatīkamiem pienākumiem atmosfērā.


  Ar prieku ceļoju ar autostopiem pa dzimto Latviju, iepazinos ar jauniem cilvēkiem
  un spēlēju ģitāru.


  Atceros, ka daudzi no radošajiem cilvēkiem, kas pulcējās pie «Šķīvja» pilsētas centrā,
  iemitinājās Dzelzceļa tehnikuma kopmītnēs, uzdodoties par «Saules» mākslas skolas
  studentiem. Tur pašizpausmes uzplūdā durvis acumirklī tika apzīmētas ar visādām
  zivīm, acīm un šur tur smirdīgiem suņiem.


  Dzīve tajās kopmītnēs ritēja ļoti jautri. Ciemos brauca hipiji, iegriezās vietējie
  neformāļi, rokeri un mākslinieki. Dzīvojām kā viena liela, laimīga, šķietama komūna.


  Un kādā brīdī es palūdzu draugiem no «Šķīvja» — Gunai, kura prata spēlēt akordeonu,
  un Tosjai, kura mācēja klavieres, — paspēlēt līdzi tam, ko es trinkšķināju uz ģitāras.


  Un mēs sākām laiku pa laikam mēģināt pie manis mājās, Pirmā maija rajonā.


  Meitenes tam piegāja atbildīgi. Mēs kaut ko sacerējām, spēlējām, smējāmies. Tā pagāja
  kāds laiks. Es visu laiku sapņoju izveidot programmu un beidzot uzstāties šādā sastāvā
  kaut kur rokfestivālā vai koncertā.


  Bet tas tā arī nenotika. Tā vietā vienu dienu parādījās Vaida, un mēs ar viņu sākām
  spēlēt elektrisko mūziku.


  Savukārt tās dziesmas, kuras spēlējām ar meitenēm, devāmies ierakstīt pie Aivara
  Jansona — atkal jau tajā pašā «Jaunībā».


  Bet viņš mums teica: «Man aparatūra ir salūzusi, strādā tikai viens kanāls». Bet
  vai man tas tobrīd bija svarīgi? Man tas vairs nebija svarīgi.


  Jansons nopūtās, un mēs visu ierakstījām vienā kanālā. Ar šņākoņu, sprakšķiem, traucējumiem
  — kāds nu tas materiāls bija.


  Lūk, tik nenopietni beidzās tā pašdarbība, kurai tolaik pat vēl nebija nosaukuma.


  Nosaukums parādījās tikai vēlāk, kad pēc kāda laika mēs ar Vaidu kasetē izdevām
  grupu «Glazki stekoļščika», bet otrā pusē ievietojām to, ko bijām ierakstījuši ar
  meitenēm. Un, it kā apspēlējot pamatgrupas nosaukumu, otrā pusē uzrakstījām: «Steļki
  betonščika».'
