description: 'Да, был такой проект. Название родилось гораздо позже и явилось отголоском
  «Глазок Стекольщика», возможно потому, что оба проекта вышли на одной кассете с
  одной обложкой. Дело было в разгар «хипповского возрождения» в Латгалии, когда все
  играли, тусовались на тарелке и катались автостопом. Прекрасное время.


  Записывались у Янсона в «Яунибе», на 1 канал, т.к. пульт был сломан, а мне было
  невтерпеж. Отсюда и background noise ставший неотделимой частью альбома.


  Состав:

  Тося (клавиши, вокал)

  Гунна (аккордеон, вокал)

  Рыб (песни, гитара, вокал)

  Варик (бас, кое-где и муз. для «Весны»)

  Янсон (бонги)

  Андрон Фатхут (муз. для «Проникни в мой сад»)


  Запись 1996 года:

  01. Волосы

  02. Маки

  03. Тучка

  04. Атакующая балерина

  05. Гнусная правда

  06. Проникни в мой сад

  07. Пойдем со мной

  08. Воск на воск

  09. Семь

  10. У-у-у

  11. Мама не вернется

  12. Весна

  13. Куда попа - л

  14. Беги-беги'
description_en: 'Yes, there was such a project. The name was born much later and was
  an echo of "Glazki Stekolshchika", likely because both projects were released on
  the same cassette under one cover. It took place in the midst of the "hippie revival"
  in Latgale, when everyone played music, hung out at the "saucer" [central fountain
  square in Daugavpils], and hitchhiked. A wonderful time.


  We recorded at Yanson''s place at "Jaunība" onto a single channel, because the mixing
  board was broken and I was too impatient to wait. Hence the background noise that
  became an inseparable part of the album.


  Lineup:

  Tosya (keyboards, vocals)

  Gunna (accordion, vocals)

  Ryb (songs, guitar, vocals)

  Varik (bass, and some music for "Vesna")

  Yanson (bongos)

  Andron Fatkhut (music for "Pronikni v moy sad")


  1996 Recording:

  01. Volosy (Hair)

  02. Maki (Poppies)

  03. Tuchka (Little Cloud)

  04. Atakuyushchaya balerina (Attacking Ballerina)

  05. Gnusnaya pravda (Vile Truth)

  06. Pronikni v moy sad (Penetrate My Garden)

  07. Poydyom so mnoy (Come with Me)

  08. Vosk na vosk (Wax on Wax)

  09. Sem (Seven)

  10. U-u-u

  11. Mama ne vernyotsya (Mama Won''t Return)

  12. Vesna (Spring)

  13. Kuda popa - l (Where He Landed)

  14. Begi-begi (Run-Run)'
