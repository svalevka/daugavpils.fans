- Psychedelic Folk
license: https://creativecommons.org/licenses/by-nc-sa/4.0/
description: |-
  Единственный магнитоальбом проекта, записанный в 1996 году в Даугавпилсе в студии «Яуниба» у Айвара Янсона. Из-за неисправности пульта запись велась на один канал, что сформировало характерное аналоговое звучание альбома. Позже материал был выпущен на второй стороне магнитофонной кассеты «Ждите Изоптица» группы «Глазки стекольщика».
description_en: |-
  The project's sole tape album, recorded in 1996 in Daugavpils at Aivars Jansons' "Jaunība" studio. Due to a malfunction with the mixing console, the session was recorded onto a single channel, giving the record its distinctive raw analogue sound. The recording was later issued on the B-side of the cassette "Zhdite Izoptitsa" by Glazki Stekolshchika.
description_lv: |-
  Projekta vienīgais magnētalbums, ierakstīts 1996. gadā Daugavpilī Aivara Jansona studijā «Jaunība». Pults bojājuma dēļ ieraksts tika veikts vienā kanālā, radot albumam raksturīgo analogo skanējumu. Vēlāk materiāls tika izdots grupas «Glazki stekoļščika» kasetes «Zhdite Izoptitsa» B pusē.
