description: 'Первый альбом группы, записанный в 1993 году и представленный в актовом
  зале РТУ. Состав: Ермолаев Сергей (ударные, клавишные), Кондрусь (Годблин) Руслан
  (гитара, вокал), Кузьмин (Кузя) Геннадий (гитара, вокал, клавишные), Косчинский
  Олег (бас). Звукорежиссёр — Вострецов С. Оцифровано без потерь в FLAC.

  '
description_en: 'The band''s first album, recorded in 1993 and presented in RTU''s
  assembly hall. Lineup: Sergei Ermolaev (drums, keyboards), Ruslan Kondrus (Godblin)
  (guitar, vocals), Gennady Kuzmin (Kuzya) (guitar, vocals, keyboards), Oleg Koschinsky
  (bass). Sound engineer - S. Vostretsov. Digitized losslessly to FLAC.

  '
