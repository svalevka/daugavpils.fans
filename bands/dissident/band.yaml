description: 'Даугавпилсская рок-группа «Диссидент» (Dissident), активная в 1996–1997
  годах.


  Коллектив дебютировал на легендарном концерте в Башне Деда в конце 1996 года в составе:

  Слоик (вокал, гитара)

  Эд (гитара)

  Павло (бас)

  Билл (ударные)


  В 1997 году на студии "Egor Home Studio" была записана студийная демо-сессия:

  Слоик (ритм-гитара, вокал)

  Эд (лидер-гитара)

  Пабло (бас)

  Билли (ударные)'
description_en: 'Daugavpils rock band "Dissident", active in 1996–1997.


  The group debuted at the landmark Bashnya Deda concert in late 1996 with the lineup:

  Sloik (vocals, guitar)

  Ed (guitar)

  Pavlo (bass)

  Bill (drums)


  In 1997, they recorded a studio demo session at "Egor Home Studio":

  Sloik (rhythm guitar, vocals)

  Ed (lead guitar)

  Pablo (bass)

  Billy (drums)'
description_lv: |-
