description: 'А собрать группу оказалось проще простого, тем более что амбиций и гонору,
  и принципиальности у пацанов было хоть отбавляй. Так значит и собрались (прихватив
  с собой три акустических гитары): Леша Бородин, Андрюша Гржибовский и Леша Федотов
  (в последствии ставший Рэдом). Играть на инструментах не особо-то и умели, хотя
  кое-кто имел уже понятие о какой-то там гамме. Но тем не менее после первой же попытки
  стало понятно, что справиться с тремя шестистиструнками, и как-то разложить музыкальные
  партии, на тот момент было просто нереально, поэтому решили приобрести бас-гитару
  и торжественно вручит ее Андрею, с его же молчаливого согласия. Потом всю осень
  и зиму играли втроем (уже с бас-гитарой). Играли чужие песни и какие-то мало кому
  известные рэдовские вещи. И, наконец, не усидев в тесных квартирных стенах ребята
  купили барабаны, пригласили барабанщика (Славик Чикалов), и спустились в подвал.
  Погремев там какое-то время благополучно перебрались в ДК ЛРЗ (где уже можно было
  грохотать «во всю»). Так и грохотали они упоенно, зачарованные звуками и смыслом
  архаичного «русского рока». Пришедший на смену Славке Стаканыч (Саша Комаров) дал
  группе прогрессивную ритм-секцию, что серьезно сказалось на музыке. Появилось что-то
  похожее на аранжировки. Понятие о стиле существенно расширились. Просуществовав
  таким образом около двух лет, отыграв «пару-тройку» концертов в родном городе и
  фестиваль в Мадонне, группа, как большое зеркало, разлетелась на осколки. Часть
  из них «засветилась» потом в качестве музыкантов проекта «Relax», но это уже совсем
  другая история.


  Состав на записи 1996 года:

  Рэд (вокал, гитара)

  Алексей Бородин (гитара)

  Андрей Гржибовский (бас)

  Славик Чикалов (ударные)'
description_en: 'Forming a band turned out to be as simple as could be, especially
  since the guys had more than enough ambition, swagger, and stubborn pride. And so
  they gathered (bringing along three acoustic guitars): Lyosha Borodin, Andryusha
  Grzhibovsky, and Lyosha Fedotov (who later became Red). They didn''t really know
  how to play their instruments, although one of them already had some idea about
  musical scales. Nonetheless, after the very first try it became clear that managing
  three six-strings and arranging parts was simply impossible at the time, so they
  decided to buy a bass guitar and ceremoniously present it to Andrei, with his silent
  consent. They spent the entire autumn and winter playing as a trio (now with a bass
  guitar), playing cover songs and obscure original tunes written by Red. Finally,
  unable to sit any longer inside cramped apartment walls, the guys bought drums,
  recruited a drummer (Slavik Chikalov), and descended into a basement. After rattling
  around down there for a while, they successfully moved to the LRZ Palace of Culture
  (where they could finally make noise at full blast). And so they thundered away
  in ecstasy, spellbound by the sounds and meaning of archaic Russian rock. Sasha
  Komarov ("Stakanich"), who replaced Slavik, provided the band with a progressive
  rhythm section that seriously impacted the music. Something resembling actual arrangements
  emerged, and their musical horizons expanded considerably. Having existed this way
  for about two years, playing two or three local concerts and a festival in Madona,
  the band shattered like a giant mirror into pieces. Some of them later appeared
  as musicians in the "Relax" project, but that is an entirely different story.


  1996 Recording Lineup:

  Red (vocals, guitar)

  Aleksei Borodin (guitar)

  Andrei Grzhibovsky (bass)

  Slavik Chikalov (drums)'
