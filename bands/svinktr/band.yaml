description: |-
  Весь тот щит, который тебе предстоит или который ты уже имел удовольствие залить в свои уши, дорогой слушатель, начинался как задумка показать всем яростным ценителям и серьёзно настроенным приверженцам тяжёлой музыки, именуемой в простонародии “металлом”, логическую судьбу данного стиля и его неминуемое загнивание в давно забытых Богом провинциальных угодьях, протяжно стонущих уже не один год под неподъёмным пластом алкоголизма, похуизма, сволочного отношения людей к своим ближним и излишней зацикленности сознания их обитателей на призрачных атрибутах так-называемой красивой жизни. Как говорил один давно забытый персонаж произведений творческого объединения “Союзмультфильм” - “Хорошими делами прославиться нельзя”. Если провести аналогию между этим крылатым изречением и ситуацией в сегодняшних направлениях экстремальной музыки, то картина складывается примерно следующая: мастерством и техникой исполнения уже мало кого удивишь и зацепишь, как говорится, “за живое”, излишняя брутальность как средство убеждения тоже стремительно теряет свою эффективность, вызывая эстетическое несварение в постоянно растущих рядах “охотников за позитивом”, а двусмысленность и глубокая идейная направленность текстов, рассчитанных на наличие у аудитории способности читать между строк вообще на данный момент является чуть ли не жутчайшим анахронизмом эпохи интеллектуального искусства. Поэтому нам нужно было взять на вооружение какие-то более действенные методы воздействия на теперешнюю публику. И тогда нашими усилиями был создан “Свинктр” – убойный каломёт дальнего радиуса действия, сеющий вокруг себя скандалы, моральный беспредел и эпатаж. Он был призван низвергать из себя потоки жидких фекалий на зомбированных массовой вспышкой материальной паранойи и другими прелестями стадной культуры народ. Это как яд змеи, используемый в качестве лекарства. Одно говно против другого. Кто-то выразился о нашей музыке следующими словами: “От быдла и для быдла”. Что же, это весьма прицельное попадание, учитывая тот факт, что конечная цель наших творений заключается как раз в выявлении быдловских инстинктов у тех, на кого направлен прицел нашего каломёта. Почему “Свинктр”? Изначальная идея назвать команду “сфинктером” (кругловидной мышцою в анальном тракте человека, чьё расслабление приводит к эмиссии каловых масс наружу) была отвергнута в силу широкой популярности данного медицинского определения и попытками зацепиться за что-то более оригинальное. И тогда мы решили ещё добавить немного свинячества, в итоге чего появился “свинктр”, являющий собой простую игру слов (и мышц иже с ними). Почему трэш? Данное слово является в английском языке омофоном (слова, схожие по звучанию, но различающиеся по написанию), где в одном случае слово “thrash” используется для определения скоростного стиля метал-музыки, а в другом “trash” дословно переводится как “мусор”. Таким образом, нам удалось убить двух зайцев одним выстрелом, поскольку каломёт это оружие весьма скорострельное, ну а мусор это всё то, что засорило сознание сегодняшнего обывателя и что следует выбить из его головы очередями едкого поноса. Почему же, наконец, порно? Отчасти на это повлияло личное пристрастие автора этих строк к данному жанру искусства. Но повальное засилье сексуальной свободы тоже сыграло здесь свою решающую роль: излишняя популяризация однополых взаимоотношений в виде ежегодных столичных гей-парадов, реалити-шоу, призывающие молодёжь праздно коротать время в тихих уголках на природе, предаваясь разнузданным половым связям и засоряя экологию бесчисленными отходами латексной продукции. Нет, мы не какие-нибудь там моралисты, мы самые обыкновенные стёбщики, любящие завести и как надо развлечь публику, доведя её до нужной кондиции, при этом изрядно поглумившись над ценностями нашего больного общества. И мы надеемся, что эти четыре вкусных аудиокакашки доставят вам немало приятных моментов и обнажат перед вашими глазами всю ничтожность царящих вокруг культовых побрякушек. Приятного аппетита!

  Запись произведена у Константина Дзедзелиса в период с ноября 2006-го по январь 2007-го в следующем составе:
  Андрей “Перец” (ритм-гитара)
  Гена “Крид” (соло-гитара, сведение, сэмплирование на трэке “КУ”)
  Виктор “Абдула” (бас, вокал)
  Дима (ударные)
description_en: |-
  All that shit which lies ahead of you or which you have already had the pleasure of pouring into your ears, dear listener, began as a concept to demonstrate to all fierce connoisseurs and earnestly minded adherents of heavy music—known to the common folk as "metal"—the logical fate of this style and its inevitable rot in God-forsaken provincial backwaters, which have groaned for years under a crushing layer of alcoholism, apathy, callous treatment of fellow human beings, and excessive obsession with the ghostly trappings of the so-called beautiful life. As a once-famous Soyuzmultfilm cartoon character put it: "You can't get famous doing good deeds." If one draws an analogy between this catchphrase and today's extreme music scene, the picture is roughly this: virtuosic technique no longer surprises anyone or hits close to home, excessive brutality as a tool of persuasion is rapidly losing its punch, causing aesthetic indigestion in the ever-growing ranks of "positivity seekers," and the ambiguity and deep ideological substance of lyrics demanding an ability to read between the lines has become almost a horrifying anachronism of the age of highbrow art. We therefore needed far more potent methods of dealing with the contemporary audience. And so, through our collective efforts, "Svinktr" was conceived: a long-range shit-flinging artillery piece, sowing scandals, moral mayhem, and shock value. It was engineered to unleash torrents of liquid feces upon a populace brainwashed by mass-outbreaks of material paranoia and herd culture. Like snake venom used as an antidote—one pile of shit countering another. Someone once described our music: "By the rabble, for the rabble." A bullseye, considering that the ultimate goal of our creations is precisely to provoke those base instincts in whoever lands in the crosshairs of our shit-launcher. Why "Svinktr"? The original idea of naming the band "sphincter" (the circular muscle in the human anal canal whose relaxation releases fecal matter) was discarded due to the ubiquity of the medical term and the urge to seize on something more original. So we decided to inject a dose of swinishness ("svin"), giving birth to "svinktr"—a simple play on words (and muscles along with them). Why thrash? In English the word is a homophone: "thrash" refers to fast-tempo metal, while "trash" translates directly as garbage. We killed two birds with one stone: our launcher fires at high velocity, and trash is everything clogging the consciousness of today's philistine, which must be blown out of their skull by bursts of caustic diarrhea. And why porno? In part, the personal fondness of the author of these lines for this art form. But the rampant spread of permissive sexuality also played a decisive role: reality TV shows urging the youth to spend idle hours indulging in uninhibited flings and polluting the environment with endless latex refuse. No, we are no moralists—we are ordinary pranksters who love to rile up and entertain a crowd, bringing them to the right temperature while mercilessly ridiculing the sacred cows of our sick society. We hope these four savory audio-turds bring you plenty of pleasant moments and expose before your eyes the utter vanity of the idols ruling all around. Bon appétit!

  Recorded at Konstantīns Dzedzelis's studio from November 2006 to January 2007. Lineup:
  Andrei "Perets" (rhythm guitar)
  Gena "Kreed" (lead guitar, mixing, sampling on "KU")
  Viktor "Abdula" (bass, vocals)
  Dima (drums)
