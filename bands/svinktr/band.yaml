description: 'Группа «Svinktr» была основана в Даугавпилсе в 2006 году и прекратила
  существование летом 2008 года. Стиль группы сочетал в себе элементы порно-дэт-метала,
  трэша и грайндкора с русскоязычными пародийно-гротескными текстами. Состав: Виктор
  «Абдула» Ринкевич (бас, вокал), Максим «Волк» Попов (гитара), Андрей «Перец» Паприкосов
  (гитара), Артур «Портвейн» Соколов / Дмитрий (ударные).


  Запись единственного официального релиза группы — мини-альбома «Поступательные движения»
  — была произведена у звукорежиссера Константина Дзедзелиса в период с ноября 2006-го
  по январь 2007 года.

  '
description_en: 'The band Svinktr was formed in Daugavpils in 2006 and disbanded in
  the summer of 2008. The group''s sound blended porno death metal, thrash, and grindcore
  with grotesque parody lyrics in Russian. Lineup: Viktor ''Abdula'' Rinkevich (bass,
  vocals), Maxim ''Wolf'' Popov (guitar), Andrei ''Perets'' Paprikosov (guitar), Artur
  ''Portwein'' Sokolov / Dmitry (drums).


  The recording of the band''s sole official EP, ''Postupatelnye Dvizheniya'' (''Progressive
  Movements''), was engineered by Konstantīns Dzedzelis between November 2006 and
  January 2007.

  '
