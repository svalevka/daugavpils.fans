description: Nothing's New — даугавпилсская гаражная и инди-рок группа, активно выступавшая
  в начале 2010-х годов. Коллектив исполнял энергичный рок-н-ролл, гаражный рок и
  кавер-версии рок-классики (включая «Twist and Shout»). Группа принимала участие
  в городских мероприятиях Даугавпилса (в частности, в Празднике города 2011 с концертами
  в микрорайонах Грива, Новый Форштадт и Ругели), а также выступала в местных рок-кафе.
description_en: Nothing's New was an energetic garage and indie rock band from Daugavpils
  active in the early 2010s. Playing raw rock'n'roll, garage anthems, and vibrant
  covers (notably 'Twist and Shout'), the band performed across Daugavpils venues,
  including local rock clubs and neighborhood outdoor stages during City Days 2011
  in Grīva, Jaunā Forštate, and Ruģeļi.
description_lv: Nothing's New bija Daugavpils garāžroka un indīroka grupa, kas aktīvi
  darbojās 2010. gadu sākumā. Izpildot enerģisku rokenrolu, garāžas skanējuma kompozīcijas
  un kaverversijas (tostarp «Twist and Shout»), grupa uzstājās pilsētas klubos un
  Daugavpils pilsētas svētkos 2011. gadā apkaimju skatuvēs Grīvā, Jaunajā Forštatē
  un Ruģeļos.
