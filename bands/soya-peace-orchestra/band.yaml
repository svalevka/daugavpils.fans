description: 'Музыкальный коллектив из Даугавпилса, основанный в 2007 году семью музыкантами.
  В название заложена игра слов: «Soya Peace Or Chest Ra» («Соевая благодать или Сундук
  Ра / Сундук Солнца»).


  Группа активно выступала на фестивалях Chemical Reaction (2008, 2009), в даугавпилсских
  клубах «Улитка» (Gliemezis, 2008) и «Banzai» (2011), на Празднике города Даугавпилса
  (2010), а также давала живые эфиры на телевидении Dautkom TV. В 2019–2020 годах
  коллектив снял в Динабургской крепости клип на сингл «Двое у колыбели» (слова Александра
  Гридасова, музыка Владимира Куранова, вокал Виктории Чинновой).'
description_en: 'Musical collective from Daugavpils, founded in 2007 by seven musicians.
  The band''s name contains a bilingual pun: "Soya Peace Or Chest Ra" ("Soy Grace,
  or the Sun God Ra''s Chest").


  The band actively performed at the Chemical Reaction festivals (2008, 2009), at
  Daugavpils underground clubs "Ulitka" (Gliemezis, 2008) and "Banzai" (2011), during
  the Daugavpils City Festival (2010), and performed live in-studio sessions on Dautkom
  TV. In 2019–2020, the group filmed a music video inside the Dinaburg fortress for
  the single "Two at the Cradle" (lyrics by Alexander Gridasov, music by Vladimir
  Kuranov, vocals by Victoria Chinnova).'
