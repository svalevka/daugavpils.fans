description: MaYo — даугавпилсская рок-группа, основанная в 2023 году вокалисткой
  Юлией Росовской и опытным гитаристом Владимиром Дроздовским (известным по группам
  Disease, Silversand и CrossFire). Коллектив играет энергичный хард-рок и альтернативный
  рок с сильным женским вокалом. В 2024 году группа выпустила дебютный полноформатный
  альбом «...On The Pūces Street...», названный в честь улицы Пуцес в Даугавпилсе.
description_en: MaYo is a Daugavpils rock band founded in 2023 by frontwoman Julija
  Rosovska and seasoned guitarist Vladimirs Drozdovskis (veteran of Disease, Silversand,
  and CrossFire). The group performs dynamic hard rock and alternative rock characterized
  by driving rhythm and expressive female vocals. In 2024, they released their debut
  full-length album '...On The Pūces Street...', named after Pūces Street in Daugavpils.
description_lv: MaYo ir Daugavpils rokgrupa, ko 2023. gada izveidoja dziedataja Julija
  Rosovska un pieredzejusais gitarists Vladimirs Drozdovskis (spelejis Disease, Silversand
  un CrossFire). Grupa izpilda energisku hardroku un alternativo roku ar spilgtu sieviesu
  vokalu. 2024. gada grupa izdeva debijas albumu '...On The Puces Street...', kas
  nosaukts par godu Puces ielai Daugavpili.
