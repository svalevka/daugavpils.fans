description: 'Панк-группа «Неврастения» образовалась в Даугавпилсе в 1997 году. Репетиции
  проходили в гаражах и подвальных помещениях города. В состав вошли Александр Гридасов
  (Гридас), Александр Таманс (Шура), Андрей Сокольников (Сокол) и Геннадий Русецкий.
  Именно во время совместных репетиций «Неврастении» музыканты познакомились с молодым
  Артуром Петровым (Будулаем), который приходил слушать группу и вскоре начал играть
  с Гридасом. Осенью 1998 года из-за творческих разногласий группа распалась, дав
  начало двум знаковым коллективам даугавпилсской сцены: Александр Гридасов вместе
  с Будулаем создали панк-группу «Виселица», а Александр Таманс с Соколом основали
  группу «Двойная Вода».'
description_en: 'The punk rock band Nevrasteniya formed in Daugavpils in 1997. Rehearsing
  in local garages and basement spaces, the lineup consisted of Aleksandr Gridasov
  (''Gridas''), Aleksandrs Tamans (''Shura''), Andrei Sokolnikov (''Sokol''), and
  Gennady Rusetsky. During their rehearsals, the band met young Artur Petrov (''Budulajs''),
  who regularly hung out to listen and soon began playing with Gridas. In autumn 1998,
  creative differences led to the band''s dissolution, directly giving birth to two
  cornerstone acts of the Daugavpils underground: Gridasov and Budulajs went on to
  form Viselica, while Tamans and Sokolnikov founded Dvojnaja Voda.'
description_lv: 'Pankroka grupa Nevrasteniya izveidojas Daugavpili 1997. gada. Meiginajumi
  notika vietejas garazas un pagrabos. Sastava speleja Aleksandrs Gridasovs (Gridas),
  Aleksandrs Tamans (Sura), Andrejs Sokolnikovs (Sokol) un Genadijs Ruseckis. Meiginajumu
  laika vinus iepazina jaunais Arturs Petrovs (Budulajs), kurs biezi klausijas grupu
  un driz saka muzicet kopa ar Gridasovu. 1998. gada rudeni radošo domstarpibu del
  grupa izjuka, kluvod par tieso pamatu divam nozimigam Daugavpils grupam: Gridasovs
  un Budulajs nodibinaja grupu Viselica, bet Tamans un Sokolnikovs izveidoja grupu
  Dvojnaja Voda.'
