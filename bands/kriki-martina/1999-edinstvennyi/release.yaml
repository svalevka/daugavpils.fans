description: 'Даугавпилс. Латвия. 1999 год. Беззаботная юность..


  Женя Дерива - Баc и подтанцовочки

  Серёжа Хороший - соляга и подпевочки

  Валера Радуга - голос, танцульки и гитарка

  Стакан Комаров - ритмы и тарелочки

  Толстый Пух - ритмы и тарелочки

  Авовка - ритмы и тарелочки

  Гена Кузя - соляга и весь местный престиж!'
description_en: 'Daugavpils. Latvia. 1999. Carefree youth..


  Zhenya Deriva - bass and backup dancing

  Seryozha Khoroshy - solo licks and backing vocals

  Valera Raduga - voice, dancing and guitar

  Stakan Komarov - rhythm and cymbals

  Tolstyi Pukh - rhythm and cymbals

  Avovka - rhythm and cymbals

  Gena Kuzya - solo licks and all the local prestige!'
