description: Anti Satika (Anti-Satika) — латгальская альтернативная рок-группа из
  Резекне, активно участвовавшая в рок-движении региона и регулярно выступавшая в
  Даугавпилсе. Коллектив делил сцену с даугавпилсскими группами (включая Автопортрет,
  Архангел и Soya Peace Orchestra), в частности на фестивале Chemical Reaction, в
  клубе Banzai и на рок-концерте ко Всемирному дню борьбы со СПИДом 5 декабря 2008
  года в Даугавпилсе.
description_en: Anti Satika (Anti-Satika) was an alternative rock and punk band from
  Rēzekne (Latgale) with strong ties to the Daugavpils rock community. The group frequently
  shared stages with prominent Daugavpils acts such as Avtoportret, Arhangel, and
  Soya Peace Orchestra, playing at the Chemical Reaction festival, Banzai rock club,
  and the World AIDS Day rock concert in Daugavpils on December 5, 2008.
description_lv: Anti Satika (Anti-Satika) bija Latgales alternatīvā roka un pankroka
  grupa no Rēzeknes, kas aktīvi piedalījās reģiona rokmūzikas dzīvē un regulāri koncertēja
  Daugavpilī. Grupa dalīja skatuvi ar pazīstamām Daugavpils grupām (tostarp Avtoportret,
  Arhangel un Soya Peace Orchestra), uzstājoties festivālā Chemical Reaction, klubā
  Banzai un Pasaules AIDS dienai veltītajā koncertā 2008. gada 5. decembrī Daugavpilī.
