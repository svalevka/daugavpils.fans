description: Asthma (ранее выступавшая под названием «Балагуры») — знаковая даугавпилсская
  трэш/дэт-метал группа, основанная в начале 2009 года гитаристом Максимом «Волком»
  Поповым (Mr. Volff) и барабанщиком Артуром Соколовым (Портвейн). Позже вокалистом
  группы стал Виктор Ринкевич (Абдула / Фека из группы Свинктр), а за барабаны сел
  Дмитрий Сухановский. Группа играла бескомпромиссный, скоростной трэш-метал с элементами
  дэт-метала и панк-рока. В 2009 году группа выпустила полноформатный альбом «Most
  Evil», в 2013 году — демо «Trigger Happy», и участвовала в национальном отборе «Wacken
  Metal Battle Latvia 2013». В 2014 году коллектив трансформировался в знаменитую
  фолк-метал группу Varang Nord.
description_en: Asthma (originally known as Balagury) was a powerhouse Daugavpils
  thrash/death metal band formed in early 2009 by lead guitarist Maxim 'Mr. Volff'
  Popov and drummer Arthur 'Portwein' Sokolov. Later joined by vocalist Victor 'Abdula'
  Rinkevich (from Svinktr) and drummer Dmitry Suhanovsky, the band played aggressive,
  relentless thrash/death metal with punk attitude. Asthma released the full-length
  album 'Most Evil' (2009) and the demo 'Trigger Happy' (2013), competing in the Wacken
  Metal Battle Latvia 2013. In 2014, the core lineup evolved into the internationally
  celebrated folk metal outfit Varang Nord.
description_lv: Asthma (sakotneji pazistama ka Balaguri) bija nozimiga Daugavpils
  thrash/death metal grupa, kuru 2009. gada sakuma izveidoja sologitarists Maksims
  'Mr. Volff' Popovs un bungieris Arturs 'Portwein' Sokolovs. Velak grupai pievienojas
  vokalists Viktors 'Abdula' Rinkevics (no grupas Svinktr) un bungieris Dmitrijs Suhanovskis.
  Grupa speleja atru un agresivu trasmetalu ar death metal un panka elementiem. Asthma
  izdeva pilnmetrazas albumu 'Most Evil' (2009), demo 'Trigger Happy' (2013) un piedalijas
  konkursa Wacken Metal Battle Latvia 2013. 2014. gada grupas kodols parveidojas par
  starptautiski atzito folkmetala grupu Varang Nord.
