description: Saintorment — даугавпилсская олдскульная трэш-метал группа, образованная
  в 2013 году. В состав вошли опытные музыканты города, включая Максима «Волка» Попова
  (Varang Nord) и Артура Буценеца. Группа играет скоростной, бескомпромиссный трэш-метал
  в традициях Kreator, Slayer и ранней Sepultura. Saintorment гастролировали по странам
  Балтии и Восточной Европы, выпустив альбомы «Well of Sins» (2015) и «Defective Mind»
  (2017).
description_en: Saintorment is an old-school thrash metal outfit founded in Daugavpils
  in 2013. Its lineup brought together prominent local musicians, including Maksims
  'Wolf' Popovs (Varang Nord) and Artūrs Buceņecs. Delivering aggressive, high-speed
  thrash in the vein of Slayer, Kreator, and early Sepultura, Saintorment toured extensively
  across the Baltic states and Eastern Europe, releasing 'Well of Sins' (2015) and
  'Defective Mind' (2017).
description_lv: Saintorment ir Daugavpils thrash metal grupa, dibinata 2013. gada.
  Tās sastāva speleja labakie vietējie smagas muzikas interpreti, tostarp Maksims
  'Wolf' Popovs (Varang Nord) un Arturs Bucenecs. Saintorment izpilda atru, agresivu
  trasu klasiskajas Slayer un Kreator tradicijas, koncertēja Baltija un Austrumeiropa,
  izdeva albumus 'Well of Sins' (2015) un 'Defective Mind' (2017).
