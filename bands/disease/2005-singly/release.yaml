description: 'Два сингла 2005 года, размещённые на личной странице группы на сайте
  zanoza.lv (найдены через веб-архив web.archive.org) - других сведений об их записи
  не сохранилось. "Dead Young" здесь - более ранняя/отдельная версия: на альбоме "I
  Stay Here" (2006) есть трек с тем же названием, но это другой файл (иной размер
  и, вероятно, другое сведение), поэтому обе версии сохранены отдельно, а не как дубликат.'
description_en: 'Two 2005 singles posted on the band''s zanoza.lv page (recovered
  via the Wayback Machine, web.archive.org) - no further details about their recording
  survive. "Dead Young" here is an earlier/separate version: the "I Stay Here" (2006)
  album has a track with the same title, but it is a distinct file (different size,
  likely a different mix), so both versions are kept rather than treating this as
  a duplicate.'
