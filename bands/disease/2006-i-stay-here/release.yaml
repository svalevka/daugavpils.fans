description: |-
  Альбом "I Stay Here" (2006) — вершина инструментального симфо-метал периода группы Disease.

  Пройдя путь от сырого панк-рока образца 1996 года («Транквилизатор») через doom и sympho-black metal, группа к 2002 году окончательно сформировала свой почерк: мощнейший instrumental sympho-metal, сочетающий тяжелые гитарные риффы, полифонические клавишные и живые струнные инструменты (скрипка, альт). После триумфа на фестивалях Chemical Reaction 2001 (1-е место), финала легендарного «Лиепаяс Дзинтарс» 2002 года (где Вадим Ветрин был признан лучшим барабанщиком Латвии), совместного выступления с Иевой Акуратере на фестивале «Bildes» в рижском Доме конгрессов и победы на «Sinepes un Medus 2003» с призовой записью на профессиональной студии «SSS» в Сигулде, Disease воплотили весь накопленный опыт в монументальном полотне "I Stay Here".

  Состав записи:
  Павел Степанов (Питон) — гитара, композиция, сведение
  Вадим Ветрин — ударные
  Роман Максимов — бас-гитара
  Тимур Озун — скрипка
  Виктор Станкевич — альт
description_en: |-
  The album 'I Stay Here' (2006) represents the pinnacle of Disease's instrumental symphonic metal era.

  Having evolved from raw punk rock in 1996 ('Tranquilizer') through doom and symphonic black metal, the group by 2002 forged its signature sound: monumental instrumental sympho-metal blending heavy, intricate guitar riffs, layered keyboards, and classical live strings (violin and viola). Following victories at Chemical Reaction 2001 (1st place), reaching the grand finals of the legendary Liepājas Dzintars 2002 (where Vadim Vetrin won the Best Drummer of Latvia award), performing alongside celebrated singer Ieva Akuratere at the Bildes festival in the Riga Congress House, and winning 1st place at Sinepes un Medus 2003 with prize recording sessions at SSS Studio in Sigulda, Disease channeled their decade of mastery into 'I Stay Here'.

  Recording lineup:
  Pavel Stepanov (Piton) — guitars, composition, sound engineering
  Vadim Vetrin — drums
  Roman Maksimov — bass guitar
  Timur Ozun — violin
  Viktor Stankevich — viola
