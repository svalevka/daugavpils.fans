description: 'Даугавпилсский андеграундный рок-проект «Мегалиты подземных рек» (Megaliths
  of Underground River), существовавший в середине 1990-х годов.


  В конце 1996 года группа выступила на фестивале в Башне Деда в составе:

  Александр Марьевич (вокал)

  Вантуз (гитара)

  Кузя (бас)

  (клавиши)


  В том же году на домашней студии была записана студийная сессия проекта:

  Вантуз (вокал, гитара)

  Джеф (вокал)

  Кузя (бас)

  Плечкин (контрабас)'
description_en: 'Daugavpils underground experimental rock project "Megality podzemnykh
  rek" (Megaliths of Underground River), active in the mid-1990s.


  In late 1996, the group performed at the Bashnya Deda concert with the lineup:

  Aleksandr Maryevich (vocals)

  Vantuz (guitar)

  Kuzya (bass)

  (keyboards)


  That same year, a studio session was recorded at Kuzya''s home studio:

  Vantuz (vocals, guitar)

  Jeff (vocals)

  Kuzya (bass)

  Plechkin (double bass)'
