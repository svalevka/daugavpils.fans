description: Down to Heaven — даугавпилсская группа, сочетавшая элементы мелодик-метала,
  симфо-рока и альтернативы. Фронтвумен коллектива Юлия отвечала за чистый академичный
  вокал и фортепианные аранжировки. Группа регулярно выступала на фестивале Chemical
  Reaction и городских рок-концертах в середине 2010-х годов.
description_en: Down to Heaven was a Daugavpils melodic metal and symphonic rock group
  active in the 2010s, fronted by singer/pianist Yulia alongside guitarist Pavel.
  They were regular fixtures at the Chemical Reaction festival and local rock showcases.
description_lv: Down to Heaven bija Daugavpils melodiska metala un simfoniska roka
  grupa, kas darbojās 2010. gados. Grupas prieksgala bija dziedataja un pianiste Julija.
  Kolektivs regulari uzstajas Chemical Reaction festivalos un Daugavpils rokpasakumos.
