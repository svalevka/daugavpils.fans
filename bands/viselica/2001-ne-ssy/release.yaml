description: 'Первый альбом группы, записан живьем на репетиционной точке группы Disease
  в конце 2000 года. Состав: Артур Петров (Будулай) — гитара, вокал; Александр Гридасов
  (Гридас) — бас, бэк-вокал; Вадим Ветрин — ударные.

  '
description_en: 'Debut album, recorded live at the rehearsal studio of Disease in
  late 2000. Lineup: Artur Petrov (Budulai) — guitar, vocals; Alexander Gridasov (Gridas)
  — bass, backing vocals; Vadim Vetrin — drums.

  '
