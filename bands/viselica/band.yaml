description: 'Предысторией создания группы было знакомство Артура Петрова (Будулай)
  и Александра Гридасова (Гридас). Оба жили в Даугавпилсе. Еще до знакомства они были
  наслышаны и друг о друге, и о схожести своих взглядов. Будулай до основания группы
  был начинающим музыкантом-одиночкой, исполняющим на панковских сборищах песни других
  групп. Гридас же играл в панк-группе "Неврастения". Познакомились они после посещения
  Будулаем репетиции "Неврастении". Однажды на одной из репетиций, после упреков вокалиста
  в сторону Гридаса, насчет исполнения музыки, Гридас послал всех и ушел из группы.
  В течении некоторого времени Гридаса пытались уговорить вернутся. Но было уже поздно,
  после знакомства, Будулай и Гридас твердо решили исполнять музыку бунта. В тот же
  период состоялось первое выступление Будулая на сцене, в июне 99-го он спел песню
  "Любер" (Гражданская Оборона) с группой "Glazki Stekolscika". Это событие окончательно
  вдохновило Будулая и Гридаса, и, несмотря на отсутствие помещения для репетиций,
  начали появляться свои песни.


  Летом 99-го на квартире записывается песня "Бей буржуев". Группа приглашается на
  рок концерт 18 февраля 2000-го года в Центр Латышской Культуры. Концерт проходит
  очень удачно. Прямо перед концертом придумывается название, так появляется "Виселица".


  Роли в группе распределились так: Будулай - вокалист, гитара. Гридас - бас, подпевки.
  За весь период истории группы не существовало своего барабанщика, за ударники садились
  люди из других групп. На музыку Виселицы оказали влияние, как Гражданская Оборона,
  так и Exploited. Тяжёлый панк-рок с экстремистскими текстами. В 2000-ом "Виселицу"
  приглашают на разогрев к самому Егору Летову. Летова в Латвию не пустили, что привело
  к импровизированному концерту "Виселицы" прямо на улице, среди толпы панков, закончившемуся
  массовыми беспорядками. Это окончательно обеспечило за "Виселицей" широкую популярность
  в узких кругах и репутацию законченных нигилистов.


  Далее группа провела несколько концертов в Двинске и Риге, обычно заканчивавшихся
  отрубанием звука, изгнанием со сцены, драками и прочими скандалами. Один концерт
  даже закончился административным судом, на сцене был порван американский флаг. Помимо
  концертов группа начинает писать альбомы. Первый альбом, "Не ссы!", был записан
  в живую на репетиционной студии группы "Disease" в конце 2000-го.

  '
description_en: 'The backstory to the band''s founding was the meeting of Artur Petrov
  (Budulai) and Alexander Gridasov (Gridas), both living in Daugavpils. Even before
  meeting in person, they had heard of each other and of the similarity of their outlooks.
  Before founding the band, Budulai was a novice solo musician playing covers of other
  bands at punk gatherings. Gridas played in the punk band Nevrasteniya. They met
  after Budulai visited a Nevrasteniya rehearsal. During one rehearsal, after complaints
  from the vocalist about Gridas''s playing, Gridas told everyone off and quit the
  group. For some time they tried to convince Gridas to return, but it was already
  too late: having met, Budulai and Gridas resolved firmly to play the music of rebellion.
  Around that same time Budulai made his first onstage appearance, singing Grazhdanskaya
  Oborona''s ''Lyuber'' with Glazki Stekolshchika in June 1999. This event finally
  inspired Budulai and Gridas, and despite having no rehearsal space, their own songs
  began to emerge.


  In the summer of 1999 they recorded the song ''Bey burzhuev'' (''Beat the Bourgeois'')
  in an apartment. The band was invited to perform at a rock concert on February 18,
  2000, at the Center of Latvian Culture (CLK). The concert was a success. Right before
  the show they came up with a name, and thus ''Viselica'' (''Gallows'') was born.


  Roles in the band: Budulai on lead vocals and guitar; Gridas on bass and backing
  vocals. Throughout the band''s history they never had a permanent drummer of their
  own; drummers from other groups sat behind the kit. Viselica''s sound was influenced
  by Grazhdanskaya Oborona and The Exploited alike: heavy punk rock with radical lyrics.
  In 2000 Viselica was invited to open for Egor Letov himself. Letov was denied entry
  into Latvia, which sparked an impromptu outdoor street concert by Viselica in the
  midst of a punk crowd that culminated in widespread riots. This cemented Viselica''s
  underground fame and reputation as uncompromising nihilists.


  The group went on to play several gigs across Dvinsk and Riga, usually ending with
  cut cables, expulsions from the stage, brawls, and other scandals. One gig even
  ended in municipal court after an American flag was torn up on stage. Alongside
  live shows, the band began recording albums. Their debut album, ''Ne ssy!'' (''Don''t
  Chick Out!''), was recorded live at the rehearsal studio of the metal band Disease
  in late 2000.

  '
