- Кузя — бас, соло (трек 2, "Возмездие")
- Емеля — флейта (трек 3, "Марш 1")
- Варик — бас, Кузя — клавиши (трек 4, "Который звал себя Я")
- Емеля — клавиши (трек 5, "Осознание")
