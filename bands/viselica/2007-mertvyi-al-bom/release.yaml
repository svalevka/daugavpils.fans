creditText_en:
- A. Lebedeva, Budulai — vocals (track 1, "Dies Irae — Detishki zakhvatili boing")
- Kuzya — bass, guitar solo (track 2, "Vozmezdie")
- Emelya — flute (track 3, "Marsh 1")
- Varik — bass, Kuzya — keyboards (track 4, "Kotoryi zval sebia ia")
- Emelya — keyboards (track 5, "Osoznanie")
- RHY — arrangement (track 10, "Marsh 2"), mastering for the whole album
- Cover — photo by A. Lebedeva, design by the studio "Postupatelnye Dvizheniya" and
  Pavel Brat
