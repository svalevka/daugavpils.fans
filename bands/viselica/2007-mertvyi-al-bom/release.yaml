description: 'Третий альбом Виселицы, "Мертвый альбом", вышел 15 июля 2007 года -
  спустя пять лет после "Резни" и уже после ареста, психиатрической экспертизы и тюремного
  заключения Артура Петрова (Будулая). Большая часть музыки и текстов написана Будулаем,
  две песни ("Который звал себя Я" и "Радость") - на стихи Бориса Савинкова, эсера-боевика
  и писателя начала XX века, ещё одна ("Возмездие") - на стихи поэта Рамиреса. Гридас
  написал музыку и текст к песне "Фото" и музыку к "Папке". В записи участвовали приглашённые
  музыканты: А. Лебедева (вокал), Кузя (бас, соло), Варик (бас), Емеля (флейта, клавиши);
  аранжировку последнего трека и мастеринг всего альбома сделал RHY. Обложка собрана
  из фотографии А. Лебедевой и оформления студии "Поступательные Движения" и художника
  Павла Брата.'
description_en: Viselica's third album, 'Mertvyi albom' ('Dead Album'), came out on
  July 15, 2007 - five years after 'Reznia', and after Artur Petrov (Budulai) had
  already been through arrest, forced psychiatric evaluation, and imprisonment. Most
  of the music and lyrics were written by Budulai; two songs ('Kotoryi zval sebia
  ia' and 'Radost') set to poems by Boris Savinkov, an early-20th-century Socialist-Revolutionary
  militant and writer, and one ('Vozmezdie') to a poem by the poet Ramires. Gridas
  wrote both music and lyrics for 'Foto' and the music for 'Papka'. Guest musicians
  on the record included A. Lebedeva (vocals), Kuzya (bass, guitar solo), Varik (bass),
  and Emelya (flute, keyboards); the final track's arrangement and the whole album's
  mastering were done by RHY. The cover combines a photograph by A. Lebedeva with
  design work by the studio 'Postupatelnye Dvizheniya' and the artist Pavel Brat.
