description: '"Фон" - четвёртый альбом Виселицы, выложенный для свободного скачивания
  31 января 2011 года. В отличие от предыдущих панк-альбомов группы, "Фон" - это одиннадцать
  безымянных, пронумерованных фрагментов ("Фон 1"-"Фон 11"), построенных на фоновых
  шумовых и эмбиентных текстурах, поверх части которых читаются стихи - в том числе
  стихи Бориса Савинкова (треки "Фон 3" и "Фон 7") и текст самого Артура Петрова (Будулая)
  (трек "Фон 8"). Обложка альбома оформлена в виде звуковых спектрограмм самих треков.'
description_en: '''Fon'' (''Background'') is Viselica''s fourth album, released for
  free download on January 31, 2011. Unlike the band''s earlier punk records, ''Fon''
  consists of eleven untitled, numbered fragments (''Fon 1'' through ''Fon 11'') built
  from background noise and ambient textures, with some of them set to recited poetry
  - including poems by Boris Savinkov (tracks ''Fon 3'' and ''Fon 7'') and a text
  by Artur Petrov (Budulai) himself (track ''Fon 8''). The cover art is composed of
  the tracks'' own sound spectrograms.'
