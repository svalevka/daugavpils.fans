description: |-
  Второй альбом "Резня", записанный летом 2002 года, был на более высоком уровне. По поводу концерта в честь 7-го ноября появилась огромная статья в газете "Час". Группу даже стали приглашать на гастроли в ближнее зарубежье, в литовский город Висагинас. 2002 год отметился еще и вызовом Артуром Петровым, 27-ого августа, через газеты, на поединок редактора нацистской газеты DDD и хозяина книжного издательства Айвара Гарду, за оскорбление русского народа. Гарда отказался от встречи.

  Ну а потом случилось основное событие в истории группы, 20 ноября 2002-го Артур Петров был арестован Полицией Безопасности ЛР по обвинению в хранении тротила, призывах к свержению конституционного строя (в уголовное дело попал даже первый альбом "Не ссы!") и, вдобавок, организации покушения на президента республики. Последнее обвинение отпало сразу, остальные лишь через полтора года. Семь месяцев из них было проведено в Рижской Центральной Тюрьме. За это время группа стала почти легендой, две песни даже прозвучали на канале РТР в программе про левых радикалов. Несмотря на то, что в течение года после освобождения музыкальная деятельность вокалиста группы была ограничена жестким полицейским надзором (ежедневные отмечания в полиции и необходимость находиться по месту жительства с 22:00 до 8:00), после выхода Будулая на свободу группа возобновила деятельность, участвуя в рок-концертах. Кроме этого был открыт сайт группы (www.viselica.lenin.ru), где было выложено в свободном доступе практически всё, созданное группой, включая раннюю акустику и видео с концертов.
description_en: |-
  The band's second album, 'Reznia' ('Massacre'), recorded in the summer of 2002, reached a noticeably higher musical plane. A performance marking the November 7th holiday was covered in an extensive spread in the national daily newspaper 'Chas'. The group began receiving invitations to tour abroad, including in the Lithuanian town of Visaginas. The year 2002 was also marked by Artur Petrov issuing a public newspaper challenge on August 27 to a duel against Aivars Garda, the publisher and editor of the ultranationalist newspaper DDD, for insulting the Russian people. Garda declined the challenge.

  Then arrived the central event in the band's history: on November 20, 2002, Artur Petrov was arrested by the Security Police of Latvia on charges of illegal storage of TNT, incitement to overthrow the constitutional order (even their debut album 'Ne ssy!' was entered into evidence by prosecutors), and plotting an assassination attempt against the President of Latvia. The presidential accusation fell apart immediately; the remaining charges took eighteen months to resolve, seven months of which were spent in Riga Central Prison. During this period the band attained legendary underground status, with two songs broadcast on the Russian television network RTR in a documentary on radical leftists. Despite strict post-release police supervision for a year (daily check-ins at the local precinct and an 8 PM to 10 AM home curfew), once Budulai was released the band resumed performances at rock concerts and launched an official website (www.viselica.lenin.ru), making their entire catalog freely accessible.
