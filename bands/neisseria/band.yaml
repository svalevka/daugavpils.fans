description: 'История группы:

  Вернемся в 90-е года. Виктор Прокофьев и Егор Белов под влиянием флоридской death
  metal сцены решили принести такую музыку в свой город. На должность второго гитариста
  им удалось найти Алексея Красько (Вантуз), на ударных был Вадим (Beast). Это была
  четверка носителей смерти Neisseria. Они были первой death metal группой в городе.
  На первом своем концерте Neisseria выступала вместе с группами Двинск, Имаго. В
  92/93 барабанщиком группы стал Игорь Магарил, с его мастерством игры на ударных
  Neisseria стала звучать еще тяжелее. С успехом отыграв в Литве с новым лицом, группа
  решила записать promo-demo, но, к сожалению, ни одна местная студия не решалась
  записать Neisseria, так как группа была чересчур тяжела для их слуха. Но, несмотря
  на это, группа продолжала свое творчество в стиле death metal, звучание же стало
  еще тяжелее. Neisseria успешно выступила на рок фестивале “Гильотина для всех” и
  еще на нескольких местных концертах. В конце 1993-го группе удалось записать первое
  promo-demo “Internal Suffering” в местной студии. В этой записи был самый брутальный
  звук группа. Расслабившись, Neisseria двигала вперед и в 94-ом решила записать новое
  demo “Fear” в местной Neatkariga studija. В конце 94-го Алексей решил быть участником
  группы Имаго и ушел из Neisseria. Несмотря на потерю второго гитариста…


  Самая тяжелая группа (статья из даугавпилсской прессы, Д. Тэрин, фото Г. Самса):

  Американские биологи пришли к выводу, что основными обитателями нашей планеты являются
  бактерии. Растения, животные и даже человек - это всего лишь их питательная среда.
  Участники даугавпилсской рок-группы "Neisseria" в своих рассуждениях пошли еще дальше.
  Они считают, что сам человек из себя представляет одну большую бактерию, в которой
  все перемешано - зло, добро. Отсюда и название группы, позаимствованное из справочника
  по внутренним заболеваниям.

  Группа играет в стиле "death", что в переводе с английского означает "смерть".

  И действительно, музыка в их исполнении чем-то напоминает вопли заживо погребенных
  страдальцев. Судя по реакции публики во время их выступления, такая музыка нравится.

  Своими выступлениями в Латвии и Литве "Neisseria" завоевала себе репутацию самой
  тяжелой группы Даугавпилса.

  Сейчас ребята работают над программой, все песни которой совершенно новые. Лирические
  тексты к ним столь же тяжелые, сколь и сами песни. Одни только названия чего стоят:
  "Вечно больная душа" или "Тяжелые сны".

  Ребята считают, что им еще долго удастся удержать свои позиции, хотя в нашем городе,
  по их мнению, творческое развитие очень затруднительно. А после триумфального успеха
  на рок-фестивале "Гильотина для всех" группа и вовсе лишилась помещения для репетиций
  в театре.

  Теперь ребятам приходится работать в неимоверно тяжелых условиях. Может быть, поэтому
  их музыка стала еще тяжелой, чем прежде.


  Состав:

  Виктор "Моряк" Прокофьев (вокал, бас-гитара)

  Алексей "Вантуз" Красько (гитара)

  Игорь "Егор" Белов (гитара)

  Игорь Магарилл (ударные)'
description_en: 'Band History:

  Back in the 1990s, Viktor Prokofyev and Egor Belov, influenced by the Florida death
  metal scene, decided to bring this music to their city. They found a second guitarist
  in Aleksei Krasko ("Vantuz"), while Vadim ("Beast") was on drums. This was the lethal
  quartet of Neisseria, the first death metal band in Daugavpils. At their first concert,
  Neisseria shared the stage with Dvinsk and Imago. In 1992/93, Igor Magarill became
  the band''s drummer, and with his technical drumming mastery Neisseria sounded heavier
  than ever. Following successful concerts in Lithuania, the band sought to record
  a promo demo, but unfortunately no local studio was willing to record Neisseria,
  deeming them far too heavy for their sensibilities. Undeterred, the group forged
  ahead in death metal, growing even more crushing in tone. Neisseria gave an acclaimed
  performance at the rock festival "Guillotine for All" and several other local shows.
  In late 1993, the band succeeded in recording their first promo-demo "Internal Suffering"
  at a local studio, capturing their most brutal sound. Pushing forward in 1994, Neisseria
  recorded the "Fear" demo at the local Neatkariga Studija. In late 1994, Aleksei
  decided to join Imago and left Neisseria...


  "The Heaviest Band" (article from the Daugavpils press by D. Terin, photo by G.
  Sams):

  "American biologists have concluded that the primary inhabitants of our planet are
  bacteria; plants, animals, and even humans are merely their feeding ground. The
  members of the Daugavpils rock band ''Neisseria'' went even further in their reasoning.
  They consider man himself to be one enormous bacterium in which everything is mingled—good
  and evil alike. Hence the band''s name, borrowed from a medical manual on internal
  diseases.

  The band plays in the ''death'' style, which translates from English as death.

  Indeed, their music somewhat resembles the shrieks of victims buried alive. Judging
  by the audience''s reaction during their performances, this music is well liked.

  Through their concerts across Latvia and Lithuania, ''Neisseria'' has earned the
  reputation of being the heaviest band in Daugavpils.

  Now the guys are working on a program of completely new songs. The lyrical themes
  are as heavy as the songs themselves, with titles such as ''Eternally Sick Soul''
  or ''Heavy Dreams''.

  The band believes they will hold their ground for a long time, even though creative
  growth in our city is, in their opinion, very difficult. Following their triumphant
  success at the ''Guillotine for All'' festival, the band lost their rehearsal space
  at the theatre.

  Now the band must work under exceptionally grueling conditions. Perhaps that is
  why their music has become even heavier than before."


  Lineup:

  Viktor "Moryak" Prokofyev (vocals, bass guitar)

  Aleksei "Vantuz" Krasko (guitar)

  Igor "Egor" Belov (guitar)

  Igor Magarill (drums)'
description_lv: |-
  Grupas vēsture:
  Atgriezīsimies 90. gados. Viktors Prokofjevs un Jegors Belovs Floridas «death metal» skatuves ietekmē nolēma ieviest šādu mūziku savā pilsētā. Otrā ģitārista lomai viņiem izdevās atrast Alekseju Krasko (Vantuzu), pie bungām bija Vadims (Beast). Tā bija Neisseria nāves nesēju četrotne. Viņi bija pirmā death metal grupa pilsētā. Savā pirmajā koncertā Neisseria uzstājās kopā ar grupām «Dvinsk» un «Imago». 1992./1993. gadā par grupas bundzinieku kļuva Igors Magarils; ar viņa meistarību pie bungām Neisseria sāka skanēt vēl smagāk. Pēc veiksmīgas uzstāšanās Lietuvā jaunajā sastāvā grupa nolēma ierakstīt promo-demo, taču diemžēl neviena vietējā studija neuzņēmās ierakstīt Neisseria, jo grupa viņu ausīm bija pārāk smaga. Taču, par spīti tam, grupa turpināja savu daiļradi death metal stilā, un skanējums kļuva vēl smagāks. Neisseria ar panākumiem uzstājās rokfestivālā «Giljotīna visiem» un vēl vairākos vietējos koncertos. 1993. gada beigās grupai izdevās ierakstīt pirmo promo-demo «Internal Suffering» vietējā studijā. Šajā ierakstā bija visbrutālākais grupas skanējums. Neapstājoties pie sasniegtā, Neisseria virzījās uz priekšu un 1994. gadā nolēma ierakstīt jaunu demo «Fear» vietējā «Neatkarīgajā studijā». 1994. gada beigās Aleksejs nolēma kļūt par grupas «Imago» dalībnieku un aizgāja no Neisseria. Par spīti otrā ģitārista zaudējumam...

  Smagākā grupa (raksts no Daugavpils preses, D. Terins, foto G. Samss):
  Amerikāņu biologi secinājuši, ka mūsu planētas galvenie iemītnieki ir baktērijas. Augi, dzīvnieki un pat cilvēks – tā ir tikai viņu barības vide. Daugavpils rokgrupas «Neisseria» dalībnieki savos spriedumos gājuši vēl tālāk. Viņi uzskata, ka pats cilvēks ir viena liela baktērija, kurā viss sajaukts kopā – ļaunais un labais. No šejienes arī grupas nosaukums, kas aizgūts no iekšķīgo slimību rokasgrāmatas.
  Grupa spēlē «death» stilā, kas tulkojumā no angļu valodas nozīmē «nāve».
  Un patiešām, mūzika viņu izpildījumā nedaudz atgādina dzīvi aprakto cietēju vaimanas. Spriežot pēc publikas reakcijas viņu uzstāšanās laikā, šāda mūzika patīk.
  Ar savām uzstāšanās reizēm Latvijā un Lietuvā «Neisseria» izcīnīja sev Daugavpils smagākās grupas reputāciju.
  Patlaban puiši strādā pie programmas, kuras visas dziesmas ir pilnīgi jaunas. Liriskie teksti ir tikpat smagi cik pašas dziesmas. Ko vērti vien ir nosaukumi: «Mūžīgi slimā dvēsele» vai «Smagie sapņi».
  Puiši uzskata, ka viņiem vēl ilgi izdosies noturēt savas pozīcijas, lai gan mūsu pilsētā, pēc viņu domām, radošā attīstība ir ļoti apgrūtināta. Bet pēc triumfālajiem panākumiem rokfestivālā «Giljotīna visiem» grupa vispār zaudēja telpas mēģinājumiem teātrī.
  Tagad puišiem nākas strādāt neticami smagos apstākļos. Varbūt tāpēc viņu mūzika kļuvusi vēl smagāka nekā iepriekš.

  Sastāvs:
  Viktors «Morjaks» Prokofjevs (vokāls, basģitāra)
  Aleksejs «Vantuzs» Krasko (ģitāra)
  Igors «Jegors» Belovs (ģitāra)
  Igors Magarils (bungas)
