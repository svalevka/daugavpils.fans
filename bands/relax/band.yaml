description: Relax — даугавпилсский рок-проект, созданный музыкантами группы STOP
  (Алексей «Рэд» Федотов, Алексей Бородин, Андрей Гржибовский, Александр Комаров)
  после ее распада осенью 1998 года. Музыканты продолжили работу над более экспериментальным
  и атмосферным звучанием русского рока и альтернативы, выступая в местных клубах
  до 2000 года.
description_en: Relax was a Daugavpils rock project formed by members of STOP (Aleksei
  'Red' Fedotov, Aleksei Borodin, Andrei Grzhibovsky, and Aleksandr Komarov) following
  STOP's disbandment in autumn 1998. The band explored a more experimental, atmospheric
  branch of Russian rock and alternative music, performing in local venues until 2000.
description_lv: Relax bija Daugavpils roka projekts, kuru izveidoja grupas STOP dalibnieki
  (Aleksejs 'Red' Fedotovs, Aleksejs Borodins, Andrejs Grzibovskis un Aleksandrs Komarovs)
  pec STOP izjukšanas 1998. gada rudeni. Kolektivs speleja eksperimentalu un atmosferisku
  roku vietējos klubos lidz 2000. gadam.
