description: Mod Dudes — современная даугавпилсская панк-рок и альт-рок группа, образованная
  в 2023 году. Коллектив играет задорный и мелодичный панк-рок. Музыканты активно
  участвуют в культурной жизни Даугавпилса, регулярно выступая на Праздниках города
  (на сцене в сквере Андрея Пумпура), на открытии мотосезона «Run Number One» (Rock
  for Bikers), в Доме культуры Форштадта и на рок-фестивале Chemical Reaction. В 2025
  году коллектив выпустил альбом «Поплыла кукуха».
description_en: Mod Dudes is a contemporary Daugavpils punk rock and alternative rock
  band formed in 2023. The group plays energetic and melodic punk rock. They actively
  participate in Daugavpils musical life, performing at the annual City Festival (in
  Andrejs Pumpurs Square), motorcycle rallies such as 'Run Number One' (Rock for Bikers),
  the Forštadts House of Culture, and the Chemical Reaction rock festival. In 2025,
  they released their album 'Poplyla kukuha'.
description_lv: Mod Dudes ir mūsdienu Daugavpils pankroka un alternatīvā roka grupa,
  kas dibināta 2023. gadā. Grupa izpilda melodisku un enerģisku pankroku. Mūziķi aktīvi
  līdzdarbojas Daugavpils muzikālajā dzīvē, regulāri uzstājoties pilsētas svētkos
  (Andreja Pumpura skvērā), motosezonas atklāšanā «Run Number One» (Rock for Bikers),
  Forštates kultūras namā un rokkoncertos Chemical Reaction. 2025. gadā grupa laida
  klajā albumu «Poplyla kukuha».
