description: 'Даугавпилсская группа «Дети Гранта» была активна в конце 1990-х и начале
  2000-х годов. Музыкальный стиль сочетал рок, ска-панк, драйвовую духовую секцию
  и ироничные русско- и украиноязычные кавер-версии и оригинальные темы. Состав группы:
  Вантуз (вокал), Гоблин (гитара), Чувен (2-я гитара), Константин Дзедзел (бас), Стас
  (аккордеон, труба, скретч), Олег Самсонов (ударные).

  '
description_en: 'Daugavpils band Deti Granta (''Grant''s Children'') was active in
  the late 1990s and early 2000s, blending rock, ska-punk, horns, and energetic, satirical
  covers and originals. Lineup: Vantuz (vocals), Goblin (guitar), Chuven (2nd guitar),
  Konstantīns Dzedzelis (bass), Stas (accordion, trumpet, scratches), Oleg Samsonov
  (drums).

  '
