description: '10 композиций, найденных в веб-архиве (web.archive.org) личной страницы
  группы на сайте zanoza.lv - это единственное сохранившееся аудио группы. Сама страница
  не даёт никакой дополнительной информации ("из всей информации о группе у нас, к
  сожалению, есть только mp3"): ни дат, ни привязки к одному из двух известных альбомов
  группы, «Reduced to Zero» (1999) или «Control Is Lost» (2001). Год издания указан
  условно, по году распада группы (последний год, когда обе пластинки уже существовали)
  - фактическая дата записи каждой композиции неизвестна.'
description_en: '10 tracks recovered via the Wayback Machine (web.archive.org) from
  the band''s page on zanoza.lv - the only surviving audio for this band. The page
  itself gives no further information ("of everything we know about the band, unfortunately
  all we have is the mp3s"): no dates, and no way to tell which of the band''s two
  known albums, "Reduced to Zero" (1999) or "Control Is Lost" (2001), any given track
  belongs to. The publication year is a placeholder - the band''s dissolution year,
  by which both records already existed - not an actual known recording date for any
  individual track.'
