description: 'Даугавпилсская трэш- и хэви-метал группа CrossFire, активная на стыке
  1990-х и 2000-х годов.


  В 1999 году группа выпустила альбом «Reduced to Zero» в составе:

  Игорь Т. (вокал)

  Владимир Д. (гитара, бэк-вокал)

  Алвин М. (гитара)

  Алекс Б. (бас)

  Олег С. (ударные)


  В 2001 году вышел альбом «Control Is Lost» с обновленной ритм-секцией:

  Игорь Т. (вокал)

  Владимир Д. (гитара)

  Алвин М. (гитара)

  Дмитрий С. (бас)

  Валера К. (ударные)'
description_en: 'Daugavpils thrash and heavy metal band CrossFire, active around the
  turn of the millennium.


  In 1999, the band released the album "Reduced to Zero" with the lineup:

  Igor T. (vocals)

  Vladimir D. (guitar, backing vocals)

  Alvin M. (guitar)

  Alex B. (bass)

  Oleg S. (drums)


  In 2001, they followed with "Control Is Lost" featuring an updated rhythm section:

  Igor T. (vocals)

  Vladimir D. (guitar)

  Alvin M. (guitar)

  Dmitry S. (bass)

  Valera K. (drums)'
