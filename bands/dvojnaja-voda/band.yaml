description: 'Даугавпилсская рок-группа «Двойная Вода», образовавшаяся 1 октября 1998
  года на обломках панк-команды «Неврастения».


  От «Неврастении» остался основной костяк: Андрей «Сокол» Сокольников, Геннадий Русецкий
  и Александр «Шура» Таманс. Вскоре к группе присоединился гитарист Сергей, а при
  содействии поэта-песенника Евгения Орьянца вокалистом стал Эдуард Висаренко, очаровавший
  всех своим умением петь.


  В ноябре 1998 года коллектив дебютировал на фестивале «KRABIS-98». После выступления
  место Сергея занял старший брат Шуры — Андрис Таманс. 28 февраля 1999 года группа
  выступила на фестивале рок-кафе в ЦЛК Даугавпилса. Первой репетиционной базой группы
  была курилка ДК завода «Локомотив», затем ДК Железнодорожников и актовый зал профтехучилища.


  Летом 1999 года группа играла на базе отдыха железнодорожников «Вырыгна» и на фестивале
  «JUMP» в Ливанах вместе с группами GUARANA, INVASION и TRACE. Осенью 1999 года группа
  выступила на «Krabis 99».


  В сентябре 2000 года в Даугавпилсе состоялся концерт при поддержке фирмы Stalkers
  и партии Latgales Gaisma (с Carpe Diem, Crossfire, X-Press System, Spoon Feed).
  Там группа познакомилась с редактором рижской неформальной газеты «Черный Понедельник»
  Женей («Конь Екабштадтский»), который пригласил музыкантов на фестиваль «Postoronnim
  V» в рижский клуб «Саксофон» (30 сентября 2000 г.).


  В октябре 2000 года песня «Моя подруга» попала в ротацию и хит-парад даугавпилсского
  радио «Maximums», а следом зазвучали «Уходя» и «Пустота».


  В июле 2002 года на празднике Radio 1 в Екабпилсе в качестве соло-гитариста дебютировал
  Арманд Озолиньш, сменивший Сокола. В конце 2002 года песня «Двойная Вода» была издана
  на легендарном сборнике латвийского независимого рока «Odekolons 2002» (Tornis Rec),
  став единственной русскоязычной вещью на альбоме. В марте 2003 года вместо ушедшего
  бас-гитариста Геннадия Русецкого в группу пришел Юрий «Варик» Сивачев, с которым
  группа выступила на фестивале «Свобода» в Резекне и «Sinepes un Medus 2003» в Мадоне.


  Все студийные записи группы записывал и сводил известный даугавпилсский музыкант
  и продюсер Атис Аузанс.'
description_en: 'Daugavpils rock band "Dvojnaja Voda" (Double Water), formed on October
  1, 1998 from the remnants of the punk outfit "Nevrasteniya".


  The core of the former group remained: Andrey "Sokol" Sokolnikov, Gennady Rusetsky,
  and Aleksandr "Shura" Tamans. Guitarist Sergey briefly joined, and with the introduction
  by songwriter Evgeny Oryants, Eduard Visarenko joined on lead vocals, captivating
  the members with his vocal talent.


  In November 1998, the band debuted at the "KRABIS-98" festival. Following this performance,
  Shura''s older brother Andris Tamans took over rhythm guitar. On February 28, 1999,
  the group played at the Rock-Cafe festival in Daugavpils Ts.L.K. Rehearsal spaces
  moved from the Lokomotiv factory smoking room to the Railway Workers'' Culture House,
  and later to a vocational school assembly hall.


  In the summer of 1999, the band performed at the "Vyrygna" recreation base and the
  "JUMP" festival in Līvāni alongside GUARANA, INVASION, and TRACE. In autumn 1999
  they played at "Krabis 99".


  In September 2000, they opened a major concert in Daugavpils supported by Stalkers
  and Latgales Gaisma, playing alongside Carpe Diem, Crossfire, and X-Press System.
  There they met Zhenya ("Kon Ekabshtadtsky"), editor of the Riga independent paper
  "Chyorny Ponedelnik", who invited them to the "Postoronnim V" festival at Riga''s
  Saxophone club (September 30, 2000).


  In October 2000, "Moya Podruga" entered rotation and the chart of Daugavpils radio
  station "Maximums", followed by "Ukhodya" and "Pustota".


  In July 2002, Armand Ozoliņš made his live debut on lead guitar at the Radio 1 anniversary
  in Jēkabpils, succeeding Sokol. In late 2002, their song "Dvojnaja Voda" was included
  on the landmark compilation of Latvian independent rock "Odekolons 2002" (Tornis
  Rec), the only Russian-language track on the compilation. In March 2003, well-known
  bassist Yury "Varik" Sivachev replaced Gennady Rusetsky, with the band subsequently
  performing at the "Svoboda" festival in Rēzekne and "Sinepes un Medus 2003" in Madona.


  All studio recordings of the group were engineered and mixed by prominent Daugavpils
  producer and musician Atis Auzāns.'
