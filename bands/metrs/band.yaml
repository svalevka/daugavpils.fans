description: Metrs — одна из старейших и наиболее уважаемых альтернативных рок-групп
  Даугавпилса. Образована в 1993 году студентами Даугавпилсского педагогического университета
  (ДПУ / ДУ). В составе играл барабанщик Андрей Зелч (также участник группы Carpe
  Diem) и бас-гитарист Эдмунд Таманис. На протяжении более четверти века группа активно
  выступала на фестивалях по всей Латвии, выпустив альбомы «Pirmais albums» (1998),
  «Labākā diena» (2014) и «Ēnas» (2018).
description_en: Metrs is one of Daugavpils' longest-standing and most respected alternative
  rock bands, formed in 1993 by students at Daugavpils Pedagogical University (DPU
  / DU). The lineup featured drummer Andrejs Zelcs (also drummer of Carpe Diem) and
  bassist Edmunds Tamanis. Spanning over 25 years of activity on Latvian festival
  and club circuits, the band released 'Pirmais albums' (1998), 'Labākā diena' (2014),
  and 'Ēnas' (2018).
description_lv: Metrs ir viena no ilgvetigakajam un iecienitakajam Daugavpils alternativā
  roka grupam, dibinata 1993. gada Daugavpils Pedagogiskas universitates (DPU / DU)
  studentu vide. Sastava speleja bungieris Andrejs Zelcs (ari Carpe Diem bungieris)
  un basists Edmunds Tamanis. Grupa aktivi koncertēja vairak neka ceturtdalgadsimtu,
  izdeva albumus 'Pirmais albums' (1998), 'Labaka diena' (2014) un 'Enas' (2018).
