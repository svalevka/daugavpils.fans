description: 'Группа Carpe Diem основана в 1996 году. После распада группы Quasimodo,
  бывшие участники этой группы Кузя и Варик, после длительных уговоров между собой,
  решили организовать группу. На ритм секцию пригласили (тоже бывшего ударника Quasimodo)
  Андрея Зелча. В поисках помещения, которое в то время найти было практически невозможно,
  решили репетировать у Кузи дома, т.к. в квартире находилась домашняя студия, где
  позже и был записан этот альбом. Музыканты пытались играть в направлении фанк, но
  в последствии получилась музыка в стиле ритм’н’блюз. Первое выступление группы состоялось
  на концерте в Башне Деда. Длительными усилиями группы был записан первый альбом,
  который изначально был назван двумя названиями (т.к. имели место русские и английские
  тексты): «Беспредел» и «Who’s Standing Above You?». Но в конечном результате было
  оставлено название «Беспредел». Хочется заметить, что тексты песен были написаны
  разными авторами, которые содействовали в создании этого альбома (их имена написаны
  на оформлении).


  В рок-клубе Soundtrack, при создании коего принимали участие музыканты этой группы
  (начиная с ремонта помещения, заканчивая музыкальным оформлением), произошел второй
  концерт группы. Дальнейшие репетиции происходили в помещении рок-клуба. Через некоторое
  время басист группы Варик, которому не нравилось чрезмерное употребление алкоголя
  лидером группы Кузи, решил покинуть группу. Но на этом не заканчивается творческий
  путь Carpe Diem.


  В 2000 году группа записала альбом «Ты Сдох» в составе: Кузя (вокал, гитара), Паша
  Петров (бас), Андрей Зелч (ударные).'
description_en: 'Carpe Diem was founded in 1996. Following the breakup of Quasimodo,
  former members Kuzya and Varik, after much persuasion between themselves, decided
  to form a new band. For the rhythm section they recruited fellow ex-Quasimodo drummer
  Andrei Zelch. Searching for rehearsal space—nearly impossible to find at that time—they
  decided to rehearse at Kuzya''s apartment, where a home studio was set up, and where
  this album was later recorded. The musicians attempted to play funk, but ultimately
  the music emerged as rhythm and blues. The group''s debut performance took place
  at the "Bashnya Deda" concert. Through prolonged effort, the band recorded their
  first album, originally given two working titles (reflecting songs in both Russian
  and English): "Bespredel" and "Who''s Standing Above You?". Ultimately "Bespredel"
  (Chaos / Outrage) was chosen. The song lyrics were written by various contributing
  authors whose names were credited on the sleeve.


  At the "Soundtrack" rock club—in whose creation the band members actively participated,
  from renovating the premises to sound engineering—the band held their second concert.
  Subsequent rehearsals moved into the club. Sometime later, bassist Varik, frustrated
  with frontman Kuzya''s excessive drinking, decided to leave the group. But Carpe
  Diem''s creative path did not end there.


  In 2000, the band recorded their second album "Ty Sdokh" (You Croaked) with the
  lineup: Kuzya (vocals, guitar), Pasha Petrov (bass), and Andrei Zelch (drums).'
