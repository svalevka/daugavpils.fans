  Состав:

  Славка Александров — голос

  Валера Клещ — гитара

  Алвин Матисанс — гитара

  Дима Спиваков — бас-гитара, тексты

  Лёша Логинов — барабаны'
description_en: 'Recorded in 2004 in the rehearsal room of the Palace of Culture of
  Chemists (DKKH), Daugavpils. Recorded by Alexey "Vantuz" Krasko (ZaZaZa Records)
  onto a stereo VHS tape.


  Lineup:

  Slavka Aleksandrov — vocals

  Valera Kleshch — guitar

  Alvin Matisans — guitar

  Dima Spivakov — bass guitar, lyrics

  Lesha Loginov — drums'
