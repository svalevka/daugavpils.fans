description: |-
  Больше 20 лет назад, была в Даугавпилсе группа Mikazza.

  Собрались и распустились в течении 2004 года. Успели сыграть 4 концерта.
  Барабаны - Лёша Логинов
  Гитара - Валера Клещ
  Гитара - Алвин Матисанс
  Бас и тексты - Дима Спиваков
  Голос - Славка Александров

  Записывал Лёша «Вантуз» Красько, под знаменем ZaZaZa Records, на стерео VHS кассету.

  Сделано в каморке Дома Культуры Химиков, Даугавпилс, Латвия.
description_en: |-
  More than 20 years ago, there was a band in Daugavpils named Mikazza.

  Formed and disbanded during 2004. Managed to play 4 concerts.
  Drums - Lesha Loginov
  Guitar - Valera Kleshch
  Guitar - Alvin Matisans
  Bass and lyrics - Dima Spivakov
  Vocals - Slavka Aleksandrov

  Recorded by Lesha "Vantuz" Krasko under the banner of ZaZaZa Records onto a stereo VHS tape.

  Made in the rehearsal room of the Palace of Culture of Chemists (DKKH), Daugavpils, Latvia.
