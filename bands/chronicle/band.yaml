description: «Хроника» (Chronicle) — даугавпилсская хэви-метал группа первой половины
  2010-х годов. Регулярные участники фестиваля молодежной рок-музыки Chemical Reaction
  в ДК «Vārpa» и кинотеатре «Renesanse».
description_en: Chronicle was a Daugavpils heavy metal group active in the early-to-mid
  2010s, regularly appearing on stage at the Chemical Reaction rock festival at the
  Vārpa Culture Centre and Renesanse.
description_lv: Hronika (Chronicle) bija Daugavpils heavy metal grupa 2010. gadu pirmaja
  puse. Regulari uzstajas jaunatnes rokfestivālā Chemical Reaction kulturas centra
  'Varpa' un kinoteātri 'Renesanse'.
