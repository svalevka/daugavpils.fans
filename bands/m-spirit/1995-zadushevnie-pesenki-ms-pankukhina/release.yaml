description_en: 'Originally self-released on cassette in 1995, Daugavpils. Digitized
  to MP3 (320 kbps CBR). Track 02 is missing from this digitization and its original
  title is unknown; it is omitted here rather than invented. A few tracks carried
  a different title in the original digitized filenames than in their embedded ID3
  tags (recorded here as alternateName) - most notably track 14, whose original filename
  used uncensored language ("Хочетсй сказать Блять!") where the ID3 tag was softened
  to "Хочется сказать".

  '
