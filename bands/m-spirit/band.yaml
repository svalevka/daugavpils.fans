description: 'Биография

  Группа основанна в 1994 году , вероятнее всего ранней весной.

  Вайда ( Владислав Петкун) с Валерой (Сергей Валевка) познакомились в спецклассе
  созданном в одной из Даугавпилских школ . В этот класс собирали школьников желающих
  поступить в Рижский Авиационный Университет, при этом вместо двух лет проучиться
  год вместо двух. Вместе с ботанами отличниками туда попали и будущие участники группы
  которым показалась привлекательной возможность побыстрее слинять от школы.

  После поступления в РАУ на разные факультеты они поселились в соседних общежитиях.
  Вайда захаживал в Валерино общежитие со своей гитарой повидать других бывших одноклассников
  , попить водки и поорать песни. Вайда уже до университета плотнo интересовался рок
  музыкой, носил хаер и хорошо Валера в плане неформального движения тогда отставал
  от Вайды и самой эстремальной группой в его коллекции была Roxette.

  Как-то раз Вайда сказал Валере, что у него в Даугавпилсе на Погулянке ( лесной район
  Даугавпилса,) есть знакомый Юра, у которого имеется кой какой инструмент на чердаке
  его частного дома и они пару раз сыграли с Юрой на пару - Вайда на гитаре и Юра
  на барабанах .Вайда предложил попробовать поиграть всем троим взяв название Метал
  Спирит, на том и порешили. Так как Вайда и Валера жили и учились в Риге, репетировать
  решили по выходным в Даугавпилсе.

  Так и родилась первая панк группа в Даугавпилсе. В то время в Даугавпилсе в плане
  альтернативной музыки было очень не густо. Все ограничивалось хард рок группой Двинск
  которя практически монополизировала рок сцену города и парой малоизвестных групп
  играющих пристойную вполне рок музыку.

  На бас Вайда пригласил своего соседа по району Рейгана (Дмитрий Рагиневич) и они
  начали репетировать на чердаке Юриного дома.Рейган был пацаном пролетарских слоев
  и в университетах не учился и вообще скоро должен был идти в армию. Юра был худой
  и маленький , похожий на цыгана, но у него не переводились бабы.Поэтому начинающим
  музыкантам проходилось часто сидеть на морозе, пока Юра удовлетворял своих подружек
  на чердаке.Песни писал Вайда, Валера тоже написал пару песен , но потом выдохся
  и перешел на вокал.

  Недалеко от Юриного дома в большом загородном доме жил другой пацан по прозвищу
  "Подосланный" ( Дима Хайруллин), один раз он зашел в гости к Юре и застав Метал
  Спирит на репетиции загорелся желанием присоединиться. В конце концов Диму переименовали
  во Джека ( как барабанную тарелку), перебрались к нему в гараж на первом этаже его
  дома, и избавились от Юры с его алкоголизмом и бабами которые явно были Юре более
  интересны чем намечающаяся музыкальная карьера.

  Интересно что отец у Джека был известных во олдскулных кругах музыкант . Брат Джека
  тоже был профессиональным музыкантом жившим в Польше. Отец Джека. живший отдельно,
  помог купить усилитель и динамики.Мама Джека благосклонно отнеслась к тому, что
  в гараже начались вопли молодых музыкантов.

  Начались долгие репетиции - Вайда сочинял песни, Джек стучал на барабанах, Рейган
  играл на басу и Валера пел( если это так можно назвать). Фактически Вайда был музыкальным
  локомотивом и лицом группы, придумывал тексты и музыку и вел репетиции.

  Основное влияние в то время были группы Exploited и Секс Пистолз, хотя экспериментировали
  с чем угодно, от ОЙ до спид метала.Валера и Вайда учились в Риге и на выходные приехали
  в Даугавпилс на репетиции.Скоро Метал Спирит переименовали в М.Спирит , что звучали
  не так как будто группа играет метал.

  Вайда учился в РАУ на мехфаке в одной группе с Мареком и Ромой Сапелкиным из рижской
  группы Рыба Мечь Сволочь Обыкновенная. Это здорово помогло продвижению М.Спирит
  в Риге.Первый концерт группы состоялся в зале РАУ и назывался "Ползи, черепашка".
  Вместе с М.Спирит там играли Рыба Меч Сволочь и еще пару команд.

  Вскоре появилась возможность сыграть и в родном городе. Первый концерт в Даугавпилсе
  в зале Железнодорожного техникума был серьезным испытанием - никому неизвестная
  команда играющая музыку которую В Даугавпилсе до этого не играл никто.Никаких ирокезов
  конечно не было, за это в Даугавпилсе наших героев просто бы побили какие-нибудь
  гопники после концерта, но результат был достигнут.К счастью, все прошло на 5 баллов
  и контакты со местной неформальной тусовкой были начаты. Даже Кузя из группы Двинск
  ( фактически главная группа на концерте) познакомился с Вайдой. В какой то момент
  вместо Джека играл парень по имени Влад. который к сожалению умер от лейкемии и
  даугавпилсская тусовка даже организовала концерт в его память.

  Летом 1995 года набралось достаточно материала для альбома , но Рейгана забрали
  в армию и на время записи заменили Слеером,худым веселым взбалмошным юношей который
  взялся неизвестно откуда. Слеер получил свою кличка за любовь к Death металу. Записали
  альбом ""Задушевные песенки М.С. Панкухина"" ( М.С Панкухин- отсылка к аббревиатуре
  М.Спирит, как вы можете догадаться) .На обложке первого альбома нет Рейгана но на
  стене можно увидеть надпись "Рейган в Армии." Стена использовавшаяся для обложки
  была на территории бывшего завода в Погулянке и ее разрисовали сами музыканты ,
  используя как бэкграунд для обложки кассеты.Записывали дома у Кузи,, лидера группы
  Двинск и одного из основателя Даугавпилсского рок движения. Кузя был обладателем
  всевозможных прибамбасов типа усилителей, магнитофонов, миксеров и прочих полезных
  штук а так же имел большой музыкальный опыт.Последовали несколько концертов в Дпилсе.

  Через знакомых в общежитии Вайда познакомился с Валмиерским Конем ,музыкантом с
  ирокезом, яростным панком , который впоследствии стал одним из самых известных музыкантов
  в альтернативной среде Валмиеры..Конь жил на сьемной квартире в Пурвициемсе, учился
  в техникуме а на выходных репетировал дома в Валмиере в группе Нелюди которую он
  сам организовал.Вайда и Конь стали крепкими друзьями и скоро М.Спирит участвовали
  в концерте в Валмиере, а потом в Валке.Это был очень необычный марш бросок панк
  музыкантов из малоизвестного русского Даугавпилса в глубины латышский районов.Во
  время Валмиерских, а потом и Рижских концертов на басы все время находились какие
  нибудь друзья и знакомые - Рейган был в армии и его никем не хотели замещать.

  Музыкальные интересы стали тоже меняться в сторону инди и гранжа, и сильное влияние
  на поздние песни Вайды в М.Спирите повлияли Pixies.

  Группа продолжала репетировать и давать концерты в Риге и Даугавпилсе, но становилось
  трудно собирать всех вместе, так как Джек учился в медицинском училище на другом
  конце Риги, Рейган служил в армии да и Валера с Джеком приезжали не каждые выходные.
  Фактически группа вскоре распалась но все трое так и продолжали тусить вместе в
  Риге в неформальных кругах.

  Позже Вайда присоединился к довольно известной даугавпилсской группе "Глазки стекольщика"
  в которой собрались хорошо играющие музыканты ( в отличие от героев нашего рассказа)
  и стал очень популярен и любим в неформальных кругах Даугавпилса.К сожалению в феврале
  1999 года он трагически умер в Валериной комнате в общежитии РАУ за несколько дней
  до получения университетского диплома. Это было огромным шоком для всех друзей и
  музыкальной тусовки Даугавпилса, Валмиеры и Риги.В Даугавпилсе провели концерт с
  участием местных групп в его память.

  Джек уехал в Белоруссию ,выучился на врача и стал преподавать в университете.Валера
  уехал в Великобританию. Рейган переехал в Москву . Все трое не общаются с тех пор.

  '
