description: >
  Formed in Daugavpils in 1994 as "Metal Spirit" (shortened to "M. Spirit"
  to avoid sounding exclusively metal-focused), when Vladislav Petkun (Vaida)
  and Sergey Valevka (Valera) met in a specialized high-school class and
  later reconnected at Riga Aviation University. Early influences included
  The Exploited and Sex Pistols, later shifting toward indie and grunge,
  particularly Pixies. Played mostly around Daugavpils, with some
  performances in Riga and Valmiera. The band effectively dissolved in the
  mid-1990s due to scheduling difficulties, though members stayed in touch.
  Vladislav Petkun (Vaida) died in February 1999, shortly before graduating
  university.
