description: 'Биография


  Группа основанна в 1994 году, вероятнее всего ранней весной.

  Вайда (Владислав Петкун) с Валерой (Сергей Валевка) познакомились в спецклассе созданном
  в одной из Даугавпилских школ. В этот класс собирали школьников, желающих поступить
  в Рижский Авиационный Университет, при этом вместо двух лет проучиться год вместо
  двух. Вместе с ботанами отличниками туда попали и будущие участники группы которым
  показалась привлекательной возможность побыстрее слинять от школы.

  После поступления в РАУ на разные факультеты они поселились в соседних общежитиях.
  Вайда захаживал в Валерино общежитие со своей гитарой повидать других бывших одноклассников
  , попить водки и поорать песни. Вайда уже до университета плотнo интересовался рок
  музыкой, носил хаер и хорошо Валера в плане неформального движения тогда отставал
  от Вайды и самой эстремальной группой в его коллекции была Roxette.

  Как-то раз Вайда сказал Валере, что у него в Даугавпилсе на Погулянке ( лесной район
  Даугавпилса,) есть знакомый Юра, у которого имеется кой какой инструмент на чердаке
  его частного дома и они пару раз сыграли с Юрой на пару - Вайда на гитаре и Юра
  на барабанах .Вайда предложил попробовать поиграть всем троим взяв название Метал
  Спирит, на том и порешили. Так как Вайда и Валера жили и учились в Риге, репетировать
  решили по выходным в Даугавпилсе.

  Так и родилась первая панк группа в Даугавпилсе. В то время в Даугавпилсе в плане
  альтернативной музыки было очень не густо. Все ограничивалось хард рок группой Двинск
  которя практически монополизировала рок сцену города и парой малоизвестных групп
  играющих пристойную вполне рок музыку.

  На бас Вайда пригласил своего соседа по району Рейгана (Дмитрий Рагиневич) и они
  начали репетировать на чердаке Юриного дома.Рейган был пацаном пролетарских слоев
  и в университетах не учился и вообще скоро должен был идти в армию. Юра был худой
  и маленький , похожий на цыгана, но у него не переводились бабы.Поэтому начинающим
  музыкантам проходилось часто сидеть на морозе, пока Юра удовлетворял своих подружек
  на чердаке.Песни писал Вайда, Валера тоже написал пару песен , но потом выдохся
  и перешел на вокал.

  Недалеко от Юриного дома в большом загородном доме жил другой пацан по прозвищу
  "Подосланный" ( Дима Хайруллин), один раз он зашел в гости к Юре и застав Метал
  Спирит на репетиции загорелся желанием присоединиться. В конце концов Диму переименовали
  во Джека ( как барабанную тарелку), перебрались к нему в гараж на первом этаже его
  дома, и избавились от Юры с его алкоголизмом и бабами которые явно были Юре более
  интересны чем намечающаяся музыкальная карьера.

  Интересно что отец у Джека был известных во олдскулных кругах музыкант . Брат Джека
  тоже был профессиональным музыкантом жившим в Польше. Отец Джека. живший отдельно,
  помог купить усилитель и динамики.Мама Джека благосклонно отнеслась к тому, что
  в гараже начались вопли молодых музыкантов.

  Начались долгие репетиции - Вайда сочинял песни, Джек стучал на барабанах, Рейган
  играл на басу и Валера пел( если это так можно назвать). Фактически Вайда был музыкальным
  локомотивом и лицом группы, придумывал тексты и музыку и вел репетиции.

  Основное влияние в то время были группы Exploited и Секс Пистолз, хотя экспериментировали
  с чем угодно, от ОЙ до спид метала.Валера и Вайда учились в Риге и на выходные приехали
  в Даугавпилс на репетиции.Скоро Метал Спирит переименовали в М.Спирит , что звучали
  не так как будто группа играет метал.

  Вайда учился в РАУ на мехфаке в одной группе с Мареком и Ромой Сапелкиным из рижской
  группы Рыба Мечь Сволочь Обыкновенная. Это здорово помогло продвижению М.Спирит
  в Риге.Первый концерт группы состоялся в зале РАУ и назывался "Ползи, черепашка".
  Вместе с М.Спирит там играли Рыба Меч Сволочь и еще пару команд.

  Вскоре появилась возможность сыграть и в родном городе. Первый концерт в Даугавпилсе
  в зале Железнодорожного техникума был серьезным испытанием - никому неизвестная
  команда играющая музыку которую В Даугавпилсе до этого не играл никто.Никаких ирокезов
  конечно не было, за это в Даугавпилсе наших героев просто бы побили какие-нибудь
  гопники после концерта, но результат был достигнут.К счастью, все прошло на 5 баллов
  и контакты со местной неформальной тусовкой были начаты. Даже Кузя из группы Двинск
  ( фактически главная группа на концерте) познакомился с Вайдой. В какой то момент
  вместо Джека играл парень по имени Влад. который к сожалению умер от лейкемии и
  даугавпилсская тусовка даже организовала концерт в его память.

  Летом 1995 года набралось достаточно материала для альбома , но Рейгана забрали
  в армию и на время записи заменили Слеером,худым веселым взбалмошным юношей который
  взялся неизвестно откуда. Слеер получил свою кличка за любовь к Death металу. Записали
  альбом ""Задушевные песенки М.С. Панкухина"" ( М.С Панкухин- отсылка к аббревиатуре
  М.Спирит, как вы можете догадаться) .На обложке первого альбома нет Рейгана но на
  стене можно увидеть надпись "Рейган в Армии." Стена использовавшаяся для обложки
  была на территории бывшего завода в Погулянке и ее разрисовали сами музыканты ,
  используя как бэкграунд для обложки кассеты.Записывали дома у Кузи,, лидера группы
  Двинск и одного из основателя Даугавпилсского рок движения. Кузя был обладателем
  всевозможных прибамбасов типа усилителей, магнитофонов, миксеров и прочих полезных
  штук а так же имел большой музыкальный опыт.Последовали несколько концертов в Дпилсе.

  Через знакомых в общежитии Вайда познакомился с Валмиерским Конем ,музыкантом с
  ирокезом, яростным панком , который впоследствии стал одним из самых известных музыкантов
  в альтернативной среде Валмиеры..Конь жил на сьемной квартире в Пурвициемсе, учился
  в техникуме а на выходных репетировал дома в Валмиере в группе Нелюди которую он
  сам организовал.Вайда и Конь стали крепкими друзьями и скоро М.Спирит участвовали
  в концерте в Валмиере, а потом в Валке.Это был очень необычный марш бросок панк
  музыкантов из малоизвестного русского Даугавпилса в глубины латышский районов.Во
  время Валмиерских, а потом и Рижских концертов на басы все время находились какие
  нибудь друзья и знакомые - Рейган был в армии и его никем не хотели замещать.

  Музыкальные интересы стали тоже меняться в сторону инди и гранжа, и сильное влияние
  на поздние песни Вайды в М.Спирите повлияли Pixies.

  Группа продолжала репетировать и давать концерты в Риге и Даугавпилсе, но становилось
  трудно собирать всех вместе, так как Джек учился в медицинском училище на другом
  конце Риги, Рейган служил в армии да и Валера с Джеком приезжали не каждые выходные.
  Фактически группа вскоре распалась но все трое так и продолжали тусить вместе в
  Риге в неформальных кругах.

  Позже Вайда присоединился к довольно известной даугавпилсской группе "Глазки стекольщика"
  в которой собрались хорошо играющие музыканты ( в отличие от героев нашего рассказа)
  и стал очень популярен и любим в неформальных кругах Даугавпилса.К сожалению в феврале
  1999 года он трагически умер в Валериной комнате в общежитии РАУ за несколько дней
  до получения университетского диплома. Это было огромным шоком для всех друзей и
  музыкальной тусовки Даугавпилса, Валмиеры и Риги.В Даугавпилсе провели концерт с
  участием местных групп в его память.

  Джек уехал в Белоруссию ,выучился на врача и стал преподавать в университете.Валера
  уехал в Великобританию. Рейган переехал в Москву . Все трое не общаются с тех пор.

  '
description_en: |-
  Biography

  The band was formed in 1994, most likely in early spring.

  Vaida (Vladislav Petkun) and Valera (Sergey Valevka) met in a specialized class created in one of the Daugavpils secondary schools. The class brought together students aspiring to enter the Riga Aviation University (RAU), offering the chance to complete two years of curriculum in just one. Alongside top students, the future band members also landed there, drawn by the prospect of ditching school as quickly as possible.

  After entering RAU in different departments, they moved into neighboring dormitories. Vaida would drop by Valera's room with his guitar to catch up with other former classmates, drink vodka, and shout songs. Even before university, Vaida was already deeply immersed in rock music, had long hair, and was well versed in it. Valera lagged behind Vaida when it came to the underground counterculture, and the most extreme group in his collection was Roxette.

  One day Vaida told Valera that back in Daugavpils in Pogulyanka (a forested neighborhood of Daugavpils), he had an acquaintance named Yura who had some musical gear in the attic of his private house, and that he and Yura had jammed together a couple of times – Vaida on guitar and Yura on drums. Vaida suggested that the three of them try playing together under the name Metal Spirit, and so it was agreed. Since Vaida and Valera lived and studied in Riga, rehearsals were set for weekends in Daugavpils.

  And thus the first punk band in Daugavpils was born. At that time, Daugavpils had very little going on in terms of alternative music. Everything was confined to the hard rock band Dvinsk, which virtually monopolized the city's rock scene, and a couple of lesser-known bands playing fairly decent rock.

  For bass, Vaida brought in his neighborhood friend Reagan (Dmitry Raginevich), and they began rehearsing in the attic of Yura's house. Reagan was a working-class lad who didn't attend university and was due to be drafted into the army soon anyway. Yura was thin and short, resembling a gypsy, but never lacked female company. As a result, the novice musicians often had to wait outside in the freezing cold while Yura entertained his girlfriends in the attic. Vaida wrote the songs; Valera also wrote a couple, but soon ran out of steam and switched strictly to vocals.

  Not far from Yura's house, in a large suburban house, lived another lad nicknamed 'Podoslanny' ('The Infiltrator', Dima Khairulin). One day he stopped by Yura's place, caught Metal Spirit mid-rehearsal, and burned with the desire to join. Eventually, Dima was rechristened Jack (like the drum cymbal), the band relocated to the garage on the first floor of his house, and they parted ways with Yura, whose alcoholism and ladies were clearly of greater interest to him than an emerging musical career.

  Interestingly, Jack's father was a well-known old-school musician. Jack's brother was also a professional musician living in Poland. Jack's father, who lived separately, helped buy an amplifier and speakers. Jack's mother took kindly to the young musicians shouting in the garage.

  Long rehearsals began: Vaida composed the songs, Jack beat the drums, Reagan played bass, and Valera sang (if one could call it that). In truth, Vaida was the musical powerhouse and the face of the band, writing the lyrics and music and running the rehearsals.

  The main influences at the time were The Exploited and the Sex Pistols, though they experimented with everything from Oi! to speed metal. Valera and Vaida studied in Riga and returned to Daugavpils on weekends for rehearsals. Soon Metal Spirit was renamed M. Spirit, so they wouldn't sound like a purely metal band.

  Vaida studied mechanical engineering at RAU in the same cohort as Marek and Roma Sapelkin from the Riga band Ryba Mech Svoloch Obyknovennaya. This proved hugely helpful in getting M. Spirit booked in Riga. The band's debut concert took place in the RAU auditorium under the title 'Crawl, Turtle'. Alongside M. Spirit, Ryba Mech Svoloch and a couple of other outfits played that night.

  Soon an opportunity arose to play in their hometown. The first concert in Daugavpils, in the auditorium of the Railway Technical College, was a real test: an unknown band playing music that nobody in Daugavpils had ever played before. There were no mohawks, of course—for that in Daugavpils our heroes would simply have been beaten up by local thugs after the show—but the mission was accomplished. Fortunately, everything went swimmingly, and connections with the local underground scene were established. Even Kuzya from Dvinsk (effectively the headlining band at the gig) introduced himself to Vaida. At one point, a guy named Vlad played drums instead of Jack; tragically, Vlad later died of leukemia, and the Daugavpils scene even organized a memorial concert in his honor.

  By the summer of 1995, enough material had accumulated for an album, but Reagan was drafted into the army and replaced for the recording by Slayer, a skinny, lively, eccentric young man who appeared out of nowhere. Slayer earned his moniker from his passion for death metal. They recorded the album 'Zadushevnye pesenki M.S. Pankukhina' ('Heartfelt Songs of M.S. Pankukhin'—M.S. Pankukhin being a play on M. Spirit, as you might guess). Reagan is not on the first album cover, but on the wall one can see the inscription 'Reagan is in the Army'. The wall featured on the cover was located on the grounds of an abandoned factory in Pogulyanka; the musicians spray-painted it themselves, using it as the backdrop for the cassette inlay. The recording was done at the home of Kuzya, leader of Dvinsk and one of the founding fathers of the Daugavpils rock movement. Kuzya possessed all manner of gadgets like amps, tape decks, mixers, and other gear, along with extensive musical experience. Several concerts in D-pils followed.

  Through dorm acquaintances, Vaida met Valmieras Konj (the Valmiera Horse), a mohawked musician and fierce punk who later became one of the most prominent musicians in Valmiera's alternative music circles. Konj lived in a rented flat in Purvciems, studied at a technical college, and rehearsed on weekends back home in Valmiera with the band Neludi, which he had founded. Vaida and Konj became close friends, and soon M. Spirit played a concert in Valmiera, followed by another in Valka. It was a very unusual foray by punk musicians from Russian-speaking Daugavpils into the heart of Latvian-speaking regions. During the Valmiera and subsequent Riga gigs, various friends filled in on bass—Reagan was in the army, and they didn't want to replace him permanently.

  Musical tastes also began shifting toward indie and grunge, with the Pixies exerting a heavy influence on Vaida's later M. Spirit songs.

  The band continued rehearsing and gigging in Riga and Daugavpils, but gathering everyone became increasingly difficult: Jack was studying at a medical school on the other side of Riga, Reagan was serving in the army, and Valera and Jack couldn't make it every weekend. Effectively, the band disbanded shortly afterward, though all three continued hanging out together in Riga's countercultural circles.

  Later, Vaida joined the well-known Daugavpils band Glazki Stekolshchika, which brought together accomplished musicians (unlike the heroes of our tale), and he became immensely popular and beloved in Daugavpils underground circles. Tragically, in February 1999 he died in Valera's room at the RAU dormitory just days before receiving his university diploma. It was a profound shock to all friends and the music scenes of Daugavpils, Valmiera, and Riga. A memorial concert featuring local bands was held in Daugavpils in his honor.

  Jack left for Belarus, graduated as a doctor, and became a university lecturer. Valera moved to the United Kingdom. Reagan relocated to Moscow. The three have not been in touch since.
description_lv: |-
  Biogrāfija

  Grupa dibināta 1994. gadā, visticamāk, agrā pavasarī.

  Vaida (Vladislavs Petkuns) un Valera (Sergejs Vaļevka) iepazinās speciālajā klasē, kas bija izveidota vienā no Daugavpils skolām. Šajā klasē pulcēja skolēnus, kuri vēlējās iestāties Rīgas Aviācijas universitātē (RAU), pie tam divu gadu vietā nomācoties tikai vienu. Līdzās teicamniekiem «zubrīšiem» tur iekļuva arī topošie grupas dalībnieki, kuriem šķita pievilcīga iespēja ātrāk notīties no skolas.

  Pēc iestāšanās RAU dažādās fakultātēs viņi apmetās kaimiņu kopmītnēs. Vaida nāca uz Valeras kopmītni ar savu ģitāru, lai satiktu citus bijušos klasesbiedrus, iedzertu degvīnu un pabļautu dziesmas. Vaida jau pirms universitātes nopietni interesējās par rokmūziku, nēsāja garus matus un labi pārzināja lietu. Valera neformālās kustības ziņā toreiz no Vaidas atpalika, un pati ekstrēmākā grupa viņa kolekcijā bija Roxette.

  Reiz Vaida pastāstīja Valeram, ka viņam Daugavpilī, Poguļankā (Daugavpils meža rajonā), ir paziņa Jura, kuram privātmājas bēniņos stāv šādi tādi instrumenti, un viņi ar Juru pāris reizes bija uzspēlējuši divatā – Vaida uz ģitāras un Jura pie bungām. Vaida piedāvāja pamēģināt uzspēlēt trijatā, pieņemot nosaukumu «Metal Spirit» («Metāla gars»), un tā arī nosprieda. Tā kā Vaida un Valera dzīvoja un mācījās Rīgā, mēģināt nolēma brīvdienās Daugavpilī.

  Tā arī piedzima pirmā pankgrupa Daugavpilī. Tajā laikā Daugavpilī alternatīvās mūzikas ziņā bija pavisam trūcīgi. Viss aprobežojās ar smagā roka grupu «Dvinsk», kura praktiski bija monopolizējusi pilsētas rokskatuvi, un pāris mazpazīstamām grupām, kas spēlēja diezgan pieklājīgu rokmūziku.

  Uz basu Vaida uzaicināja savu rajona kaimiņu Reiganu (Dmitriju Ragineviču), un viņi sāka mēģināt Juras mājas bēniņos. Reigans bija puisis no proletāriešu aprindām, universitātēs nemācījās un vispār drīz taisījās iet armijā. Jura bija kalsns un maza auguma, līdzīgs čigānam, bet meiteņu viņam nekad netrūka. Tāpēc jaunajiem mūziķiem bieži nācās sēdēt salā, kamēr Jura bēniņos izklaidēja savas draudzenes. Dziesmas rakstīja Vaida, Valera arī uzrakstīja pāris dziesmu, bet tad izsīka un pārgāja uz vokālu.

  Netālu no Juras mājas lielā piepilsētas mājā dzīvoja cits puisis ar iesauku «Podoslannij» («Piesūtītais» – Dima Hairuļļins). Reiz viņš iegriezās ciemos pie Juras un, pieķēris «Metal Spirit» mēģinājumā, iedegās vēlmē pievienoties. Galu galā Dimu pārdēvēja par Džeku (kā bungu šķīvi), pārcēlās uz viņa garāžu mājas pirmajā stāvā un atbrīvojās no Juras ar viņa alkoholismu un sievietēm, kas Juram acīmredzami bija interesantākas par topošo muzikālo karjeru.

  Interesanti, ka Džeka tēvs bija veco laiku aprindās pazīstams mūziķis. Arī Džeka brālis bija profesionāls mūziķis, kurš dzīvoja Polijā. Džeka tēvs, kurš dzīvoja atsevišķi, palīdzēja nopirkt pastiprinātāju un tumbas. Džeka mamma labvēlīgi izturējās pret to, ka garāžā sākās jauno mūziķu brēkšana.

  Sākās gari mēģinājumi – Vaida sacerēja dziesmas, Džeks rībināja bungas, Reigans spēlēja basu un Valera dziedāja (ja to tā var nosaukt). Faktiski Vaida bija grupas muzikālā lokomotīve un seja, radīja vārdus un mūziku un vadīja mēģinājumus.

  Galvenā ietekme tajā laikā bija grupas «Exploited» un «Sex Pistols», lai gan eksperimentēja ar visu ko – no Oi! līdz spīdmetālam. Valera un Vaida mācījās Rīgā un brīvdienās brauca uz Daugavpili mēģināt. Drīz «Metal Spirit» pārdēvēja par «M.Spirit», lai neizklausītos tā, it kā grupa spēlētu tikai metālu.

  Vaida mācījās RAU mehānikas fakultātē vienā grupā ar Mareku un Romu Sapeļkinu no Rīgas grupas «Riba Meč Svoloč Obiknovennaja». Tas ārkārtīgi palīdzēja «M.Spirit» virzībai Rīgā. Grupas pirmais koncerts notika RAU zālē un saucās «Rāpo, bruņurrupucīt». Kopā ar «M.Spirit» tur spēlēja «Riba Meč Svoloč» un vēl pāris komandu.

  Drīz radās iespēja uzspēlēt arī dzimtajā pilsētā. Pirmais koncerts Daugavpilī Dzelzceļa tehnikuma zālē bija nopietns pārbaudījums – nevienam nezināma komanda, kas spēlē mūziku, kādu Daugavpilī līdz tam neviens nebija spēlējis. Nekādu irokēzu, protams, nebija – par to Daugavpilī mūsu varoņus pēc koncerta vienkārši piekautu kādi vietējie gopņiki, bet rezultāts tika sasniegts. Par laimi, viss noritēja uz 5 ballēm, un kontakti ar vietējo neformālo sabiedrību bija iedibināti. Pat Kuzja no grupas «Dvinsk» (faktiski galvenā koncerta grupa) iepazinās ar Vaidu. Kādā brīdī Džeka vietā bungas spēlēja puisis vārdā Vlads, kurš diemžēl nomira no leikēmijas, un Daugavpils tusētāji pat sarīkoja koncertu viņa piemiņai.

  1995. gada vasarā bija sakrājies pietiekami daudz materiāla albumam, taču Reiganu iesauca armijā, un ieraksta laikā viņu aizstāja Sleiers – tievs, jautrs un trakulīgs jauneklis, kurš uzradās nezin no kurienes. Sleiers savu iesauku bija dabūjis par mīlestību pret death metal. Ierakstīja albumu «Zaduševnije pesenki M.S. Pankuhiņa» («M.S. Pankuhiņa sirsnīgās dziesmiņas» – M.S. Pankuhins bija atsauce uz abreviatūru M.Spirit, kā jau var noprast). Pirmā albuma vāciņā Reigana nav, bet uz sienas var redzēt uzrakstu «Reigans armijā». Sieniņa, kas tika izmantota vāciņam, atradās bijušās rūpnīcas teritorijā Poguļankā, un to apzīmēja paši mūziķi, izmantojot kā kasetes vāciņa fonu. Ierakstīja mājās pie Kuzjas – grupas «Dvinsk» līdera un viena no Daugavpils rokdzīves pamatlicējiem. Kuzjam piederēja visādi verķi: pastiprinātāji, magnetofoni, mikseri un citas noderīgas lietas, kā arī bija liela muzikālā pieredze. Pēc tam sekoja vairāki koncerti D-pilī.

  Ar kopmītņu paziņu starpniecību Vaida iepazinās ar Valmieras Zirgu – mūziķi ar irokēzu, niknu panku, kurš vēlāk kļuva par vienu no pazīstamākajiem mūziķiem Valmieras alternatīvajā vidē. Zirgs īrēja dzīvokli Purvciemā, mācījās tehnikumā, bet brīvdienās mēģināja mājās Valmierā sevis dibinātajā grupā «Neļudi». Vaida un Zirgs kļuva par tuviem draugiem, un drīz «M.Spirit» piedalījās koncertā Valmierā, bet pēc tam Valkā. Tas bija ļoti neparasts panku maršs no mazpazīstamās krieviskās Daugavpils dziļi latviskajos reģionos. Valmieras un vēlāk arī Rīgas koncertu laikā uz basa visu laiku atradās kādi draugi un paziņas – Reigans bija armijā, un viņu pastāvīgi ne ar vienu negribēja aizstāt.

  Arī muzikālās intereses sāka mainīties indie un grandža virzienā, un spēcīgu ietekmi uz Vaidas vēlīnajām dziesmām «M.Spirit» atstāja Pixies.

  Grupa turpināja mēģināt un koncertēt Rīgā un Daugavpilī, taču kļuva grūti visus savākt kopā, jo Džeks mācījās medicīnas skolā citā Rīgas galā, Reigans dienēja armijā, un arī Valera ar Džeku nebrauca katru nedēļas nogali. Faktiski grupa drīz vien izjuka, bet visi trīs tāpat turpināja kopā tusēt Rīgas neformāļu aprindās.

  Vēlāk Vaida pievienojās diezgan pazīstamajai Daugavpils grupai «Glazki Stekoļščika», kurā bija sapulcējušies labi spēlējoši mūziķi (atšķirībā no mūsu stāsta varoņiem), un kļuva ļoti populārs un mīlēts Daugavpils neformālajās aprindās. Diemžēl 1999. gada februārī viņš traģiski nomira Valeras istabiņā RAU kopmītnēs dažas dienas pirms universitātes diploma saņemšanas. Tas bija milzīgs šoks visiem draugiem un muzikālajai videi Daugavpilī, Valmierā un Rīgā. Daugavpilī viņa piemiņai sarīkoja koncertu ar vietējo grupu piedalīšanos.

  Džeks aizbrauca uz Baltkrieviju, ieguva ārsta izglītību un kļuva par pasniedzēju universitātē. Valera aizbrauca uz Lielbritāniju. Reigans pārcēlās uz Maskavu. Visi trīs kopš tā laika vairs nesazinās.
