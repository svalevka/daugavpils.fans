description: «Имаго» (Imago) — даугавпилсская рок-группа начала 1990-х годов, сформированная
  студентами Рижского технического университета (РТУ) в Даугавпилсе. Совместно с группами
  «Двинск» и «Нейссерия» была хедлайнером исторического рок-фестиваля в студенческом
  клубе РТУ в 1993 году, заложившего основы новой волны даугавпилсского рока.
description_en: Imago was an early-1990s Daugavpils hard rock band founded by students
  of the Riga Technical University (RTU) Daugavpils branch. Together with Dvinsk and
  Neisseria, they co-headlined the historic 1993 RTU Student Club festival, which
  sparked the post-Soviet revival of the Daugavpils underground rock community.
description_lv: Imago bija 1990. gadu sakuma Daugavpils rokgrupa, ko dibinaja Rigas
  Tehniska universitates (RTU) Daugavpils filiales studenti. Kopa ar grupam Dvinsk
  un Neisseria vini bija vesturiska 1993. gada RTU Studentu kluba festivala hedlaineri,
  aizsakot Daugavpils neatkariga roka jaunatnes kustibu.
