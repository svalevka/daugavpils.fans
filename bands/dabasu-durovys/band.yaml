description: Dabasu Durovys («Двери Небес») — флагманская латгальская поп-рок и фолк-рок
  группа, основанная в Даугавпилсе в 2006 году музыкантом Арнисом Слобожаниным при
  участии барабанщика Александра Таманса (основателя группы «Двойная Вода»). Коллектив
  пишет и поет на латгальском языке, является многократным лауреатом латгальской культурной
  премии «Boņuks» и участником крупнейших латвийских фестивалей. В их активе альбомы
  «Lepetnīks» (2008), «Stykins» (2010), «Pādīs vuords» (2014) и «Bāka» (2018).
description_en: Dabasu Durovys ('Doors of Heaven') is the flagship Latgalian pop-rock
  and folk-rock band founded in Daugavpils in 2006 by singer-songwriter Arnis Slobožaņins
  alongside drummer Aleksandrs Tamans (founder of Dvojnaja Voda). Singing primarily
  in Latgalian, the band has won numerous Boņuks cultural awards and remains a fixture
  of Latvian festivals. Their discography includes 'Lepetnīks' (2008), 'Stykins' (2010),
  'Pādīs vuords' (2014), and 'Bāka' (2018).
description_lv: Dabasu Durovys ir viena no vadošajām Latgales poproka un folkroka
  grupam, kuru Daugavpili 2006. gada izveidoja dziesminieks Arnis Slobozanins kopa
  ar bungieri Aleksandru Tamanu (Dvojnaja Voda dibinataju). Grupa raksta un dzied
  latgaliesu valoda, ir daudzkarteja Latgaliesu kulturas gada balvas 'Bonuks' laureāte.
  Izdoti albumi 'Lepetniks' (2008), 'Stykins' (2010), 'Padis vuords' (2014) un 'Baka'
  (2018).
