description: Varang Nord — ведущая фолк-метал группа Латвии, основанная в Даугавпилсе
  в 2014 году Максимом «Волком» Поповым (ранее лидером трэш-метал группы Asthma).
  Группа исполняет агрессивный викинг/фолк-метал с живым аккордеоном и текстами на
  латгальском, русском и английском языках. В 2019 году Varang Nord добились исторического
  триумфа, став победителями мирового финала «Wacken Metal Battle» на легендарном
  фестивале Wacken Open Air в Германии. Дискография включает альбомы «Fire of the
  Northern Lore» (2014), «Master of the Forest» (2015), «Call of Battle» (2017) и
  признанный шедевр «Pārķiuņa uomurs» (2021).
description_en: Varang Nord is Latvia's premier folk metal act, founded in Daugavpils
  in 2014 by Maksims 'Wolf' Popovs (former leader of thrash outfit Asthma). Blending
  ferocious melodic death metal with authentic folk accordion and themes from Baltic
  and Norse folklore sung in Latgalian, Russian, and English, the band achieved global
  recognition in 2019 by winning the prestigious international Wacken Metal Battle
  at Wacken Open Air in Germany. Their discography features 'Fire of the Northern
  Lore' (2014), 'Master of the Forest' (2015), 'Call of Battle' (2017), and the acclaimed
  Latgalian-language masterpiece 'Pārķiuņa uomurs' (2021).
description_lv: Varang Nord ir vadosa Latvijas folkmetala grupa, kuru Daugavpili 2014.
  gada izveidoja Maksims 'Wolf' Popovs (ieprieks grupas Asthma lidere). Apvienojot
  agresivu death metal ar akordeona skanam un Latgales folkloras temam, grupa guva
  vesterisku triumfu 2019. gada, uzvarot starptautiskaja konkursa 'Wacken Metal Battle'
  festivala Wacken Open Air Vacija. Grupas konta ir albumi 'Fire of the Northern Lore'
  (2014), 'Master of the Forest' (2015), 'Call of Battle' (2017) un augsti vertetais
  latgaliesu valoda iedziedatais albums 'Parkiuna uomurs' (2021).
