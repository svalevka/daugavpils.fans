description: «Кислая Изба» — совместный лоу-фай и андеграундный панк-рок проект Александра
  «Коня» Конева (Валмиера, лидер группы «Спички и Кеды») и Владислава «Вайды» Петкуна
  (Даугавпилс, гитарист и автор песен «M. Spirit» и «Глазки Стекольщика»). Весной
  1998 года дуэт записал магнитоальбом «Весна Девяносто Восьмого», сочетающий сырой
  панк, инди-рок, гаражный лоу-фай и абсурдистский юмор, включая кавер на песню «Something
  Against You» группы Pixies.
description_en: '"Kislaya Izba" (Sour Hut) was a lo-fi underground punk rock collaboration
  between Aleksandr "Kon" Konev (Valmiera, frontman of "Spichki i Kedy") and Vladislav
  "Vaida" Petkun (Daugavpils, guitarist and songwriter for "M. Spirit" and "Glazki
  Stekolshchika"). In the spring of 1998, the duo recorded the cassette album "Vesna
  Devyanosto Vosmogo" (Spring of 98), blending raw punk, indie rock, lo-fi aesthetics,
  and absurdist humor, alongside a cover of Pixies "Something Against You".'
description_lv: «Kislaja Izba» («Skābā būdiņa») bija Aleksandra «Zirga» Koņeva (Valmiera,
  grupas «Spichki i Kedy» līderis) un Vladislava «Vaidas» Petkuna (Daugavpils, grupu
  «M. Spirit» un «Glazki Stekoļščika» ģitārists un dziesmu autors) kopīgs lo-fi pagrīdes
  pankroka projekts. 1998. gada pavasarī duets ierakstīja kasešu albumu «Vesna Devjanosto
  Vosmogo» («Deviņdesmit astotā gada pavasaris»), kurā apvienots jēls panks, indie
  roks, lo-fi estētika un absurds humors, tostarp grupas Pixies dziesmas «Something
  Against You» kaverversija.
