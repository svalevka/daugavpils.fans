description: Альбом «Весна Девяносто Восьмого» записан весной 1998 года дуэтом Александра
  «Коня» Конева (Валмиера) и Владислава «Вайды» Петкуна (Даугавпилс). Домашняя лоу-фай
  запись на аудиокассету, полная спонтанной энергии, экспериментальных ходов и рок-н-ролльного
  драйва.
description_en: The album "Vesna Devyanosto Vosmogo" (Spring of 98) was recorded in
  spring 1998 by the duo of Aleksandr "Kon" Konev (Valmiera) and Vladislav "Vaida"
  Petkun (Daugavpils). A home lo-fi cassette recording filled with spontaneous energy,
  experimental ideas, and pure rock n roll spirit.
description_lv: Albumu «Vesna Devjanosto Vosmogo» («Deviņdesmit astotā gada pavasaris»)
  1998. gada pavasarī ierakstīja Aleksandra «Zirga» Koņeva (Valmiera) un Vladislava
  «Vaidas» Petkuna (Daugavpils) duets. Mājas lo-fi kasetes ieraksts, piesātināts ar
  spontānu enerģiju, eksperimentāliem gājieniem un rokenrola duku.
creditText:
- Владислав «Вайда» Петкун — вокал, гитара
- Александр «Конь» Конев — вокал, бас-гитара
creditText_en:
- Vladislav "Vaida" Petkun — vocals, guitar
- Aleksandr "Kon" Konev — vocals, bass guitar
creditText_lv:
