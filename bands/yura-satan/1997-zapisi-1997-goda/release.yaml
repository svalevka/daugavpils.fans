description: '- as described by Vantuz: Кто переписывал у меня грузию и Кузя тоже
  Юру писал они с Сашкой и Кузей в одном подъезде жили. Ещё там где кришнаиты (дом
  санитарного просвещения в СССР) одно время был типа рок клуб. Там сатан с Слэйером
  на акустах концерт давали. Сомневаюсь что было записано.Да Кузя писал. Только у
  него такой аналоговый ревербератор был и по саунду слышно что он.'
description_en: '- as described by Vantuz: Someone re-recorded Georgia from me, and
  Kuzya also recorded Yura, they lived in the same entryway with Sashka and Kuzya.
  Also where the Krishnas are (the House of Sanitary Education in the USSR) for a
  time there was like a rock club. There Satan and Slayer played an acoustic gig.
  I doubt it was recorded. Yes, Kuzya recorded it. Only he had that kind of analog
  reverberator and you can tell by the sound that it''s him.'
description_lv: '- kā stāsta Vantuzs: Kāds pārrakstīja no manis «Gruziju», un Kuzja
  arī ierakstīja Juru, viņi ar Sašku un Kuzju dzīvoja vienā kāpņutelpā. Vēl tur, kur
  krišnaiti (PSRS sanitārās izglītības nams), kādu laiku bija tāds kā rokklubs. Tur
  Satans ar Slejeru uz akustiskajām ģitārām sniedza koncertu. Šaubos, vai tas tika
  ierakstīts. Jā, Kuzja ierakstīja. Tikai viņam bija tāds analogs reverbs, un pēc
  skanējuma var dzirdēt, ka tas ir viņš.'
