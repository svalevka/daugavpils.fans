description: Юрий "Сатан" Стацевич — колоритная и культовая фигура даугавпилсского
  панк-андеграунда 1990-х годов. Его акустические выступления, исполняемые с надрывной
  искренностью, были неотъемлемой частью атмосферы даугавпилсского рок-клуба «Soundtrack»
  и неформальных сейшенов города. Основные записи Юры Сатана датируются периодом 1996–1999
  годов, включая студийные и акустические треки, а также концертные записи из клуба
  «Soundtrack» 1997 года.
description_en: Yuri "Satan" Statsevich is an iconic, cult figure of the 1990s Daugavpils
  punk underground. His raw acoustic performances, delivered with piercing emotional
  sincerity, were a cornerstone of the atmosphere at the "Soundtrack" rock club and
  informal gatherings across the city. His principal recordings date between 1996
  and 1999, spanning acoustic studio tracks as well as live performances captured
  at the "Soundtrack" club in 1997.
