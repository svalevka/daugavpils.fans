description: Hardweld — даугавпилсская панк-рок группа, созданная в 2014 году Павлом
  Булановым. Коллектив играет бодрый, мелодичный скейт-панк и поп-панк. Призеры даугавпилсского
  «Rok maratons 2018» (где гитарист Александр Устинов и барабанщик Алексей Григорьев
  получили индивидуальные награды), участники фестивалей Chemical Reaction и клубных
  сейшенов в Латгалии. 13 сентября 2019 года группа презентовала свой альбом в клубе
  Artilērijas pagrabi.
description_en: Hardweld is a Daugavpils punk rock power trio formed in 2014 by Pavels
  Bulanovs. Playing high-energy skate punk and melodic pop-punk, the band won 3rd
  place at the Daugavpils Rok maratons 2018 (with individual prizes for guitarist
  Aleksandrs Ustinovs and drummer Aleksejs Grigorjevs), regularly performing at Chemical
  Reaction and Artilerijas pagrabi.
description_lv: Hardweld ir Daugavpils pankroka grupa, ko 2014. gada izveidoja Pavels
  Bulanovs. Grupa spele atru skeitpanku un melodisku pop-panku, 3. vietas ieguveja
  Daugavpils Rokmaratona 2018 (kur Aleksandrs Ustinovs un Aleksejs Grigorjevs sanema
  individualas balvas). 2019. gada 13. septembri grupa prezenteja savu albumu kluba
  Artilerijas pagrabi.
