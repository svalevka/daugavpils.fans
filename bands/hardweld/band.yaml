description_en: Hardweld is a Daugavpils punk rock power trio formed in 2014 by Pāvels
  Bulanovs. Playing high-energy skate punk and melodic pop-punk, the band has been
  a frequent performer at the Daugavpils Rock Marathon, Chemical Reaction festival
  series, and regional club gigs.
