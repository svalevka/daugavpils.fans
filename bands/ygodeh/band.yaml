description: YGODEH — даугавпилсский метал-проект, ставший прямым студийным продолжением
  группы Disease. Создан Павлом «Питоном» Степановым при участии барабанщика группы
  Свинктр Виктора Ринкевича (Фека / Абдула) и барабанщика Disease Вадима Ветрина.
  Коллектив развивает мощное индустриальное и симфоническое дэт-метал звучание, сочетая
  агрессивные гитарные полиритмы, электронные секвенции и симфоническую монументальность.
  Дискография группы включает EP «Dawn of Technological Singularity» (2010), альбомы
  «The Experiment Interrupted» (2013) и «Clinic of Malefication» (2016).
description_en: YGODEH is a Daugavpils metal project formed as the direct studio continuation
  of Disease. Founded by Pavel 'Piton' Stepanov alongside Viktor Rinkevich ('Feka
  / Abdula' from Svinktr) and Vadim Vetrin ('Vadozz' from Disease/Viselica), the project
  explores industrial and melodic death metal, driven by complex guitar rhythms, electronic
  synthesis, and symphonic orchestration. Their discography includes the EP 'Dawn
  of Technological Singularity' (2010), and albums 'The Experiment Interrupted' (2013)
  and 'Clinic of Malefication' (2016).
description_lv: YGODEH ir Daugavpils metalmūzikas projekts un grupas Disease tiesa
  studijas turpinataja. To izveidoja Pavels 'Pitons' Stepanovs kopa ar Viktoru Rinkevicu
  ('Feka / Abdula' no grupas Svinktr) un Vadimu Vetrinu ('Vadozz' no Disease/Viselica).
  Grupa muzice industrial un melodiska death metal zanra, apvienojot sarezgitas gitaru
  partijas, elektroniku un simfonisko skanejumu. Izdevusi EP 'Dawn of Technological
  Singularity' (2010), ka ari albumus 'The Experiment Interrupted' (2013) un 'Clinic
  of Malefication' (2016).
