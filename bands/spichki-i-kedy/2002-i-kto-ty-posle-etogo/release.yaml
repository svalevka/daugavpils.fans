description: Альбом «И кто ты после этого?» записан группой «Спички и Кеды» в 2002
  году в Валмиере. В альбом вошли четырнадцать треков, сочетающих прямолинейный панк-рок,
  бодрящий ска и регги, а также дань уважения дружественным коллективам — кавер на
  «...16; 17...» даугавпилсской группы M. Spirit и «Лечебницу» группы Химера.
description_en: 'The album "I kto ty posle etogo?" (And Who Are You After That?) was
  recorded by Spichki i Kedy in 2002 in Valmiera. The 14-track release combines straightforward
  punk rock, upbeat ska, and reggae, alongside tributes to kindred underground bands:
  a cover of Daugavpils band M. Spirits "...16; 17..." and Saint Petersburg band Chimeras
  "Lechebnitsa".'
description_lv: Albumu «I kto ty posle etogo?» («Un kas tu pēc tā esi?») grupa «Spichki
  i Kedy» ierakstīja 2002. gadā Valmierā. Četrpadsmit skaņdarbu izlasē apvienots tiešs
  pankroks, enerģisks ska un regejs, kā arī veltījumi radniecīgām pagrīdes grupām
  — Daugavpils grupas M. Spirit dziesmas «...16; 17...» un Sanktpēterburgas grupas
  «Himera» dziesmas «Lečebņica» kaverversijas.
