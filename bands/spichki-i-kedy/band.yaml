description: Группа «Спички и Кеды» была образована осенью 1999 года в Валмиере Александром
  «Конём» Коневым. Коллектив играл задорный панк-рок с элементами ска-панка и регги,
  вдохновляясь латвийской андеграундной сценой (включая даугавпилсский панк, в частности
  группу «M. Spirit») и независимой культурой 1990-х. Группа активно выступала в Валмиере,
  Риге и других городах Латвии. В 2002 году коллектив записал полноформатный альбом
  «И кто ты после этого?», в который вошли четырнадцать треков, включая кавер-версии
  на «...16; 17...» группы M. Spirit и «Лечебницу» питерской «Химеры». Группа просуществовала
  до 2004 года.
description_en: '"Spichki i Kedy" (Matches and Sneakers) was formed in the autumn
  of 1999 in Valmiera, Latvia, by Aleksandr "Kon" Konev. The band played upbeat punk
  rock infused with ska-punk and reggae rhythms, drawing inspiration from the Latvian
  underground scene (including Daugavpils punk and M. Spirit) and 1990s indie culture.
  They actively performed in Valmiera, Riga, and across Latvia. In 2002, the band
  recorded their full-length album "I kto ty posle etogo?" (And Who Are You After
  That?), featuring 14 tracks alongside covers of M. Spirits "...16; 17..." and Saint
  Petersburg band Chimeras "Lechebnitsa". The band was active until 2004.'
description_lv: Grupa «Spichki i Kedy» («Sērkociņi un kedas») tika dibināta 1999.
  gada rudenī Valmierā, tās dibinātājs un līderis bija Aleksandrs «Zirgs» Koņevs.
  Kolektīvs spēlēja enerģisku pankroku ar ska-panka un regeja elementiem, iedvesmojoties
  no Latvijas pagrīdes mūzikas (tostarp Daugavpils panka un grupas «M. Spirit») un
  1990. gadu neatkarīgās kultūras. Grupa aktīvi koncertēja Valmierā, Rīgā un citās
  Latvijas pilsētās. 2002. gadā tapa pilna garuma albums «I kto ty posle etogo?» («Un
  kas tu pēc tā esi?»), kurā iekļauti 14 skaņdarbi, tostarp Daugavpils grupas M. Spirit
  («...16; 17...») un Sanktpēterburgas grupas «Himera» («Lečebņica») kaverversijas.
  Grupa pastāvēja līdz 2004. gadam.
