description_lv: '- Vai man ir pāris dziesmu. Pamēģināsim uztaisīt?


  - Kāpēc ne? Aiziet.


  Tā Eda virtuvē tika iesēta sēkla, no kuras vēlāk izauga Ko Band. Sākotnēji grupa
  tika iecerēta kā pagaidu projekts: sanāca puiši, uzspēlēja, ierakstīja un cauri.



  Pirmā ieraksta sastāvs (1998. gads):


  Eds (vokāls, ģitāra)


  Variks (vokāls, bass)


  Ruslans "Goblins" Kondruss (ģitāra)


  Kuzja (ģitāra, akordeons)


  Vadims Sidorovs (sitamie instrumenti)'
