description: 'После первой записи Эд уехал в Ригу, Гоблин — в Чикаго. Из Лондона вернулся
  Слоик, и группа собралась в новом составе: репетиции, тусовки и запись альбома «Кожанное
  Воскресенье».


  Состав:

  Слоик (вокал)

  Кузя (гитара)

  Варик (бас)

  Вадим Сидоров (ударные)'
description_en: 'After the first recording, Ed left for Riga and Goblin left for Chicago.
  Sloik returned from London, and the band recorded the album "Kozhannoye Voskresenye"
  (Leather Sunday).


  Lineup:

  Sloik (vocals)

  Kuzya (guitar)

  Varik (bass)

  Vadim Sidorov (drums)'
