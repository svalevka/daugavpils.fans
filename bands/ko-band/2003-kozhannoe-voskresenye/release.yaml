description_lv: 'Pēc pirmā ieraksta Eds aizbrauca uz Rīgu, bet Goblins uz Čikāgu.
  No Londonas atgriezās Sloiks, un grupa sanāca jaunā sastāvā: mēģinājumi, tusēšanās
  un albuma «Kožannoe Voskresenje» (Ādas svētdiena) ieraksts.



  Sastāvs:


  Sloiks (vokāls)


  Kuzja (ģitāra)


  Variks (bass)


  Vadims Sidorovs (sitamie instrumenti)'
