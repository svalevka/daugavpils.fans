description: '- У меня есть пару вещей. Попробуем сделать?

  - Почему бы и нет? Давай.

  Вот так на кухне Эда и было посажено семя, из которого в дальнейшем “вырастет” Ko
  Band.

  Изначально группа была задумана как временный проект. Мол собрались ребята, которым
  есть, что сказать, поиграли, записали и баста. Ну, баста не вышла… Затянули.


  В итоге Ko Band (первый состав 1998 года):

  Эд (вокал, гитара)

  Варик (вокал, бас)

  Руслан "Гоблин" Кондрусь (гитара)

  Кузя (гитара, аккордион)

  Вадим Сидоров (ударные)

  В этом составе была сделана первая запись 1998 года.


  «Кожанное Воскресенье» (2003 год):

  После Эд уехал в Ригу, Гоблин в Чикаго. К счастью из Лондона вернулся Слоик. И тут,
  опять пошло-поехало. Похер продолжается. Репетиции, тусовки, алкоголь и… (очень
  много всякого… для веселья). Соединилось все вышеупомянутое и оппа:

  Слоик (вокал)

  Кузя (гитара)

  Варик (бас)

  Вадим Сидоров (ударные)

  В 2003 году группа записала альбом «Кожанное Воскресенье», а также выступила на
  концерте в ДКХ 4 января 2003 года.


  Третий состав (2005 год):

  Пришло время третьего состава. Уехавшего обратно в Лондон Слоика заменила Олита
  Кузьмина. Вместо Кузи появился, удивлявший своей игрой, Арманд. После некоторых
  экспериментов в поиске стиля, вымученных текстов и мелодий, были сделаны наброски
  на несколько вещей, записанные в режиме репетиции:

  Олита (вокал)

  Арманд (гитара)

  Варик (бас)

  Вадя (ударные)


  После чего Олита покинула группу, Варик уехал в Англию. Ну а что дальше???'
description_en: '"I have a couple of tunes. Shall we try working them out?"

  "Why not? Let''s do it."

  And so, in Ed''s kitchen, the seed was planted from which Ko Band would eventually
  grow.

  Originally, the band was conceived as a temporary project: guys who had something
  to say gathering together, playing, recording, and that''s it. Well, ''that''s it''
  didn''t happen... it dragged on.


  The initial 1998 Ko Band lineup:

  Ed (vocals, guitar)

  Varik (vocals, bass)

  Ruslan "Goblin" Kondrus (guitar)

  Kuzya (guitar, accordion)

  Vadim Sidorov (drums)

  With this lineup they made their first recording in 1998.


  "Kozhannoye Voskresenye" (Leather Sunday, 2003):

  Afterwards Ed left for Riga and Goblin left for Chicago. Fortunately, Sloik returned
  from London. And here we go again. The freewheeling spirit continued: rehearsals,
  hangouts, alcohol and... (plenty of fun stuff). All of that came together and bam:

  Sloik (vocals)

  Kuzya (guitar)

  Varik (bass)

  Vadim Sidorov (drums)

  In 2003 the group recorded the album "Kozhannoye Voskresenye" and also performed
  at the DKKh concert on January 4, 2003.


  Third Lineup (2005):

  The time came for the third lineup. Sloik headed back to London and was replaced
  by Olita Kuzmina. In place of Kuzya came Armand, astonishing everyone with his guitar
  playing. After some style experiments, strained lyrics and melodies, rough sketches
  were recorded during a rehearsal session:

  Olita (vocals)

  Armand (guitar)

  Varik (bass)

  Vadya (drums)


  Afterwards Olita left the band and Varik departed for England. And what next???'
