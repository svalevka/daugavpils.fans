description: 'Первый магнитоальбом группы, самостоятельно изданный на кассете в 1997-1998
  годах, Даугавпилс, записанный дома у Вантуза на его 4-х канальном пульте. Название
  альбома объясняется в биографии группы: слово «Изоптица» стало понятно только в
  следующем альбоме, поскольку для песни «Это из-за птиц» места на этом альбоме уже
  не хватило. Здесь представлена официальная 18-трековая версия альбома с Bandcamp-страницы
  группы (с Intro и Outro). Авторство песен: Вайда написал и спел «Солнышко», «Brivibas
  Piemineklis», «Мэрри Гипус», «Пулю пущу», «На пол Яне», «К нулю», «Здравствуй, милая
  девочка» и «Зеленая»; остальные песни (кроме Intro и Outro) — Рыб. На оригинальной
  кассете был ещё один трек Рыба, «Куда попал», не вошедший в официальную Bandcamp-версию
  альбома. Оцифровано в MP3 320 kbps.'
description_en: 'The band''s first tape album, self-released on cassette in 1997-1998,
  Daugavpils, recorded at Vantuz''s home on his 4-channel mixing desk. The album''s
  title is explained in the band''s biography: the word "Izoptitsa" only made sense
  once the next album came out, since the song "Это из-за птиц" ("It''s Because of
  the Birds") no longer fit on this one. This is the official 18-track version of
  the album from the band''s Bandcamp page (with Intro and Outro). Songwriting/vocals:
  Vaida wrote and sang "Солнышко", "Brivibas Piemineklis", "Мэрри Гипус", "Пулю пущу",
  "На пол Яне", "К нулю", "Здравствуй, милая девочка" and "Зеленая"; the rest (aside
  from Intro/Outro) is Ryb. The original cassette had one more Ryb track, "Куда попал",
  not included on the official Bandcamp version. Digitized to MP3 320 kbps.'
