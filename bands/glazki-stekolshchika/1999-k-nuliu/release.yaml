description: 'Кассетный сборник 1999 года, составленный из части песен второго альбома
  (пересекается с треками альбома "Clinic", записанными в те же сессии, в частности
  "Mystification"/"Mistifikasion", "Номер раз", "Дверка", "Обои", "Латгальская прощальная",
  "Чудище" и "...16, 17...") и четырёх треков, повторно взятых с первого альбома "Ждите
  Изоптица" ("Солнышко", "Мэри Гиппус", "На поляне", "К нулю"). Оцифровано в MP3 (320
  kbps CBR).

  '
description_en: 'A 1999 cassette compilation combining part of the second album''s
  material (overlapping with tracks on "Clinic", from the same recording sessions)
  with four tracks carried over from the first album, "Ждите Изоптица". Digitized
  to MP3 (320 kbps CBR).

  '
