description: 'Со слов Рыба.


  В общем, сидели мы как-то с Вайдой у меня на квартире, напротив театра (там синюк
  один, толи Эдик, толи Толик, сдавал комнату за бутылку). Ну, поиграли на гитарках
  уже… Покурили… А тема у нас была - как наш совместный песенный проект назвать. Вариантов
  много было. Самый сильный - "Так я сжег свои пальцы". Но все равно не то. А по телевизору
  в это время мальчуган бегал, камнями окна разбивал. За ним Чарли Чаплин ходил и
  новые окна вставлял. Одна шайка, короче. Ну и как там ситуация у них сложилась,
  я точно не помню. Толи их заподозрили, толи еще чего, но в один момент крупным планом
  показали лицо Чарли Чаплина, полные правды и такого глубокого разочарования в людях
  глаза… Ну я и понял все.


  - Слушай, а давай "Глазки Стекольщика"?

  - Давай.


  А сама идея вместе заиграть - Вайдина была.


  Он тогда в Риге в авиационном учился и в "M.Spirit" с Валерой и Джеком играл. Но
  что-то не шли у них репетиции там, точно не знаю. Да и не с руки в общаге играть.
  Все больше студенческие веселья. А петь-то прет.


  Я по тем временам автостопом катался. Заочный юридический бросил и Завод Химического
  Волокна этот сраный. Вырвался на свободу. Походу поиграл уже в "Quasimodo" (Варик,
  Подкудинов, Некрофил), и потом в одном проекте с Гуной и Тосей.


  Ну и занесло нас с Чачисом этим самым автостопом к "M.Spirit''ам" в общагу, в 720-ю.
  Там много кто побывал. Люди по-разному принимают… Мы друг на друга все посмотрели
  и на Москачку за дубасом поехали. Так завязалась крепкая мужская дружба и взаимопонимание.


  Для меня лично в музыке на первом месте всегда слова стояли (Цоевское что ли воспитание),
  и когда я Вайду услышал под акуст в 720-ой, я реально обрадовался и зауважал. Потому
  что от его песен гусиные мурашки по спине заходили.


  Долго ли, коротко ли, а общий проект назрел. И песни из нас новые как грибы перли.
  А это для группы хороший знак. Само собой вопрос: "где записывать будем?". И вот
  тут-то возникла чернобровая фигура Вантуза с его 4-х канальным пультиком, драм машиной
  и гитарой Jackson плюс процессор. Как творческая личность, он пребывал вне ансамблей,
  известный по прошлому проекту "Neisseria"… и вообще.


  Предложение выслушал заинтересованно.


  Ну и записали таким вот непосредственно образом первый наш магнитоальбом "Ждите
  Изоптица" ("Изоптиц" стал бы понятен в последующем альбоме, т.к. для песни "Это
  из-за птиц" места в этом альбоме уже не хватило).


  Ну и стали дальше себе играть. Вайда с "M.Spirit''ами", а я на пожарной вышке Черепово
  (по долгу новой службы). Друг Шура Некрофил навещал меня с гитарой, и мы придумали
  ма-а-аленький альбом "Провал" назвавшись "Хориные Бега", потому как носились тогда
  вдвоем с акустиками, что твои хорьки… смешные… и интересные.


  А "M.Spirit", поменяв название на "Medvedj-S", в 720-ой какие-то свои психоделические
  эксперименты записывали… Ну и где те записи, я вас спрашиваю? Не знаю.


  Короче, волею судеб, оказались мы с Вайдой, Вантузом и мной нос к носу еще раз.
  В принципе, никто и не прощался-то… Дружили, закладывали… Не пели вместе только.
  А в Д-се оно как, если музыканты дружат, то рано или поздно запоют…


  Некрофил предполагался первым басистом, но его профессия геолога-бурильщика увела
  парня из Латгалии. Нарисовался энтузиаст. Рубрехт. Музыку он принял, да и сам запел
  с нами.


  Второй альбом получился большим. Куча людей тем или иным образом в нем поучаствовала:
  Стакан, Кузя, Толик Петухов, Еремей, Женя, Некрофил опять же… Звуком рулил Вантуз.


  Короче, Вайда до окончания альбома не дожил. Умер в Риге, в общаге. Досводили без
  него.


  Только песен от него осталось предостаточно. По крайней мере, еще на альбом. И вот
  крутятся они у меня на языке… И где-то внутри еще, от куда мурашки на кожу бегут…
  Спеть надо.


  P.S.  что и было сделано в Черновяки. 2007.

  '
description_en: 'In Ryb''s (Alexander Rybakov''s) own words: he and Vaida (Vladislav
  Petkun, then playing in "M.Spirit" in Riga) came up with the band''s name while
  hanging out at Ryb''s apartment, inspired by a TV scene of Charlie Chaplin replacing
  windows a boy had broken with stones - "Glazki Stekolshchika" ("The Glazier''s Eyes").
  The two recorded a first tape album, "Ждите Изоптица" ("Wait for the Iso-bird"),
  joined by Vantuz and his home 4-channel setup. A second, larger album followed once
  Rubrekht (originally meant to replace Nekrofil on bass) joined, with contributions
  from several friends of the band. Vaida died in a Riga dormitory before the second
  album was finished; it was mixed to completion without him.

  '
