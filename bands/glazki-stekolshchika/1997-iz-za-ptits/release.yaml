description: 'Дуэтный магнитоальбом Александра Рыбакова (Рыба) и Владислава Петкуна
  (Вайды), записанный до/около первого альбома группы "Ждите Изоптица". Название альбома
  отсылает к песне "Это из-за птиц", не поместившейся на "Ждите Изоптица" - отсюда
  и название того альбома. Точный год записи неизвестен, датирован приблизительно
  по контексту биографии группы. Точный исходный порядок треков не сохранился; здесь
  треки идут в алфавитном порядке названий. Оцифровано в MP3 (320 kbps CBR).

  '
description_en: 'A duo tape album by Alexander Rybakov (Ryb) and Vladislav Petkun
  (Vaida), recorded before/around the band''s first album "Ждите Изоптица". The exact
  recording year is unknown and estimated from context in the band''s biography. The
  original track order was not preserved; tracks here are listed alphabetically by
  title. Digitized to MP3 (320 kbps CBR).

  '
