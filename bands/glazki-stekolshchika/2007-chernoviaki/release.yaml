description: 'Более поздний сборник 2007 года, изданный на Bandcamp-странице группы
  - не то же самое, что дуэтный альбом Рыба и Вайды "Из-за птиц" (1997), хотя частично
  пересекается с ним по песням (в других вариантах записи и/или названиях: "Гадюкин"
  здесь "Г-н Гадюкин", "Из-за птиц" здесь "Изоптиц", "Вагон" здесь "Последний вагон"),
  и добавляет два новых трека, включая короткий набросок "А завтра". Аудио взято напрямую
  с Bandcamp-стрима (мастер-записи на 320 kbps не найдены) - в отличие от остальных
  релизов в этом архиве, это не оцифровка оригинальной плёнки, а копия 128 kbps MP3
  потока с Bandcamp.

  '
description_en: 'A later, 2007 compilation released on the band''s Bandcamp page -
  not the same thing as Ryb and Vaida''s 1997 duo album "Из-за птиц", though it partially
  overlaps with it in songs (in different takes and/or titles), and adds two new tracks,
  including a short 15-second sketch, "А завтра". Unlike the rest of this archive,
  this release''s audio was sourced directly from the Bandcamp stream (no higher-quality
  320 kbps master was available) rather than digitized from an original tape.

  '
