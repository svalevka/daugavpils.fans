description: 'Более поздний сборник 2007 года, изданный на Bandcamp-странице группы
  — не то же самое, что дуэтный альбом Рыба и Вайды «Из-за птиц» (1997), хотя частично
  пересекается с ним по песням (в других вариантах записи и/или названиях: «Гадюкин»
  здесь «Г-н Гадюкин», «Из-за птиц» здесь «Изоптиц», «Вагон» здесь «Последний вагон»),
  и добавляет два новых трека, включая короткий набросок «А завтра». Аудио получено
  через официальную Bandcamp-загрузку (контейнер MP3 320 kbps); истинное качество
  исходной мастер-записи до её загрузки на Bandcamp неизвестно.'
description_en: 'A later, 2007 compilation released on the band''s Bandcamp page —
  not the same thing as Ryb and Vaida''s 1997 duo album "Из-за птиц", though it partially
  overlaps with it in songs (in different takes and/or titles: "Гадюкин" here "Г-н
  Гадюкин", "Из-за птиц" here "Изоптиц", "Вагон" here "Последний вагон"), and adds
  two new tracks, including a short sketch, "А завтра". Audio obtained via the official
  Bandcamp download (MP3 320 kbps container); the true quality of the master prior
  to its upload to Bandcamp is unknown.'
