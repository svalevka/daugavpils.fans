description: 'Второй магнитоальбом группы, записанный на дом-студии «Кикос Воскрес»
  при участии Вайды, Рыба, Рубрехта и Вантуза (звук/сведение), а также друзей группы:
  Стакана, Кузи, Толика, Петухова, Еремея и Некрофила. Вайда не дожил до завершения
  альбома — умер в Риге, в общежитии, — и альбом досводили без него. Здесь представлена
  официальная 24-трековая версия альбома с Bandcamp-страницы группы (включая четыре
  инструментальные интерлюдии «Драпировка»); архивная копия сайта «Черный Понедельник»
  2008 года документирует более раннюю, 21-трековую версию с полными данными об участниках
  сессий. Известное по более ранней оцифровке авторство песен: Вайда написал и спел
  «Машинное сало», «Дверка», «16-17», «Бал», «Обои», «Ужасный сон» и «Чудище»; Рыб
  — «Воздух», «Надо», «Что сказал Deadfly», «Черный тополиный», «Черный орган» и «Самый
  черный». Авторство остальных треков («Мистификасион», «Номер раз», «Латгальская
  прощальная», «Белая дорога», четырёх «Драпировка», «Don''t worry be crazy», «Новые
  пути», «Братья пустоты», «Былые») не зафиксировано. Оцифровано в MP3 320 kbps.'
description_en: 'The band''s second tape album, recorded at the "Кикос Воскрес" home
  studio with Vaida, Ryb, Rubrekht and Vantuz (sound/mixing), plus contributions from
  several friends of the band. Vaida died before the album was finished and it was
  mixed to completion without him. This is the official 24-track version of the album
  from the band''s Bandcamp page (including four instrumental "Драпировка" interludes);
  a 2008 archived snapshot of the old "Черный Понедельник" site documents an earlier,
  21-track version with full session credits. Songwriting/vocals known from that earlier
  digitization: Vaida wrote and sang "Машинное сало", "Дверка", "16-17", "Бал", "Обои",
  "Ужасный сон" and "Чудище"; Ryb wrote and sang "Воздух", "Надо", "Что сказал Deadfly",
  "Черный тополиный", "Черный орган" and "Самый черный". Authorship of the remaining
  tracks ("Мистификасион", "Номер раз", "Латгальская прощальная", "Белая дорога",
  the four "Драпировка" interludes, "Don''t worry be crazy", "Новые пути", "Братья
  пустоты", "Былые") is not documented. Digitized to MP3 320 kbps.'
