description: |-
  Студийная запись даугавпилсской хэви-метал группы Legion, сделанная в 2004 году на студии звукозаписи Константина Дзедзелиса.

  Релиз демонстрирует техничный, скоростной мелодик-метал с выразительными гитарными соло Ярослава Гаврилова, плотной ритм-секцией и клавишными аранжировками, сочетая инструментальные треки ("Themes", "Memories") и драйвовые номера с русско- и англоязычной лирикой ("Воскресение", "Sacrifice", "Сон растомана", "№6", "Землетрясение").

  Состав записи:
  Ярослав Гаврилов — гитара, музыка
  Владислав Качановский — ударные
  Дмитрий Денисов — бас-гитара
  Владлен Филимонов — клавишные
description_en: |-
  Studio recording by Daugavpils heavy metal band Legion, produced in 2004 at the recording studio of Konstantīns Dzedzelis.

  The album showcases technical, melodic metal featuring expressive guitar solos by Jaroslav Gavrilov, tight rhythm driving sections, and synth arrangements, alternating between evocative instrumental pieces ('Themes', 'Memories') and driving anthems in Russian and English ('Voskresenie', 'Sacrifice', 'Son rastomana', 'No. 6', 'Zemletriasenie').

  Recording lineup:
  Jaroslav Gavrilov — guitar, composition
  Vladislav Kachanovsky — drums
  Dmitry Denisov — bass guitar
  Vladlen Filimonov — keyboards
