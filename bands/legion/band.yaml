description: |-
  Даугавпилсская хэви-метал группа «Legion», заметные представители гитарного движения Латгалии первой половины 2000-х годов. Коллектив регулярно выступал на городских рок-фестивалях и сборных сейшенах в Центре Латышской Культуры (ЦЛК) и на репетиционных точках города.

  Музыка группы ориентировалась на классический мелодичный хэви-метал с быстрыми риффами, неоклассическими соло-партиями и атмосферными клавишными пассажами. Состав: Ярослав Гаврилов (гитара, музыка), Владислав Качановский (ударные), Дмитрий Денисов (бас-гитара), Владлен Филимонов (клавишные).
description_en: |-
  Daugavpils heavy metal group Legion was a prominent part of Latgale's melodic metal movement in the first half of the 2000s. The band regularly played city rock festivals, joint concerts at the Center of Latvian Culture (CLK), and local underground venues.

  Their sound drew upon classic melodic heavy metal with fast-paced twin-guitar leads, neoclassical solo flourishes, driving rhythm interplay, and atmospheric synthesizer textures. Lineup: Jaroslav Gavrilov (guitar, composer), Vladislav Kachanovsky (drums), Dmitry Denisov (bass guitar), and Vladlen Filimonov (keyboards).
