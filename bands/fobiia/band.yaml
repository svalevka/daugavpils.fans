description: '“Латгалес Лайкс”, “Время молодых”, июнь 1995:


  Среди участников июньского рок-митинга будет и квартет “Phobia”, для которого это
  выступление станет первым появлением перед публикой. От этой команды вполне можно
  будет ожидать немалого, т.к. на 75% участники её – “потомственные двинчане”. Геннадий
  Кузьмин, Руслан Кондрусь и Вадим Неминущий, оставаясь в составе “Двинска”, организовали
  в декабре прошлого года свою команду под названием “Phobia” как параллельный проект
  основной группе, которая уже неплохо известна рок-мэнам нашего города. Причем все
  это не означает распада “Двинска”. Отнюдь нет! Обе группы прекрасно ладят между
  собой, репетируют в одном помещении, демократично распределяя между собой время.
  И обе команды выступят на предстоящем фестивале.


  Возникновение нового состава последовало за возникшими в рядах “двинчан” некоторыми
  разногласиями по поводу дальнейшего музыкального направления. Ударник Сергей Ермолаев
  предпочитал более традиционный хард-рок 70-х годов, вроде G.Moore, Scorpions, AC/DC.
  А оставшаяся тройка музыкантов хотела исполнять более современную и, главное, более
  тяжелую “металлическую” музыку. Чаще всего в подобных случаях дело идет к развалу
  состава. Но тут надо отдать должное нашим молодым землякам: они приняли решение,
  не порывая дружеских связей и не разрушая уже достигнутого с немалым трудом, организовать
  параллельный проект. Таким образом, “Phobia” дала возможность музыкантам максимального
  музыкального самовыражения. На роль вокалиста пришел Валентин Васильев. За его плечами
  не остался длинный список групп, с которыми он выступал ранее. Зато он с давних
  пор был хорошим другом “двинчан”. Именно ему принадлежит мысль так назвать квартет.
  Он же пишет и тексты. Если у “Двинска” в целом они вращались более менее все же
  в кругу актуальных, злободневных проблем дня сегодняшнего, то “Phobia” делает попытку
  взглянуть на жизнь более отстраненно, ребята пытаются сделать это с помощью определенного
  философского осмысления. Не случайно первый магнитоальбом группы получил название
  “Вечность”. (Композиции с него составят большую часть фестивального репертуара.)
  Квартет планирует в последний раз выступить на русском языке, а в дальнейшем – петь
  исключительно по-английски. Что же, в этом, наверно, есть свой резон! Так группа
  будет ближе к звучанию корифеев “металла” 90-х годов. Во-вторых, участники группы
  считают, что сегодня есть смысл выбирать для исполнения только два языка: латышский
  или английский. Они остановились на втором… В рядах “двинчан”, участников нового
  проекта, произошла некоторая перегруппировка сил. Геннадий Кузьмин (он же известный
  в рок-кругах нашего города как “Кузя”) гитару поменял на место за ударной установкой.
  Руслан Кондрусь остался единственным гитаристом. Вадим Неминущий также сохранил
  прежнюю “двинскую” специализацию – бас-гитару.


  Музыка по сравнению с “Двинском” стала еще более тяжеловесной. Сочиняют ее все участники.
  С самого основания было твердо решено не подражать никакой одной определенной известной
  группе. Поставлена задача искать свой путь в мире “металла”. Свой стиль определяют
  как смесь элементов “death” и “doom”. Чтобы дать еще более точное представление
  о том, какой продукцией попотчует вас “Phobia” 30 июня, добавим, что в качестве
  любимых прославленных команд наши металлеры называют следующие составы: “Pantera”,
  “Paradise Lost”, “Metallica”, “Sepultura”, “Machine Head”, “Biohazard”, “Candlemass”,
  “Death”. Словом, именно для любителей “тяжелой индустрии” прежде всего рассчитана
  музыка, которую мы все вскоре услышим в зале ДК 2. Интересно при этом будет наблюдать,
  какая группа из двух родственных получит большое внимание – “патриарх” “Двинск”
  или дебютирующая “Phobia”?!


  P.S. Две вышеупомянутые группы распались после этого концерта.


  Альбом «Вечность» (1995 год):

  Валек Васильев (вокал, программирование ударных)

  Генадий "Кузя" Кузьмин (гитара, вокал, бас, клавиши, программирование ударных)


  01. Зов

