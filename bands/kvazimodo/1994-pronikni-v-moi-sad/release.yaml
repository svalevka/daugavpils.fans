description: 'Первый альбом группы, записанный за один вечер, без наложений, на бобину,
  у Айвара Янсона дома в Юности (Яуниbе) - Янсон же сыграл на барабанах. Состав: Александр
  Рыбаков (Рыб) (гитара, тексты), Андрей Фаткутдинов (Андрон) (гитара, вокал), Варик
  (бас), Айвар Янсон (барабаны, запись). Оцифровано без потерь в FLAC.

  '
description_en: 'The band''s first album, recorded in a single evening with no overdubs,
  straight to reel, at Aivar Ianson''s home in Yaunība - with Ianson himself on drums.
  Lineup: Alexander Rybakov (Ryb) (guitar, lyrics), Andrei Fatkutdinov (Andron) (guitar,
  vocals), Varik (bass), Aivar Ianson (drums, recording). Digitized losslessly to
  FLAC.

  '
