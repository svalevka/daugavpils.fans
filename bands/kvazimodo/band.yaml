description: 'Со слов Рыба.

  До 16-и лет я жил абсолютно спокойно. Т.е. без музыки. Почти. Всё закончилось, когда
  в кабинете истории Борька включил «Группу крови». И всё началось, когда сестра подарила
  мне «Легенда №0…» с кнопкой «запись».

  С Лёхой по-настоящему подружились в 10-м классе. Он сидел за одной партой с небезызвестным
  ныне Ю. Бердниковым, и мы втроём развлекались на уроках тем, что писали этакие поэмы-диалоги
  один другому… Типа: «о ты, проклятый Беларус, я выдерну твой лживый ус!», или же:
  «и я, по колено в воде утопая…» и т.д.

  Романтикам необходимо развитие. И оно пришло с кнопкой «запись», детской мини-гитарой,
  2-3-мя кастрюлями, плюс невостребованным унитазным стульчаком, который умел выдавать
  ритмы. Там, на «легенде» была ещё одна кнопка «1-3». В позиции «3» запись ускорялась
  до уровня «Чип и Дейл спешат на помощь», и композиции начинали звучать действительно
  прилично.

  Пели обо всём: «четвёртый день с сантимами», «я смотрю на Клаву», «архат, спускаясь
  с горы»… Единовременно Андрон обучал нас дворовым аккордам и, казалось, «nothing
  can stop us now!»…

  Но всё это сопли, предыстория… Уверенности в своих силах у нас было предостаточно.
  И вот, мой кузен - одноклассник Андрона и Варика, гениально влившийся в ряды 38-го
  ГПТУ, как-то пробалтывается, что у них в группе есть некий малый, который «дуркует»
  на реальных барабанах в аккомпанементе гитар, да бас-гитар. «Гм…», - подумали мы
  с Андроном и Вариком и достали две бутылки водки. Одну выпили при знакомстве с Олегом,
  а другую взяли с собой к ним на репетицию. Где впервые, перед нами, на грани респекта
  предстала даугавпилсская роцк-группа «Лом». Комната, в которой лабали мужчины, была
  невероятно маленькой… и там стояло: барабаны с подушкой в бочке, два гитариста,
  басист и серьёзный, доминирующий тип с роцк-гитарой.

  Я не помню, что именно мы сделали с водкой, зато помню их первые хиты «оборотень»
  и что-то про «свет в окне приходит мне»…

  Сама МАСТЮХА, само наличие андеграундной рок-группы на «новостройке» меня изумляло.
  НО. Мы-то знали, что и у нас есть пара задушевных тем пропеть… расчехлили, стало
  быть, акусты. Сыграли «ни слова о любви». И тут руководитель материй ихний Гоблин
  сказал что-то типа «а хули…» и тут же песенку эту по-барски как-то разложил на гитарёхе
  своей. Так мы узнали о том, что есть гитара, и что есть соло-гитара, и что, в принципе,
  ещё есть бас.

  Расстались мы друзьями. Да и как иначе, ебть! Одно ж дело будем делать, да? При
  этом, каждый в Квази понял, что пора чесать репу насчёт всех этих соло-ритм-басов,
  Квазимодой то мы назвались ещё при унитазном стульчаке и 3-ей скорости, теперь наступали
  иные времена…

  Мы уже довольно ловко переползали пальцами с ля минор на баре соль мажор, когда
  повадились появляться в пустующей однокомнатке с буржуйкой в арке у Педа. Отец мой,
  в силу уважительных причин, любил держать там одну-другую канистру спирта, на которые
  время от времени у нас возникали виды. Место любовно назвали Ямой. И весь тот период
  мы звались хомо-ямос, говорили друг другу «ыаргхр» и особо крючковато жали руки.
  Однажды пригласили в Яму двух нелепых Маринок из «первомайки» и по очереди танцевали
  с ними медляки под собственные песни под акуст.

  Варик же был пылко влюблён у себя во дворе, а она ещё и пела… И не где-то, а в нашей
  первомайке у мужчины, который предводил специально предназначенный кружок… Ну и
  расчехлили мы акусты…

  Я помню, как Янсон отошёл к окну и с не угадываемым выражением на лице слушал. Я
  помню что-то вроде: «примечательно, вот приходят ко мне три таких молодых человека,
  и эдак как-то исполняют «я сижу, нормально сижу…», и что интересно - мне нравится».

  Янсон взялся за нас с душой.

  Не было никаких лекций насчёт теорий аранжировки и т.п. Было так: «ты, Варик, играешь
  «бум-пум», ты, Андрюша - «трапа-ти-ту-ти-уа», а ты, Саша… ну, шлёпай свои аккорды…».
  Сам он садился за установку и ровненько так нам стучал. И было нам ЗА ЩАСТЬЕ!

  Первый, пробный концерт состоялся в «Торговке», толи на новый год, толи на рождество,
  где вышли мы втроём в чёрных джинсиках и чёрных водолазочках с акустиками. И не
  слажали. Правда, сейчас я понимаю, что большинство поваров-официантов недопоняло
  чего это мы… да плевать, шажок был сделан. Потом был рок-концерт в Варпе со всякими
  олдами типа «overnight sensation», юношами «Двинск», обозлёнными «Neisseria» и невезучими
  «Камчатка». Плюс солодовое какое-то пиво и девчёнки-хиппи, впервые виданные в Д-се!
  Я пришёл домой, мама вышла в прихожую с плохо маскируемым намерением установить
  мои промилле, спросила: «ну как?», я сказал: «успех» и разметав руки уснул в прихожей.
  Я ж говорю - солодовое какое-то пиво.

  А то, что мы назвали первый альбом «Проникни в мой сад», было записано за один вечер,
  без наложений, на бобину, там же у Янсона в Яунибе. И! Это сейчас я догоняю всё
  геройство Андрона, который всего лишь через год стал одновременно играть на гитаре
  соло и петь! Варик неумолимо наращивал басистские пальцы, а я писал пиестни, одна
  новее другой. Дело перевалило за первый альбом и «Квазимодо» обзавелось (не без
  помощи Гоблина) своим родным драммером - Андрисом Зелчем. Обычно, за всю репетицию
  он говорил одну-две фразы. Толи присматривался и взвешивал каждое слово, толи просто
  предпочитал про себя думать. Два спасибо - в юмор врубался и стучал ровно.

  В определённый момент, дабы подразгрузить соло Андрона от вокала, к пению был возрождён
  Лёха - на то время историк, студент DPU. К сожалению, счастье не долго длилось,
  после концерта в «желдор»-технаре, где, кстати, впервые столкнулись с M-spirit на
  лестнице за пивом, Лёха потерял интерес к карьере рок-вокалиста. Возможно из-за
  статьи, в которой о нас были такие строки: «а вокалист Квазимодо визжал так, что
  было слышно на трамвайной остановке у LRZ». От сцука!

  Следующим певцом стал Шура Некрофил, который по всем квазимодовским статьям нам
  подходил и тему рубил. Но тут заборола нас поганая судьба. Завлюблялися два мальчугана
  до одной. И вышло, что один ушёл с женою, а другой с Квазимодо… И в тот момент,
  когда Андрон исчез из Квазимодо, исчезло и само Квазимодо. Но мы КОНЕЧНО ЖЕ всё
  ещё пытались его продержать. Роцк-группа «Двинск» толи распалась, толи развалилась,
  и Кузя был известен тем, что он свободен… Его-то мы и подключили.

  Очень тяжело мне было слышать его «hard and heavy» соляги на родные текста… Просто
  нужно было работать, положить ещё один год, включить Кузю в «эстетику». Нужно было,
  нужно для того, чтобы получился второй альбом… НО я уже о нём не заботился, меня
  пёрли новые песни. Я не стал делать второй альбом «Твоё радио лжёт», в тот момент
  мне казалось это правильным. Сейчас я знаю - I was wrong, надо было напрячься, и
  напрячь Кузю, он врубной, догнал бы… Но я забил Х и занялся другим проектом - «Стельки
  Бетонщика», куда вошли некоторые песни квази. А мужчины доделали альбом самостоятельно.
  Я не мог его слушать до какого-то периода, а потом понял - им «спасибо» надо сказать,
  что они забомбили то, что было зрелым… Это всё козерожества юности, бескомпромиссность,
  ебть. А не было б этой записи у Кузи - ничего бы не было.

  '
description_en: 'In Ryb''s own words.

  Up until I was 16 I lived a completely calm life. That is, without music. Almost.
  It all ended when Borka put on Kino''s "Gruppa Krovi" in history class. And it all
  began when my sister gave me a "Legenda №0…" cassette recorder with a "record" button.

  Lyokha and I really became friends in 10th grade. He sat at the same desk as the
  now not-unknown Yu. Bernikov, and the three of us amused ourselves in class by writing
  each other little poem-dialogues… Things like: "oh you, damned Belarus, I''ll pull
  out your lying moustache!", or: "and I, drowning knee-deep in water…" and so on.

  Romantics need to develop. And it came with the "record" button, a child''s mini-guitar,
  2-3 pots, plus an unclaimed toilet seat lid that turned out to be good for rhythm.
  The "Legenda" also had another button, "1-3". In position "3" the tape sped up to
  "Chip ''n Dale Rescue Rangers" level, and the songs actually started to sound decent.

  We sang about everything: "fourth day with centimes", "I''m looking at Klava", "an
  arhat coming down the mountain"… At the same time Andron taught us yard chords,
  and it felt like "nothing can stop us now!"…

  But all that''s just fluff, backstory… We had plenty of confidence in ourselves.
  And then my cousin - a classmate of Andron''s and Varik''s who''d brilliantly ended
  up at Vocational School No. 38 - let slip one day that in his group there was some
  guy who "fools around" on real drums accompanying guitars and bass. "Hm…," Andron
  and Varik and I thought, and got hold of two bottles of vodka. We drank one meeting
  Oleg, and brought the other along to their rehearsal. Where, for the first time,
  right in front of us, on the edge of real respect, stood the Daugavpils rock band
  "Lom" ("Scrap Metal"). The room those guys jammed in was unbelievably small… and
  in it stood: drums with a pillow in the kick, two guitarists, a bassist, and a serious,
  dominant type with a rock guitar.

  I don''t remember exactly what we did with the vodka, but I remember their first
  hits, "Werewolf" and something about "light in the window comes to me"…

  The sheer scale of it, the mere fact that there was an underground rock band in
  our "new development" neighborhood, amazed me. BUT. We knew we had a couple of heartfelt
  tunes of our own to sing… so out came the acoustics. We played "Ни слова о любви"
  ("Not a Word About Love"). And their bandleader, Goblin, said something like "well
  hell…" and immediately reworked the song on his guitar in his own masterly way.
  That''s how we learned there was such a thing as a guitar, and a lead guitar, and,
  in principle, a bass too.

  We parted as friends. How else, really! We were basically in the same line of work,
  right? At the same time, everyone in Kvazi realized it was time to figure out all
  this lead-rhythm-bass business - we''d already been calling ourselves Kvazimodo
  back in the toilet-seat-and-3rd-speed days, but now different times were coming…

  We were already getting pretty good at sliding our fingers from A minor to a barred
  G major, when we took to hanging around an empty one-room place with a wood stove
  in the archway by the Pedagogical Institute. My father, for good reason, liked to
  keep a canister or two of spirit there, which we''d occasionally take an interest
  in. We lovingly named the place the Pit ("Yama"). And for that whole period we called
  ourselves the homo-yamos, said "yaarghr" to each other, and shook hands in a particularly
  hooked way. Once we invited two ridiculous girls named Marinka from the Pervomaika
  neighborhood into the Pit and took turns slow-dancing with them to our own acoustic
  songs.

  Varik, meanwhile, was passionately in love with a girl from his own courtyard -
  who also sang. And not just anywhere, but in our Pervomaika, under a man who ran
  a club specifically for that… So we got the acoustics out again…

  I remember Ianson stepping over to the window and listening with an unreadable expression.
  I remember something like: "remarkable - here come three young men like this, and
  they perform something like ''I''m sitting, just sitting normally…'', and, interestingly
  enough - I like it."

  Ianson took us on with real heart.

  There were no lectures about arrangement theory or anything like that. It went like
  this: "you, Varik, play ''boom-pum'', you, Andryusha - ''trapa-ti-tu-ti-ua'', and
  you, Sasha… well, just strum your chords…" He''d sit down at the kit himself and
  keep it nice and steady for us. And we were IN HEAVEN!

  Our first, trial concert took place at "Torgovka", either for New Year or Christmas,
  where the three of us went out in black jeans and black turtlenecks with acoustics.
  And we didn''t mess it up. Though now I understand most of the cooks and waiters
  had no idea what we were doing… whatever, a step had been taken. Then came a rock
  concert at Varpa with all sorts of veterans like "Overnight Sensation", the young
  guys of "Dvinsk", the angry "Neisseria", and the unlucky "Kamchatka". Plus some
  malt beer and hippie girls, seen for the first time in Daugavpils! I came home,
  my mother came out into the hallway with a poorly disguised intention of checking
  my blood alcohol, asked "well, how was it?", I said "success" and passed out in
  the hallway, arms spread wide. Like I said - some kind of malt beer.

  What we called our first album, "Проникни в мой сад" ("Get Into My Garden"), was
  recorded in one evening, with no overdubs, straight to reel, right there at Ianson''s
  in Yaunība. And! It''s only now that I fully appreciate Andron''s heroics - within
  just a year he was playing lead guitar and singing at the same time! Varik kept
  relentlessly building up his bass fingers, and I kept writing songs, each newer
  than the last. We got past the first album and "Kvazimodo" acquired (not without
  Goblin''s help) its own dedicated drummer - Andris Zelch. Usually, over a whole
  rehearsal, he''d say one or two sentences. Either he was sizing things up and weighing
  every word, or he just preferred to keep his thoughts to himself. Two things in
  his favor - he got the humor, and he kept steady time.

  At a certain point, to take some of the load of singing off Andron''s solo work,
  Lyokha was brought back in to sing - by then a history student at DPU. Unfortunately,
  the happiness didn''t last long: after a concert at the railway technical school,
  where, incidentally, we first ran into M-Spirit on the stairs getting beer, Lyokha
  lost interest in a rock-vocalist career. Possibly because of an article about us
  that included the line: "and Kvazimodo''s singer screeched so loud it could be heard
  at the tram stop by LRZ." Damn it!

  The next singer was Shura Nekrofil, who fit the Kvazimodo mold in every way and
  got the vibe. But then rotten fate got the better of us. Two guys fell in love with
  the same girl. And it turned out one left with the wife, and the other left with
  Kvazimodo… And the moment Andron disappeared from Kvazimodo, Kvazimodo itself disappeared
  with him. But we OF COURSE still tried to keep it going. The rock band "Dvinsk"
  had either broken up or fallen apart, and Kuzya was known to be available… so we
  brought him in.

  It was very hard for me to hear his "hard and heavy" guitar solos over our own native
  lyrics… It just needed work, another year put into it, folding Kuzya into the "aesthetic".
  It was needed, needed to actually get a second album made… BUT I''d already stopped
  caring about it by then, new songs were pushing at me. I didn''t make the second
  album, "Твоё радио лжёт" ("Your Radio Is Lying") - at the time it felt like the
  right call. Now I know - I was wrong, I should''ve pushed through, and pushed Kuzya
  too, he was sharp, he''d have kept up… But I said screw it and started another project,
  "Стельки Бетонщика" ("The Concrete Layer''s Insoles"), which absorbed some of the
  Kvazi songs. The guys finished the album on their own. I couldn''t listen to it
  for a while, and then I understood - they deserve a "thank you" for finishing what
  had actually matured… That''s all just the uncompromising arrogance of youth, damn
  it. If it weren''t for that recording of Kuzya''s, there would''ve been nothing
  at all.

  '
