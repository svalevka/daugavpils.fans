  mija. Grupa speleja lielos Daugavpils pasakumos, tostarp brivdabas festivala 'Latgales
  Gaisma / Stalkers' 2000. gada septembri kopa ar Carpe Diem, CrossFire un Dvojnaja
  Voda.
