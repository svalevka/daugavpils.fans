description: X-Press System — даугавпилсская альтернативная группа рубежа тысячелетий.
  Выступала на знаковых городских рок-мероприятиях, включая фестиваль «Latgales Gaisma
  / Stalkers» в сентябре 2000 года, вместе с Carpe Diem, CrossFire и «Двойная Вода».
description_en: X-Press System was a Daugavpils alternative rock and nu-metal trio
  at the turn of the millennium. They performed at major local rock events, notably
  the September 2000 'Latgales Gaisma / Stalkers' open-air festival alongside Carpe
  Diem, CrossFire, and Dvojnaja Voda.
