description: 'Группа Loengrin была создана в 2007 году в сентябре. Первоначальный
  состав: Ярослав Гаврилов (вокал, гитара), Никита Гаврилов (бас-гитара), Сергей Никитин
  (ударные), Денис Журидов (гитара), Лана Иванова (клавиши, бэк-вокал). Таким составом
  Loengrin просуществовал 3 месяца. В связи с музыкальными разногласиями группу покинули
  3 человека


  На данный момент состав изменился: Ярослав Гаврилов (вокал, гитара), Макс Сташан
  (гитара) Стас Козловский (контрабас, бас, бэк-вокал) Лана Иванова (клавиши, бэк-вокал).
  Сейчас записываем новый материал.


  В составе опять произошли изменения. Место Стаса Козловского занял Стас Граблевский.
  Также к группе присоединился Виталий Соловьёв (ударник). Нынешний состав: Ярослав
  Гаврилов (вокал, гитара) Макс Сташан (гитара) Стас Граблевский (контрабас, бэк-вокал)
  Виталий Соловьёв (ударные) Лана Иванова (клавиши, бэк-вокал).


  Перемены не заставили себя долго ждать. Перед вторым концертом группу покинул Стас
  Граблевский (контрабас), а после выступления по ряду причин в группе не стало ещё
  двух участников: Макса Сташана (гитара) и Виталия Соловьёва (ударные).


  Совсем недавно к группе присоединился Александр Волков (бас-гитара). Поэтому, в
  данное время, группа существует в следующем составе: Ярослав Гаврилов (вокал, гитара)
  Александр Волков. (бас-гитара) Лана Иванова (клавиши, бэк-вокал).


  Теперь мы рады сообщить, что к группе присоединился Артём Берёза (гитара)! В этом
  же составе группа Loengrin выступит и на концерте: Ярослав Гаврилов (вокал, гитара)
  Александр Волков. (бас-гитара) Артём Берёза (гитара) Лана Иванова (клавиши, бэк-вокал)


  Группу покинула Лана Иванова (клавиши). Теперь группа продолжит своё существование
  в следующес составе: Ярослав Гаврилов (вокал, гитара) Александр Волков (бас-гитара)
  Артём Берёза (гитара)'
description_en: 'Loengrin was formed in September 2007. The original lineup: Yaroslav
  Gavrilov (vocals, guitar), Nikita Gavrilov (bass guitar), Sergei Nikitin (drums),
  Denis Zhuridov (guitar), Lana Ivanova (keys, backing vocals). Loengrin lasted three
  months with this lineup. Because of musical differences, three people left the band.


  At the moment the lineup has changed: Yaroslav Gavrilov (vocals, guitar), Maks Stashan
  (guitar), Stas Kozlovsky (double bass, bass, backing vocals), Lana Ivanova (keys,
  backing vocals). We are currently recording new material.


  The lineup has changed again. Stas Kozlovsky''s place was taken by Stas Grablevsky.
  Vitaly Solovyov (drummer) also joined the band. Current lineup: Yaroslav Gavrilov
  (vocals, guitar), Maks Stashan (guitar), Stas Grablevsky (double bass, backing vocals),
  Vitaly Solovyov (drums), Lana Ivanova (keys, backing vocals).


  The changes didn''t take long. Before the second concert Stas Grablevsky (double
  bass) left the band, and after the performance, for a number of reasons, two more
  members were gone: Maks Stashan (guitar) and Vitaly Solovyov (drums).


  Aleksandr Volkov (bass guitar) joined the band very recently. So, at this time,
  the band exists in the following lineup: Yaroslav Gavrilov (vocals, guitar), Aleksandr
  Volkov (bass guitar), Lana Ivanova (keys, backing vocals).


  Now we are glad to announce that Artyom Beryoza (guitar) has joined the band! Loengrin
  will play the concert in this same lineup: Yaroslav Gavrilov (vocals, guitar), Aleksandr
  Volkov (bass guitar), Artyom Beryoza (guitar), Lana Ivanova (keys, backing vocals).


  Lana Ivanova (keys) has left the band. The band will now continue in the following
  lineup: Yaroslav Gavrilov (vocals, guitar), Aleksandr Volkov (bass guitar), Artyom
  Beryoza (guitar).'
description_lv: 'Grupa «Loengrin» tika izveidota 2007. gada septembrī. Sākotnējais
  sastāvs: Jaroslavs Gavrilovs (vokāls, ģitāra), Ņikita Gavrilovs (basģitāra), Sergejs
  Ņikitins (bungas), Deniss Žuridovs (ģitāra), Lana Ivanova (taustiņinstrumenti, pavadošais
  vokāls). Šādā sastāvā «Loengrin» pastāvēja 3 mēnešus. Muzikālu domstarpību dēļ grupu
  pameta 3 cilvēki.


  Šobrīd sastāvs ir mainījies: Jaroslavs Gavrilovs (vokāls, ģitāra), Makss Stašans
  (ģitāra), Stass Kozlovskis (kontrabass, bass, pavadošais vokāls), Lana Ivanova (taustiņinstrumenti,
  pavadošais vokāls). Pašlaik ierakstām jaunu materiālu.


  Sastāvā atkal notikušas izmaiņas. Stasa Kozlovska vietu ieņēma Stass Grablevskis.
  Grupai pievienojās arī Vitālijs Solovjovs (bundzinieks). Pašreizējais sastāvs: Jaroslavs
  Gavrilovs (vokāls, ģitāra), Makss Stašans (ģitāra), Stass Grablevskis (kontrabass,
  pavadošais vokāls), Vitālijs Solovjovs (bungas), Lana Ivanova (taustiņinstrumenti,
  pavadošais vokāls).


  Pārmaiņas nelika sevi ilgi gaidīt. Pirms otrā koncerta grupu pameta Stass Grablevskis
  (kontrabass), bet pēc uzstāšanās vairāku iemeslu dēļ grupā vairs nebija vēl divu
  dalībnieku: Maksa Stašana (ģitāra) un Vitālija Solovjova (bungas).


  Pavisam nesen grupai pievienojās Aleksandrs Volkovs (basģitāra). Tāpēc šobrīd grupa
  pastāv šādā sastāvā: Jaroslavs Gavrilovs (vokāls, ģitāra), Aleksandrs Volkovs (basģitāra),
  Lana Ivanova (taustiņinstrumenti, pavadošais vokāls).


  Tagad ar prieku paziņojam, ka grupai pievienojies Artjoms Berjoza (ģitāra)! Šajā
  pašā sastāvā «Loengrin» uzstāsies arī koncertā: Jaroslavs Gavrilovs (vokāls, ģitāra),
  Aleksandrs Volkovs (basģitāra), Artjoms Berjoza (ģitāra), Lana Ivanova (taustiņinstrumenti,
  pavadošais vokāls).


  Grupu pameta Lana Ivanova (taustiņinstrumenti). Tagad grupa turpinās pastāvēt šādā
  sastāvā: Jaroslavs Gavrilovs (vokāls, ģitāra), Aleksandrs Volkovs (basģitāra), Artjoms
  Berjoza (ģitāra).'
