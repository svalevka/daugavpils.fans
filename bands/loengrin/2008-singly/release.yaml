description: Две песни, выложенные группой для скачивания на своём сайте loengrin.ucoz.lv.
  «Ночное волшебство» написана в 2007 году (выложена 12.10.2008); «Вестник Зари» записана
  в октябре 2008 года (выложена 02.11.2008). Других сведений о записи не сохранилось.
description_en: Two songs the band posted for download on its website loengrin.ucoz.lv.
  "Nochnoe volshebstvo" (Night Magic) was written in 2007 (posted 12 Oct 2008); "Vestnik
  Zari" (Herald of Dawn) was recorded in October 2008 (posted 2 Nov 2008). No further
  details about the recordings survive.
description_lv: Divas dziesmas, ko grupa ievietoja lejupielādei savā vietnē loengrin.ucoz.lv.
  «Nočnoje volšebstvo» («Nakts burvība») sarakstīta 2007. gadā (ievietota 12.10.2008);
  «Vestnik Zari» («Rītausmas vēstnesis») ierakstīta 2008. gada oktobrī (ievietota
  02.11.2008). Citas ziņas par ierakstu nav saglabājušās.
