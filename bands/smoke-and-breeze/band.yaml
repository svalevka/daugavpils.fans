description: Smoke & Breeze — даугавпилсская альтернативная инди-рок группа, победившая
  на городском конкурсе «Daugavpils Rok maratons 2018» (1-е место). Отличалась мелодичным
  звучанием с атмосферными гитарными партиями.
description_en: Smoke & Breeze was a Daugavpils alternative and indie rock outfit
  that won 1st place at the Daugavpils Rock Marathon 2018. Known for melodious songcraft
  and dynamic indie rock arrangements.
description_lv: Smoke & Breeze bija Daugavpils alternativā un indie roka grupa, kas
  izcinija 1. vietu konkursa 'Daugavpils Rok maratons 2018'. Grupu raksturoja melodisks
  skanejums un dinamiskas gitaru partijas.
