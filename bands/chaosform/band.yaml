description: 'Группа Neisseria нашла замену второму гитаристу в лице Руслана (Гоблин):
  ex-Двинск, ex-Фобия, ex-FBI. С приходом нового участника группа решила поменять
  название на ChaosForm. В середине 1995-го группа написала новый материал full promo
  EP Fear и два ковера MorbidAngel и Carcass. ChaosForm решили записать свой новый
  материал в местной студии Elpa (promo-demo FaceDown 95) и выступили на одном из
  своих последних концертов на местной сцене. Участники ChaosForm решили продолжать
  свое творчество, но в других местах и на других континентах.


  Состав:

  Руслан (гитара)

  Егор (гитара)

  Виктор (бас, вокал)

  Игорь (ударные)


  Записано 05.05.95, Studio Elpa, звукооператор Rundzins, продюсирование Rundzins
  & ChaosForm, музыка ChaosForm, лирика Егор и Виктор.'
description_en: 'Neisseria found a replacement for their second guitarist in Ruslan
  ("Goblin"): ex-Dvinsk, ex-Phobia, ex-FBI. With the arrival of the new member, the
  band decided to change their name to ChaosForm. In mid-1995, the band composed new
  material for the full promo EP "Fear" alongside two covers of Morbid Angel and Carcass.
  ChaosForm decided to record their new material at the local Studio Elpa (promo-demo
  "FaceDown 95") and performed at one of their final concerts on the local scene.
  The members of ChaosForm then decided to pursue their creative paths in other places
  and across other continents.


  Lineup:

  Ruslan (guitar)

  Egor (guitar)

  Viktor (bass, vocals)

  Igor (drums)


  Recorded on 05.05.1995 at Studio Elpa, sound engineer Rundzins, produced by Rundzins
  & ChaosForm, music by ChaosForm, lyrics by Egor and Viktor.'
