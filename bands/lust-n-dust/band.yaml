description: Lust'n'Dust — молодежная альтернативная пост-хардкор группа из Даугавпилса.
  Заняла 2-е место на общегородском конкурсе «Daugavpils Rok maratons 2018», став
  одной из самых заметных молодых тяжелых команд города конца 2010-х годов.
description_en: Lust'n'Dust was a Daugavpils post-hardcore and emo/alternative rock
  band. They won 2nd place at the Daugavpils Rock Marathon 2018, marking them as one
  of the standout youth rock acts in Latgale in the late 2010s.
description_lv: Lust'n'Dust bija Daugavpils post-hardcore un alternativā roka jaunatnes
  grupa. Iegūva 2. vietu konkursa 'Daugavpils Rok maratons 2018', kluvod par vienu
  no spilgtakajam smagas muzikas jaunajam grupam Latgale.
